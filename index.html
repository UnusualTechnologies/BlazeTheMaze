        // --- ENTITY CLASSES ---
        class Cell {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.walls = [true, true, true, true]; 
                this.visited = false;
            }
        }

        class Shockwave {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.life = 1.0;
                this.maxRadius = cellSize * 4;
            }
            update(dt) {
                this.life -= dt * 0.002; 
                return this.life > 0;
            }
            draw() {
                const currentRadius = (1 - this.life) * this.maxRadius;
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.life * 8;
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                // Faster and more dramatic burst speed for stronger visual impact
                const speed = (Math.random() * 15 + 4) * (cellSize * 0.02); 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01; 
                this.size = Math.random() * (cellSize * 0.25) + 2;
            }
            update(dt) {
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.x += this.vx * (dt * 0.05);
                this.y += this.vy * (dt * 0.05);
                this.life -= this.decay * (dt * 0.05);
                return this.life > 0;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }
        
        class TrailParticle {
            constructor(x, y, color, bugSize) {
                this.x = x + (Math.random() - 0.5) * bugSize * 0.8;
                this.y = y + (Math.random() - 0.5) * bugSize * 0.8;
                this.color = color;
                this.life = 0.6 + Math.random() * 0.4;
                this.decay = 0.05 + Math.random() * 0.04;
                this.size = bugSize * (0.08 + Math.random() * 0.18);
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
            }
            update(dt) {
                this.x += this.vx * (dt * 0.05);
                this.y += this.vy * (dt * 0.05);
                this.life -= this.decay * (dt * 0.05);
                return this.life > 0;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life * 0.85);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        class Rocket {
            constructor(x, y, color, ownerBug) {
                this.gridX = x;
                this.gridY = y;
                this.pixelX = x * cellSize + cellSize / 2;
                this.pixelY = y * cellSize + cellSize / 2;
                this.color = color;
                this.owner = ownerBug;
                this.moveTimer = 0;
                this.moveInterval = 100; // Zooms at 100ms per square
                this.life = true;
                this.angle = 0;
                this.stepsTaken = 0;
            }

            update(dt) {
                this.moveTimer += dt;
                
                // Smooth visual following
                const targetX = this.gridX * cellSize + cellSize / 2;
                const targetY = this.gridY * cellSize + cellSize / 2;
                this.pixelX += (targetX - this.pixelX) * 0.4;
                this.pixelY += (targetY - this.pixelY) * 0.4;

                if (this.moveTimer >= this.moveInterval) {
                    this.moveTimer = 0;
                    this.step();
                }
                return this.life;
            }

            step() {
                if (this.gridX === goal.x && this.gridY === goal.y) {
                    this.life = false;
                    for(let i=0; i<20; i++) particles.push(new Particle(this.pixelX, this.pixelY, this.color));
                    return;
                }

                const currDist = distanceMap[this.gridX][this.gridY];
                let bestMove = null;
                let minDist = currDist;
                
                const cell = grid[this.gridX][this.gridY];

                if (!cell.walls[0] && distanceMap[this.gridX][this.gridY-1] < minDist) { bestMove = {dx: 0, dy: -1}; minDist = distanceMap[this.gridX][this.gridY-1]; }
                if (!cell.walls[1] && distanceMap[this.gridX+1][this.gridY] < minDist) { bestMove = {dx: 1, dy: 0}; minDist = distanceMap[this.gridX+1][this.gridY]; }
                if (!cell.walls[2] && distanceMap[this.gridX][this.gridY+1] < minDist) { bestMove = {dx: 0, dy: 1}; minDist = distanceMap[this.gridX][this.gridY+1]; }
                if (!cell.walls[3] && distanceMap[this.gridX-1][this.gridY] < minDist) { bestMove = {dx: -1, dy: 0}; minDist = distanceMap[this.gridX-1][this.gridY]; }

                if (bestMove) {
                    this.gridX += bestMove.dx;
                    this.gridY += bestMove.dy;
                    this.angle = Math.atan2(bestMove.dy, bestMove.dx);
                    this.stepsTaken++;
                } else {
                    this.life = false;
                }

                // Check collision with bugs on the way
                bugs.forEach(b => {
                    if (b.gridX === this.gridX && b.gridY === this.gridY && b.state === 'normal') {
                        // Don't hit yourself on the exact frame it launches
                        if (b === this.owner && this.stepsTaken === 0) return;
                        
                        startTeleport(b);
                        screenShake = 10;
                        for(let i=0; i<15; i++) particles.push(new Particle(this.pixelX, this.pixelY, this.color));
                    }
                });

                if (this.gridX === goal.x && this.gridY === goal.y) {
                    this.life = false;
                    for(let i=0; i<20; i++) particles.push(new Particle(this.pixelX, this.pixelY, this.color));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.pixelX, this.pixelY);
                ctx.rotate(this.angle + Math.PI / 2); // Point triangle in direction of travel
                ctx.beginPath();
                ctx.moveTo(0, -cellSize * 0.4);
                ctx.lineTo(cellSize * 0.25, cellSize * 0.25);
                ctx.lineTo(0, cellSize * 0.1);
                ctx.lineTo(-cellSize * 0.25, cellSize * 0.25);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Bug {
            constructor(data) {
                const pos = getStartPos(data.startIndex || 0);
                this.gridX = data.x !== undefined ? data.x : pos.x;
                this.gridY = data.y !== undefined ? data.y : pos.y;
                this.pixelX = 0;
                this.pixelY = 0;
                this.lastPixelX = 0;
                this.lastPixelY = 0;
                
                this.id = data.id;
                this.sessionId = data.sessionId || null;
                this.color = data.color;
                this.isPlayer = data.isPlayer;
                this.isLocal = !!data.isLocal;
                this.controlScheme = data.controlScheme || 'WASD';
                
                this.trail = [];
                this.maxTrail = 25;
                this.moveTimer = 0;
                this.lastTrailParticleX = 0;
                this.lastTrailParticleY = 0;

                // Stable per-bug particle dot offsets for body rendering
                this.particleOffsets = [];
                for (let i = 0; i < 9; i++) {
                    const a = (i / 9) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
                    const r = 0.45 + Math.random() * 0.55;
                    const s = 0.12 + Math.random() * 0.18;
                    this.particleOffsets.push({ a, r, s, phase: Math.random() * Math.PI * 2 });
                }
                
                // Parse AI settings
                if (!this.isPlayer) {
                    let sType = data.aiSpeed;
                    if (sType === 'random') {
                        const speeds = ['scaling', 'easy', 'intermediate', 'hard'];
                        sType = speeds[Math.floor(Math.random() * speeds.length)];
                    }
                    this.aiSpeedType = sType;
                    
                    let bType = data.aiBehavior;
                    if (bType === 'random') {
                        const behaviors = ['explorer', 'guesser', 'focused'];
                        bType = behaviors[Math.floor(Math.random() * behaviors.length)];
                    }
                    this.aiBehavior = bType;

                    let aiCooldown = AI_SPEEDS.intermediate;
                    if (this.aiSpeedType === 'easy') aiCooldown = AI_SPEEDS.easy;
                    else if (this.aiSpeedType === 'intermediate') aiCooldown = AI_SPEEDS.intermediate;
                    else if (this.aiSpeedType === 'hard') aiCooldown = AI_SPEEDS.hard;
                    else if (this.aiSpeedType === 'custom') aiCooldown = data.aiCustomSpeed;
                    else if (this.aiSpeedType === 'scaling') {
                        let highestHumanScore = -1;
                        activePlayersData.forEach(p => {
                            if (p.isPlayer) {
                                const s = scores[p.id] || 0;
                                if (s > highestHumanScore) highestHumanScore = s;
                            }
                        });
                        
                        if (highestHumanScore === 0) aiCooldown = AI_SPEEDS.easy;
                        else if (highestHumanScore === 1) aiCooldown = AI_SPEEDS.intermediate;
                        else if (highestHumanScore >= 2) aiCooldown = AI_SPEEDS.hard;
                        else aiCooldown = AI_SPEEDS.easy; // fallback if no humans
                    }
                    this.moveCooldown = aiCooldown;

                    if (this.aiBehavior === 'guesser') {
                        // Pick a random destination that isn't the main goal
                        let rx = goal.x, ry = goal.y;
                        while (rx === goal.x && ry === goal.y) {
                            rx = Math.floor(Math.random() * cols);
                            ry = Math.floor(Math.random() * rows);
                        }
                        this.guesserTarget = { x: rx, y: ry };
                        this.guesserDistanceMap = generateCustomDistanceMap(this.guesserTarget);
                    } else if (this.aiBehavior === 'explorer') {
                        this.explorerLastX = null;
                        this.explorerLastY = null;
                    }
                } else {
                    this.moveCooldown = 70; 
                }

                this.lastMoveTime = 0;
                this.lastDx = 0;
                this.lastDy = 0;

                this.heldDirections = [];
                this.turnIntent = null;
                this.swipeIntent = null;

                this.state = 'normal'; 
                this.stateTimer = 0;
                this.targetGridX = 0;
                this.targetGridY = 0;
                this.flashTimer = 0;
                
                this.bonkDx = 0;
                this.bonkDy = 0;
                this.bonkTimer = 0;

                this.radius = 0;
                this.updatePixelPos(true);
            }

            updatePixelPos(instant = false) {
                const targetX = this.gridX * cellSize + cellSize / 2;
                const targetY = this.gridY * cellSize + cellSize / 2;
                
                this.lastPixelX = this.pixelX;
                this.lastPixelY = this.pixelY;

                if (instant) {
                    this.pixelX = targetX;
                    this.pixelY = targetY;
                    this.lastPixelX = targetX;
                    this.lastPixelY = targetY;
                } else {
                    this.pixelX += (targetX - this.pixelX) * 0.4;
                    this.pixelY += (targetY - this.pixelY) * 0.4;
                }
            }

            canMove(dx, dy) {
                if (this.gridX + dx < 0 || this.gridX + dx >= cols || this.gridY + dy < 0 || this.gridY + dy >= rows) return false;
                const cell = grid[this.gridX][this.gridY];
                if (!cell || !cell.walls) return false;
                if (dy === -1 && !cell.walls[0]) return true; 
                if (dx === 1 && !cell.walls[1]) return true;  
                if (dy === 1 && !cell.walls[2]) return true;  
                if (dx === -1 && !cell.walls[3]) return true; 
                return false;
            }

            triggerBonk(dx, dy) {
                if (this.bonkTimer <= 0) Synth.bonk(this.isPlayer);
                this.bonkDx = dx;
                this.bonkDy = dy;
                this.bonkTimer = 1.0;
            }

            executeMove(dx, dy) {
                if (gameState !== 'PLAYING') return;

                if (dx !== this.lastDx || dy !== this.lastDy) {
                    Synth.turn(this.isPlayer);
                    this.lastDx = dx;
                    this.lastDy = dy;
                }

                this.gridX += dx;
                this.gridY += dy;
                this.lastMoveTime = performance.now();
                
                // Authoritative local check for sending moves to server
                const isActuallyLocal = (room && room.sessionId) ? (this.sessionId === room.sessionId) : this.isLocal;
                if (isActuallyLocal && room) {
                    room.send("move", { x: this.gridX, y: this.gridY });
                }
            }

            update(dt) {
                const now = performance.now();

                // Authoritative local check for movement prediction
                const isActuallyLocal = (room && room.sessionId) ? (this.sessionId === room.sessionId) : this.isLocal;

                if (this.isPlayer && this.state === 'normal' && isActuallyLocal) {
                    if (now - this.lastMoveTime >= this.moveCooldown) {
                        console.log(`[Update] ${this.id} (${this.sessionId}) moving locally. Room Local: ${room?.sessionId}`);
                        let moved = false;
                        
                        // 1. Check Input Intent Buffer (if player pressed turn slightly before intersection)
                        if (this.turnIntent && now - this.turnIntent.time < 300) {
                            let dx = 0, dy = 0;
                            if (this.turnIntent.dir === 'up') dy = -1;
                            else if (this.turnIntent.dir === 'right') dx = 1;
                            else if (this.turnIntent.dir === 'down') dy = 1;
                            else if (this.turnIntent.dir === 'left') dx = -1;

                            if (this.canMove(dx, dy)) {
                                this.executeMove(dx, dy);
                                moved = true;
                                
                                // Sync buffer with held directions to preserve alternating behavior
                                const idx = this.heldDirections.indexOf(this.turnIntent.dir);
                                if (idx > -1) {
                                    this.heldDirections.splice(idx, 1);
                                    this.heldDirections.unshift(this.turnIntent.dir);
                                }
                                
                                this.turnIntent = null; // consume intent
                            }
                        }

                        // 2. Check currently held directions (incorporates original fast-turn / zigzag logic)
                        if (!moved) {
                            for (let i = this.heldDirections.length - 1; i >= 0; i--) {
                                const dir = this.heldDirections[i];
                                let dx = 0, dy = 0;
                                if (dir === 'up') dy = -1;
                                else if (dir === 'right') dx = 1;
                                else if (dir === 'down') dy = 1;
                                else if (dir === 'left') dx = -1;

                                if (this.canMove(dx, dy)) {
                                    this.executeMove(dx, dy);
                                    moved = true;
                                    
                                    // Deprioritize the successfully executed direction by moving it to the start of the array
                                    this.heldDirections.splice(i, 1);
                                    this.heldDirections.unshift(dir);
                                    break; 
                                }
                            }
                        }

                        // 3. Mobile Swipe Intent
                        if (!moved && this.swipeIntent && now - this.swipeIntent.time < 400) {
                            if (this.canMove(this.swipeIntent.dx, this.swipeIntent.dy)) {
                                this.executeMove(this.swipeIntent.dx, this.swipeIntent.dy);
                                this.swipeIntent = null; 
                                moved = true;
                            }
                        }

                        if (!moved) {
                            let bonkDx = 0, bonkDy = 0;
                            if (this.turnIntent && now - this.turnIntent.time < 300) {
                                if (this.turnIntent.dir === 'up') bonkDy = -1;
                                else if (this.turnIntent.dir === 'right') bonkDx = 1;
                                else if (this.turnIntent.dir === 'down') bonkDy = 1;
                                else if (this.turnIntent.dir === 'left') bonkDx = -1;
                            } else if (this.heldDirections.length > 0) {
                                const dir = this.heldDirections[this.heldDirections.length - 1]; 
                                if (dir === 'up') bonkDy = -1;
                                else if (dir === 'right') bonkDx = 1;
                                else if (dir === 'down') bonkDy = 1;
                                else if (dir === 'left') bonkDx = -1;
                            } else if (this.swipeIntent && now - this.swipeIntent.time < 400) {
                                bonkDx = this.swipeIntent.dx;
                                bonkDy = this.swipeIntent.dy;
                            }
                            
                            if (bonkDx !== 0 || bonkDy !== 0) {
                                this.triggerBonk(bonkDx, bonkDy);
                            }
                        }
                    }
                }

                if (this.state === 'teleport_out') {
                    this.stateTimer -= dt * 0.003; 
                    if (this.stateTimer <= 0) {
                        this.state = 'teleport_in';
                        this.stateTimer = 1.0;
                        this.gridX = this.targetGridX;
                        this.gridY = this.targetGridY;
                        this.updatePixelPos(true);
                        this.trail = [];
                    }
                    return; 
                } else if (this.state === 'teleport_in') {
                    this.stateTimer -= dt * 0.003;
                    if (this.stateTimer <= 0) {
                        this.state = 'normal';
                        // Wipe explorer memory so it doesn't get confused by the teleport
                        if (!this.isPlayer && this.aiBehavior === 'explorer') {
                            this.explorerLastX = null;
                            this.explorerLastY = null;
                        }
                    }
                    return; 
                }

                this.updatePixelPos();

                if (this.flashTimer > 0) this.flashTimer -= dt * 0.005;
                if (this.bonkTimer > 0) this.bonkTimer -= dt * 0.01;

                this.trail.push({ x: this.pixelX, y: this.pixelY });
                if (this.trail.length > this.maxTrail) this.trail.shift();

                // Spawn trail particles spaced by movement distance
                const tdx = this.pixelX - this.lastTrailParticleX;
                const tdy = this.pixelY - this.lastTrailParticleY;
                const bugSize = cellSize * 0.30;
                if (tdx * tdx + tdy * tdy > (cellSize * 0.07) * (cellSize * 0.07)) {
                    particles.push(new TrailParticle(this.pixelX, this.pixelY, this.color, bugSize));
                    if (Math.random() < 0.6) particles.push(new TrailParticle(this.pixelX, this.pixelY, this.color, bugSize));
                    this.lastTrailParticleX = this.pixelX;
                    this.lastTrailParticleY = this.pixelY;
                }

                if (!this.isPlayer && gameState === 'PLAYING' && this.state === 'normal') {
                    this.moveTimer += dt;
                    if (this.moveTimer >= this.moveCooldown) {
                        this.moveTimer = 0;
                        this.aiTakeStep();
                    }
                }
            }

            aiTakeStep() {
                if (this.aiBehavior === 'explorer') {
                    // Check if we are closest to the goal
                    const myDist = distanceMap[this.gridX][this.gridY];
                    let minOtherDist = Infinity;
                    for (let i = 0; i < bugs.length; i++) {
                        if (bugs[i] !== this && bugs[i].state === 'normal') {
                            const otherDist = distanceMap[bugs[i].gridX][bugs[i].gridY];
                            if (otherDist < minOtherDist) minOtherDist = otherDist;
                        }
                    }

                    // If no one is in front of us, act Focused
                    if (myDist <= minOtherDist) {
                        let bestMove = null;
                        let minNeighborDist = myDist;

                        if (this.canMove(0, -1) && distanceMap[this.gridX][this.gridY-1] < minNeighborDist) { bestMove = {dx: 0, dy: -1}; minNeighborDist = distanceMap[this.gridX][this.gridY-1]; }
                        if (this.canMove(1, 0) && distanceMap[this.gridX+1][this.gridY] < minNeighborDist) { bestMove = {dx: 1, dy: 0}; minNeighborDist = distanceMap[this.gridX+1][this.gridY]; }
                        if (this.canMove(0, 1) && distanceMap[this.gridX][this.gridY+1] < minNeighborDist) { bestMove = {dx: 0, dy: 1}; minNeighborDist = distanceMap[this.gridX][this.gridY+1]; }
                        if (this.canMove(-1, 0) && distanceMap[this.gridX-1][this.gridY] < minNeighborDist) { bestMove = {dx: -1, dy: 0}; minNeighborDist = distanceMap[this.gridX-1][this.gridY]; }

                        if (bestMove) {
                            this.explorerLastX = this.gridX; // Keep memory updated
                            this.explorerLastY = this.gridY;
                            this.executeMove(bestMove.dx, bestMove.dy);
                            return;
                        }
                    }

                    let possibleMoves = [];
                    if (this.canMove(0, -1)) possibleMoves.push({dx: 0, dy: -1});
                    if (this.canMove(1, 0)) possibleMoves.push({dx: 1, dy: 0});
                    if (this.canMove(0, 1)) possibleMoves.push({dx: 0, dy: 1});
                    if (this.canMove(-1, 0)) possibleMoves.push({dx: -1, dy: 0});
                    
                    // Filter out the reverse move to avoid getting stuck vibrating back and forth
                    let forwardMoves = possibleMoves.filter(m => !(this.gridX + m.dx === this.explorerLastX && this.gridY + m.dy === this.explorerLastY));
                    
                    let chosenMove;
                    if (forwardMoves.length > 0) {
                        // Pick random unvisited pathway
                        chosenMove = forwardMoves[Math.floor(Math.random() * forwardMoves.length)];
                    } else if (possibleMoves.length > 0) {
                        // Dead end reached, forced to backtrack
                        chosenMove = possibleMoves[0]; 
                    }
                    
                    if (chosenMove) {
                        this.explorerLastX = this.gridX;
                        this.explorerLastY = this.gridY;
                        this.executeMove(chosenMove.dx, chosenMove.dy);
                    }
                    return;
                }

                if (this.aiBehavior === 'guesser') {
                    if (this.gridX === this.guesserTarget.x && this.gridY === this.guesserTarget.y) {
                        // We hit the guess location, convert to focused to hunt down the goal!
                        this.aiBehavior = 'focused';
                    } else {
                        // Follow the custom guess map
                        const currDist = this.guesserDistanceMap[this.gridX][this.gridY];
                        let bestMove = null;
                        let minNeighborDist = currDist;

                        if (this.canMove(0, -1) && this.guesserDistanceMap[this.gridX][this.gridY-1] < minNeighborDist) { bestMove = {dx: 0, dy: -1}; minNeighborDist = this.guesserDistanceMap[this.gridX][this.gridY-1]; }
                        if (this.canMove(1, 0) && this.guesserDistanceMap[this.gridX+1][this.gridY] < minNeighborDist) { bestMove = {dx: 1, dy: 0}; minNeighborDist = this.guesserDistanceMap[this.gridX+1][this.gridY]; }
                        if (this.canMove(0, 1) && this.guesserDistanceMap[this.gridX][this.gridY+1] < minNeighborDist) { bestMove = {dx: 0, dy: 1}; minNeighborDist = this.guesserDistanceMap[this.gridX][this.gridY+1]; }
                        if (this.canMove(-1, 0) && this.guesserDistanceMap[this.gridX-1][this.gridY] < minNeighborDist) { bestMove = {dx: -1, dy: 0}; minNeighborDist = this.guesserDistanceMap[this.gridX-1][this.gridY]; }

                        if (bestMove) this.executeMove(bestMove.dx, bestMove.dy);
                        return;
                    }
                }

                if (this.aiBehavior === 'focused') {
                    const currDist = distanceMap[this.gridX][this.gridY];
                    let bestMove = null;
                    let minDist = currDist;

                    if (this.canMove(0, -1) && distanceMap[this.gridX][this.gridY-1] < minDist) { bestMove = {dx: 0, dy: -1}; minDist = distanceMap[this.gridX][this.gridY-1]; }
                    if (this.canMove(1, 0) && distanceMap[this.gridX+1][this.gridY] < minDist) { bestMove = {dx: 1, dy: 0}; minDist = distanceMap[this.gridX+1][this.gridY]; }
                    if (this.canMove(0, 1) && distanceMap[this.gridX][this.gridY+1] < minDist) { bestMove = {dx: 0, dy: 1}; minDist = distanceMap[this.gridX][this.gridY+1]; }
                    if (this.canMove(-1, 0) && distanceMap[this.gridX-1][this.gridY] < minDist) { bestMove = {dx: -1, dy: 0}; minDist = distanceMap[this.gridX-1][this.gridY]; }

                    if (bestMove) this.executeMove(bestMove.dx, bestMove.dy);
                }
            }

            draw() {
                const size = cellSize * 0.30;
                const now = performance.now() * 0.001;
                const bodyColor = this.flashTimer > 0 ? '#ffffff' : this.color;

                ctx.save();
                ctx.translate(this.pixelX, this.pixelY);

                // Teleport effect
                if (this.state === 'teleport_out' || this.state === 'teleport_in') {
                    const scale = this.state === 'teleport_out' ? this.stateTimer : (1 - this.stateTimer);
                    ctx.scale(scale, scale);
                    ctx.rotate(this.stateTimer * 10);
                }

                // Bonk effect
                if (this.bonkTimer > 0) {
                    const offset = Math.sin(this.bonkTimer * 20) * 5 * this.bonkTimer;
                    ctx.translate(this.bonkDx * offset, this.bonkDy * offset);
                }

                ctx.fillStyle = bodyColor;

                // Outer halo — wide, soft
                ctx.shadowBlur = 50;
                ctx.shadowColor = this.color;
                ctx.globalAlpha = 0.18;
                ctx.beginPath();
                ctx.arc(0, 0, size * 1.7, 0, Math.PI * 2);
                ctx.fill();

                // Mid glow ring
                ctx.shadowBlur = 30;
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.arc(0, 0, size * 1.1, 0, Math.PI * 2);
                ctx.fill();

                // Bright core
                ctx.shadowBlur = 20;
                ctx.globalAlpha = 1.0;
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.5, 0, Math.PI * 2);
                ctx.fill();

                // Particle dots scattered around body
                for (const p of this.particleOffsets) {
                    const twinkle = 0.55 + Math.sin(now * 3.5 + p.phase) * 0.45;
                    ctx.globalAlpha = twinkle * 0.9;
                    ctx.shadowBlur = 10;
                    const px = Math.cos(p.a) * size * p.r;
                    const py = Math.sin(p.a) * size * p.r;
                    ctx.beginPath();
                    ctx.arc(px, py, size * p.s, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        function resizeCanvas() {
            let size = Math.min(gameContainer.clientWidth, gameContainer.clientHeight);
            width = size;
            height = size;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            cellSize = width / cols;
            bugs.forEach(bug => bug.updatePixelPos(true));
            draw(true);
        }

        function generateMaze() {
            grid = [];
            for (let x = 0; x < cols; x++) {
                grid[x] = [];
                for (let y = 0; y < rows; y++) grid[x][y] = new Cell(x, y);
            }

            // Force the goal to be a dead-end with exactly one entrance
            let goalCell = grid[goal.x][goal.y];
            goalCell.visited = true; 

            let entranceNeighbors = [];
            if (goal.y > 0) entranceNeighbors.push(grid[goal.x][goal.y - 1]);
            if (goal.x < cols - 1) entranceNeighbors.push(grid[goal.x + 1][goal.y]);
            if (goal.y < rows - 1) entranceNeighbors.push(grid[goal.x][goal.y + 1]);
            if (goal.x > 0) entranceNeighbors.push(grid[goal.x - 1][goal.y]);

            let entrance = entranceNeighbors[Math.floor(Math.random() * entranceNeighbors.length)];
            removeWalls(goalCell, entrance);

            entrance.visited = true;
            let frontier = getUnvisitedNeighbors(entrance);

            while (frontier.length > 0) {
                let randomIndex = Math.floor(Math.random() * frontier.length);
                let current = frontier[randomIndex];
                frontier.splice(randomIndex, 1);

                if (current.visited) continue;

                let visitedNeighbors = getVisitedNeighbors(current);
                if (visitedNeighbors.length > 0) {
                    let vNeighbor = visitedNeighbors[Math.floor(Math.random() * visitedNeighbors.length)];
                    removeWalls(current, vNeighbor);
                    current.visited = true;

                    let newNeighbors = getUnvisitedNeighbors(current);
                    for (let n of newNeighbors) {
                        if (!frontier.includes(n)) {
                            frontier.push(n);
                        }
                    }
                }
            }
            generateDistanceMap();
        }

        function getUnvisitedNeighbors(cell) {
            let n = [];
            let x = cell.x, y = cell.y;
            if (y > 0 && !grid[x][y - 1].visited) n.push(grid[x][y - 1]);
            if (x < cols - 1 && !grid[x + 1][y].visited) n.push(grid[x + 1][y]);
            if (y < rows - 1 && !grid[x][y + 1].visited) n.push(grid[x][y + 1]);
            if (x > 0 && !grid[x - 1][y].visited) n.push(grid[x - 1][y]);
            return n;
        }

        function getVisitedNeighbors(cell) {
            let n = [];
            let x = cell.x, y = cell.y;
            if (y > 0 && grid[x][y - 1].visited && !(x === goal.x && y - 1 === goal.y)) n.push(grid[x][y - 1]);
            if (x < cols - 1 && grid[x + 1][y].visited && !(x + 1 === goal.x && y === goal.y)) n.push(grid[x + 1][y]);
            if (y < rows - 1 && grid[x][y + 1].visited && !(x === goal.x && y + 1 === goal.y)) n.push(grid[x][y + 1]);
            if (x > 0 && grid[x - 1][y].visited && !(x - 1 === goal.x && y === goal.y)) n.push(grid[x - 1][y]);
            return n;
        }

        function removeWalls(a, b) {
            let x = a.x - b.x;
            if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
            else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }

            let y = a.y - b.y;
            if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
            else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        // Dedicated custom distance mapper for "Guesser" AI brains
        function generateCustomDistanceMap(target) {
            let customMap = Array(cols).fill().map(() => Array(rows).fill(Infinity));
            customMap[target.x][target.y] = 0;
            let queue = [{x: target.x, y: target.y}];

            while(queue.length > 0) {
                let curr = queue.shift();
                let cell = grid[curr.x][curr.y];

                if (!cell.walls[0] && customMap[curr.x][curr.y-1] === Infinity) { customMap[curr.x][curr.y-1] = customMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y-1}); }
                if (!cell.walls[1] && customMap[curr.x+1][curr.y] === Infinity) { customMap[curr.x+1][curr.y] = customMap[curr.x][curr.y] + 1; queue.push({x: curr.x+1, y: curr.y}); }
                if (!cell.walls[2] && customMap[curr.x][curr.y+1] === Infinity) { customMap[curr.x][curr.y+1] = customMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y+1}); }
                if (!cell.walls[3] && customMap[curr.x-1][curr.y] === Infinity) { customMap[curr.x-1][curr.y] = customMap[curr.x][curr.y] + 1; queue.push({x: curr.x-1, y: curr.y}); }
            }
            return customMap;
        }

        function generateDistanceMap() {
            distanceMap = Array(cols).fill().map(() => Array(rows).fill(Infinity));
            distanceMap[goal.x][goal.y] = 0;
            let queue = [{x: goal.x, y: goal.y}];

            while(queue.length > 0) {
                let curr = queue.shift();
                let cell = grid[curr.x][curr.y];

                if (!cell.walls[0] && distanceMap[curr.x][curr.y-1] === Infinity) { distanceMap[curr.x][curr.y-1] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y-1}); }
                if (!cell.walls[1] && distanceMap[curr.x+1][curr.y] === Infinity) { distanceMap[curr.x+1][curr.y] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x+1, y: curr.y}); }
                if (!cell.walls[2] && distanceMap[curr.x][curr.y+1] === Infinity) { distanceMap[curr.x][curr.y+1] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y+1}); }
                if (!cell.walls[3] && distanceMap[curr.x-1][curr.y] === Infinity) { distanceMap[curr.x-1][curr.y] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x-1, y: curr.y}); }
            }
        }

        function spawnPowerUps() {
            powerUps = [];

            function getRandomEmptyPos() {
                let rx, ry;
                let attempts = 0;
                while(attempts < 1000) {
                    rx = Math.floor(Math.random() * cols); 
                    ry = Math.floor(Math.random() * rows);
                    if ((rx === goal.x && ry === goal.y) || (rx === 0 && ry === 0) || (rx === cols - 1 && ry === 0) || (rx === 0 && ry === rows - 1) || (rx === cols - 1 && ry === rows - 1)) {
                        attempts++;
                        continue;
                    }
                    if (!powerUps.some(p => p.x === rx && p.y === ry)) break;
                    attempts++;
                }
                return {x: rx, y: ry};
            }

            for(let i=0; i<settingPuOpp; i++) {
                let pos = getRandomEmptyPos();
                powerUps.push({x: pos.x, y: pos.y, type: 'opponents'});
            }
            for(let i=0; i<settingPuSelf; i++) {
                let pos = getRandomEmptyPos();
                powerUps.push({x: pos.x, y: pos.y, type: 'self'});
            }
            for(let i=0; i<settingPuRocket; i++) {
                let pos = getRandomEmptyPos();
                powerUps.push({x: pos.x, y: pos.y, type: 'rocket'});
            }
        }

        function startTeleport(b) {
            if (b.state !== 'normal') return;
            b.state = 'teleport_out';
            b.stateTimer = 1.0;
            let rx = goal.x, ry = goal.y;
            
            let isValidDestination = false;
            let attempts = 0;
            while (!isValidDestination) { 
                rx = Math.floor(Math.random() * cols); 
                ry = Math.floor(Math.random() * rows); 
                isValidDestination = true;

                // Cannot teleport onto the goal
                if (rx === goal.x && ry === goal.y) isValidDestination = false;
                
                // Cannot teleport onto a power-up
                if (powerUps.some(p => p.x === rx && p.y === ry)) isValidDestination = false;

                // Ensure teleporting player is not placed within 10 cells of the goal
                if (distanceMap.length > 0 && distanceMap[rx] && distanceMap[rx][ry] !== undefined) {
                    if (attempts < 200 && distanceMap[rx][ry] <= 10) isValidDestination = false;
                }
                
                attempts++;
            }
            
            b.targetGridX = rx; b.targetGridY = ry;
        }

        function triggerTeleport(triggeringBug) {
            bugs.forEach(b => { if (b !== triggeringBug) startTeleport(b); });
        }

        // --- MATCH & ROUND LOGIC ---
        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            let millis = Math.floor(ms % 1000);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
        }

        function updateScoreboard() {
            scoreboardElement.innerHTML = activePlayersData.map(p => {
                return `<span style="color: ${p.color}">${p.id}: ${scores[p.id]}/${WINS_NEEDED}</span>`;
            }).join('<br>');
        }

        function initMatch() {
            // Remove focus from any clicked UI buttons so pressing Spacebar doesn't trigger them
            if (document.activeElement) {
                document.activeElement.blur();
            }

            // Sync visual mute state
            inGameMuteBtn.innerText = Synth.isMuted ? "Unmute" : "Mute";
            if (Synth.isMuted) inGameMuteBtn.classList.add('muted');
            else inGameMuteBtn.classList.remove('muted');

            postMatchLayer.classList.remove('winner-pulse');

            // Apply custom settings
            let customSize = parseInt(document.getElementById('grid-size-input').value, 10);
            if (isNaN(customSize) || customSize < 5) customSize = 5;
            if (customSize > 100) customSize = 100;
            cols = customSize;
            rows = customSize;
            goal = { x: Math.floor(cols / 2), y: Math.floor(rows / 2) };

            let customPuOpp = parseInt(document.getElementById('pu-opp-input').value, 10);
            if (isNaN(customPuOpp) || customPuOpp < 0) customPuOpp = 10;
            settingPuOpp = customPuOpp;

            let customPuSelf = parseInt(document.getElementById('pu-self-input').value, 10);
            if (isNaN(customPuSelf) || customPuSelf < 0) customPuSelf = 10;
            settingPuSelf = customPuSelf;

            let customPuRocket = parseInt(document.getElementById('pu-rocket-input').value, 10);
            if (isNaN(customPuRocket) || customPuRocket < 0) customPuRocket = 0;
            settingPuRocket = customPuRocket;

            settingCollisions = document.getElementById('collisions-toggle').checked;

            parseLobby();
            if (activePlayersData.length === 0) return; // Need at least 1 player

            scores = {};
            activePlayersData.forEach(p => scores[p.id] = 0);
            
            matchTime = 0;
            roundTimes = []; // Clear previous match's round times
            
            initialMenu.classList.add('hidden');
            lobbyLayer.classList.add('hidden');
            postMatchLayer.classList.add('hidden');
            hud.classList.remove('hidden');
            
            updateScoreboard();

            // If we're starting a networked game, ensure a clean slate.
            // All players will be added via onStateChange using server-authoritative sessionIds.
            if (room && room.sessionId) {
                console.log("Networked match starting. Clearing all local bug artifacts.");
                bugs = []; 
                activePlayersData.forEach(p => p.isLocal = false);
            }

            initRound();
        }

        function initRound() {
            gameState = 'INITIALIZING'; // Temporarily change state to block draw() recursion

            if (typeof room === 'undefined' || !room) {
                generateMaze();
            }

            // In networked play, preserve existing bugs to maintain session continuity
            if (typeof room === 'undefined' || !room) {
                bugs = [];
                spawnPowerUps();
                bugs = activePlayersData.map(data => new Bug(data));
            } else {
                // Networked game: just clear particles and non-player visual effects
                shockwaves = [];
                particles = [];
                rockets = [];
            }
            
            powerUps = []; // Will be repopulated by server state
            screenShake = 0;
            
            resizeCanvas(); // Safe to resize and draw now that the new maze grid is generated!
            
            gameState = 'PLAYING';
            postMatchLayer.classList.add('hidden');
            lastTime = performance.now();
            roundStartTime = performance.now();
            Synth.muffle(false);
        }

        function returnToMenu() {
            if (typeof room !== 'undefined' && room) {
                room.leave();
                room = null;
            }
            gameState = 'MENU';
            postMatchLayer.classList.add('hidden');
            postMatchLayer.classList.remove('winner-pulse');
            hud.classList.add('hidden');
            lobbyLayer.classList.add('hidden');
            initialMenu.classList.remove('hidden');
            Synth.muffle(true);
            
            generateMaze();
            bugs = [];
            powerUps = [];
            particles = [];
            shockwaves = [];
            rockets = [];
            draw(true);
        }

        function endGame(winner) {
            const currentRoundTime = performance.now() - roundStartTime;
            matchTime += currentRoundTime;
            
            // Log this round's statistics
            roundTimes.push({
                winnerId: winner.id,
                winnerColor: winner.color,
                time: currentRoundTime
            });

            scores[winner.id]++;
            updateScoreboard();

            // Huge explosion and shake on any win to make it spectacular!
            screenShake = 40;
            for (let i = 0; i < 200; i++) {
                particles.push(new Particle(winner.pixelX, winner.pixelY, winner.color));
                // Inject some bright white sparks into the mix
                if (i % 4 === 0) particles.push(new Particle(winner.pixelX, winner.pixelY, '#ffffff'));
            }

            if (scores[winner.id] >= WINS_NEEDED) {
                // Trigger full match over UI
                Synth.win();
                postMatchLayer.classList.remove('hidden');
                Synth.muffle(true); 
                gameState = 'MATCH_OVER';

                // Add pulsing color effect to background based on winner
                postMatchLayer.style.setProperty('--winner-color', winner.color);
                postMatchLayer.classList.add('winner-pulse');
                
                const fastestRoundTime = Math.min(...roundTimes.map(rt => rt.time));

                pmTitle.innerText = `${winner.id} Wins the Match!`;
                
                if (winner.isPlayer) {
                    if (bestTime === null || matchTime < bestTime) { bestTime = matchTime; localStorage.setItem('neonBugBestTime', bestTime); }
                    if (worstTime === null || matchTime > worstTime) { worstTime = matchTime; localStorage.setItem('neonBugWorstTime', worstTime); }
                    pmSubtitle.innerHTML = `You won the Best-of-3!<br>Match Time: ${formatTime(matchTime)}<br>Fastest Round: ${formatTime(fastestRoundTime)}<br>Best Match Ever: ${formatTime(bestTime)} | Worst: ${formatTime(worstTime)}`;
                } else {
                    pmSubtitle.innerHTML = `${winner.id} won the Best-of-3!<br>Match Time: ${formatTime(matchTime)}<br>Fastest Round: ${formatTime(fastestRoundTime)}`;
                }
                pmTitle.style.textShadow = `0 0 20px ${winner.color}, 0 0 40px ${winner.color}`;

                playAgainBtn.innerText = `Play Again with Friend Code ${myCode}`;

                // Populate the scrollable rounds list
                const roundTimesList = document.getElementById('pm-round-times');
                roundTimesList.innerHTML = roundTimes.map((rt, index) => {
                    return `<div>Round ${index + 1}: <span style="color: ${rt.winnerColor}; font-weight: bold;">${rt.winnerId}</span> - ${formatTime(rt.time)}</div>`;
                }).join('');

            } else {
                // Round Over (but match continues) - trigger countdown celebration
                gameState = 'ROUND_OVER_COUNTDOWN';
                currentWinner = winner;
                roundCountdown = 3000; // 3 seconds
            }
        }

        // --- DRAW LOOP ---
        function drawMaze() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            // --- TENSION BUILDER: Pulse background if someone is close to winning ---
            let closestBug = null;
            let minDist = Infinity;
            if (gameState === 'PLAYING' && distanceMap.length > 0) {
                bugs.forEach(bug => {
                    if (bug.state === 'normal') {
                        let d = distanceMap[bug.gridX][bug.gridY];
                        if (d < minDist) {
                            minDist = d;
                            closestBug = bug;
                        }
                    }
                });
            }

            if (closestBug && minDist <= 10) {
                const tension = 1 - (minDist / 10);
                const pulse = (Math.sin(performance.now() / 150) + 1) / 2;
                ctx.fillStyle = closestBug.color;
                ctx.globalAlpha = tension * pulse * 0.15;
                ctx.fillRect(0, 0, width, height);
                ctx.globalAlpha = 1.0;
            }

            ctx.strokeStyle = colors.wall;
            ctx.lineWidth = 4;
            ctx.lineCap = 'square';
            
            ctx.beginPath();
            if (grid && grid.length > 0) {
                for (let x = 0; x < cols; x++) {
                    for (let y = 0; y < rows; y++) {
                        const cell = grid[x][y];
                        if (!cell || !cell.walls) continue;
                        
                        let cx = x * cellSize, cy = y * cellSize;
                        // Walls: [top, right, bottom, left]
                        if (cell.walls[0]) { ctx.moveTo(cx, cy); ctx.lineTo(cx + cellSize, cy); }
                        if (cell.walls[1]) { ctx.moveTo(cx + cellSize, cy); ctx.lineTo(cx + cellSize, cy + cellSize); }
                        if (cell.walls[2]) { ctx.moveTo(cx, cy + cellSize); ctx.lineTo(cx + cellSize, cy + cellSize); }
                        if (cell.walls[3]) { ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + cellSize); }
                    }
                }
            }
            ctx.stroke();
            
            const gx = goal.x * cellSize + cellSize / 2, gy = goal.y * cellSize + cellSize / 2;
            const time = performance.now() / 500;
            
            ctx.save();
            ctx.translate(gx, gy);

            // Outer rotating aura
            ctx.rotate(time * 0.5);
            for(let i=0; i<8; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(cellSize * 0.15, cellSize * 0.45);
                ctx.lineTo(-cellSize * 0.15, cellSize * 0.45);
                
                // Multi-coloured rays
                const rayHue = (i * 45 + time * 100) % 360;
                const alpha = 0.15 + Math.sin(time * 2) * 0.1;
                ctx.fillStyle = `hsla(${rayHue}, 100%, 50%, ${alpha})`;
                ctx.fill();
            }

            // Counter-rotating inner complex
            ctx.rotate(-time); 
            const pulse = (Math.sin(time * 3) + 1) / 2;
            
            // Draw an octagon portal core
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const angle = i * Math.PI / 4;
                const radius = cellSize * 0.3 + (i % 2 === 0 ? pulse * cellSize * 0.05 : 0);
                const px = Math.cos(angle) * radius;
                const py = Math.sin(angle) * radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            ctx.fillStyle = '#050510';
            ctx.fill();
            
            const coreHue = (time * 150) % 360; // Rainbow shifting border
            ctx.lineWidth = 2;
            ctx.strokeStyle = `hsl(${coreHue}, 100%, 50%)`;
            ctx.shadowBlur = 15 + (pulse * 10);
            ctx.shadowColor = `hsl(${coreHue}, 100%, 50%)`;
            ctx.stroke();

            // Central bright spark
            ctx.beginPath();
            ctx.arc(0, 0, cellSize * 0.08, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 20;
            // Fast rainbow shadow for the core
            const sparkHue = (time * 300) % 360;
            ctx.shadowColor = `hsl(${sparkHue}, 100%, 50%)`;
            ctx.fill();

            ctx.restore();
        }

        function drawPowerUps() {
            const time = performance.now() / 200;
            powerUps.forEach(p => {
                const px = p.x * cellSize + cellSize / 2, py = p.y * cellSize + cellSize / 2;
                ctx.save();
                ctx.translate(px, py);
                if (p.type === 'opponents') {
                    const pulse = 1 + Math.sin(time * 2) * 0.1;
                    ctx.scale(pulse, pulse);
                    ctx.beginPath();
                    ctx.arc(0, 0, cellSize * 0.25, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff'; 
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = colors.powerupOpponents; 
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(0, 0, cellSize * 0.15, 0, Math.PI * 2);
                    ctx.fillStyle = colors.powerupOpponents;
                    ctx.fill();
                } else if (p.type === 'self') {
                    ctx.rotate(-time);
                    ctx.beginPath();
                    ctx.arc(0, 0, cellSize * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = colors.bg; 
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = colors.powerupSelf;
                    ctx.setLineDash([5, 5]); 
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = colors.powerupSelf;
                    ctx.stroke();
                    ctx.setLineDash([]); 
                } else if (p.type === 'rocket') {
                    const pulse = 1 + Math.sin(time * 3) * 0.1;
                    ctx.scale(pulse, pulse);
                    ctx.beginPath();
                    ctx.moveTo(0, -cellSize * 0.25);
                    ctx.lineTo(cellSize * 0.15, cellSize * 0.15);
                    ctx.lineTo(0, cellSize * 0.05);
                    ctx.lineTo(-cellSize * 0.15, cellSize * 0.15);
                    ctx.closePath();
                    ctx.fillStyle = '#ff3300';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff3300';
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        let currentMazeData = [];
        
        function draw(force = false) {
            if (gameState === 'MENU' && !force) return;

            const now = performance.now();
            const dt = now - lastTime;
            lastTime = now;

            ctx.save();
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake, sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
                screenShake -= dt * 0.05; 
                if (screenShake < 0) screenShake = 0;
            }

            drawMaze();
            drawPowerUps();

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                if (sw.update(dt)) sw.draw(); else shockwaves.splice(i, 1);
            }

            bugs.sort((a, b) => (a.isPlayer === b.isPlayer) ? 0 : a.isPlayer ? 1 : -1);
            bugs.forEach(bug => { bug.update(dt); bug.draw(); });

            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                if (r.update(dt)) r.draw(); else rockets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.update(dt)) p.draw(); else particles.splice(i, 1);
            }

            // In-game round over celebration overlay
            if (gameState === 'ROUND_OVER_COUNTDOWN') {
                roundCountdown -= dt;
                const secondsLeft = Math.max(1, Math.ceil(roundCountdown / 1000));
                
                ctx.save();
                
                const titleSize = Math.max(20, width * 0.06);
                const subSize = Math.max(14, width * 0.04);
                
                // Slight dark bar for readability
                ctx.fillStyle = "rgba(5, 5, 16, 0.7)";
                ctx.fillRect(0, height / 2 - titleSize * 1.5, width, titleSize * 3.8);
                
                ctx.font = `bold ${titleSize}px monospace`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 20;
                ctx.shadowColor = currentWinner.color;
                ctx.fillStyle = currentWinner.color;
                ctx.fillText(`${currentWinner.id} Wins Round!`, width / 2, height / 2 - titleSize * 0.2);
                
                ctx.fillStyle = "#fff";
                ctx.font = `bold ${subSize}px monospace`;
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 5;
                ctx.fillText(`${secondsLeft} seconds to next round...`, width / 2, height / 2 + subSize * 1.5);
                
                ctx.fillStyle = "#aaa";
                ctx.font = `normal ${subSize * 0.8}px monospace`;
                ctx.shadowBlur = 2;
                ctx.fillText(`(Press Space to skip)`, width / 2, height / 2 + subSize * 2.8);
                
                ctx.restore();

                if (roundCountdown <= 0) {
                    initRound();
                }
            }

            ctx.restore(); 

            if (gameState !== 'MENU') {
                if (animationId) cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(() => draw(false));
            }
        }

        // --- INPUT HANDLING ---
        const controlsMap = {
            'WASD': { up: ['w', 'W'], right: ['d', 'D'], down: ['s', 'S'], left: ['a', 'A'] },
            'TFGH': { up: ['t', 'T'], right: ['h', 'H'], down: ['g', 'G'], left: ['f', 'F'] },
            'IJKL': { up: ['i', 'I'], right: ['l', 'L'], down: ['k', 'K'], left: ['j', 'J'] },
            'Arrows': { up: ['ArrowUp'], right: ['ArrowRight'], down: ['ArrowDown'], left: ['ArrowLeft'] },
            'Numpad': { up: ['8', 'Numpad8'], right: ['6', 'Numpad6'], down: ['5', 'Numpad5'], left: ['4', 'Numpad4'] }
        };

        window.addEventListener('keydown', (e) => {
            // Prevent spacebar or arrow keys from scrolling the page or pressing focused UI buttons!
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code) || e.key === ' ') {
                e.preventDefault();
            }

            // Allow skipping the round countdown instantly with Spacebar
            if (gameState === 'ROUND_OVER_COUNTDOWN' && (e.code === 'Space' || e.key === ' ')) {
                roundCountdown = 0;
                return;
            }

            if (gameState !== 'PLAYING') return;
            bugs.forEach(bug => {
                if (!bug.isPlayer) return;
                
                // Authoritative local check for input processing
                const isActuallyLocal = (room && room.sessionId) ? (bug.sessionId === room.sessionId) : bug.isLocal;
                if (!isActuallyLocal) {
                    // console.log(`[Input] Ignoring input for ${bug.id} (${bug.sessionId}). Local is: ${room?.sessionId}`);
                    return;
                }

                const map = controlsMap[bug.controlScheme];
                if (!map) return;

                let dir = null;
                if (map.up.includes(e.key)) dir = 'up';
                else if (map.right.includes(e.key)) dir = 'right';
                else if (map.down.includes(e.key)) dir = 'down';
                else if (map.left.includes(e.key)) dir = 'left';

                if (dir) {
                    if (!bug.heldDirections.includes(dir)) {
                        bug.heldDirections.push(dir);
                        // Buffer the intent so early presses turn seamlessly, ONLY on initial keydown to avoid OS repeat bugs
                        bug.turnIntent = { dir: dir, time: performance.now() };
                    }
                }
            });
        });

        window.addEventListener('keyup', (e) => {
            if (gameState !== 'PLAYING') return;
            bugs.forEach(bug => {
                if (!bug.isPlayer) return;
                
                // Authoritative local check for input processing
                const isActuallyLocal = (room && room.sessionId) ? (bug.sessionId === room.sessionId) : bug.isLocal;
                if (!isActuallyLocal) {
                    // console.log(`[Input] Ignoring input for ${bug.id} (${bug.sessionId}). Local is: ${room?.sessionId}`);
                    return;
                }

                const map = controlsMap[bug.controlScheme];
                if (!map) return;

                let dir = null;
                if (map.up.includes(e.key)) dir = 'up';
                else if (map.right.includes(e.key)) dir = 'right';
                else if (map.down.includes(e.key)) dir = 'down';
                else if (map.left.includes(e.key)) dir = 'left';

                if (dir) {
                    const index = bug.heldDirections.indexOf(dir);
                    if (index > -1) bug.heldDirections.splice(index, 1);
                    if (bug.turnIntent && bug.turnIntent.dir === dir) {
                        bug.turnIntent = null;
                    }
                }
            });
        });

        // Touch handling (Routes to Player 1 if they exist)
        let touchStartX = 0, touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        canvas.addEventListener('touchend', (e) => {
            // Tap to skip countdown on mobile
            if (gameState === 'ROUND_OVER_COUNTDOWN') {
                roundCountdown = 0;
                return;
            }

            if (gameState !== 'PLAYING') return;
            const p1 = bugs.find(b => {
                const isActuallyLocal = (room && room.sessionId) ? (b.sessionId === room.sessionId) : b.isLocal;
                return b.isPlayer && isActuallyLocal;
            });
            if (!p1) return;
            
            let dx = e.changedTouches[0].screenX - touchStartX;
            let dy = e.changedTouches[0].screenY - touchStartY;
            
            if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
                let intentDx = 0, intentDy = 0;
                if (Math.abs(dx) > Math.abs(dy)) intentDx = dx > 0 ? 1 : -1;
                else intentDy = dy > 0 ? 1 : -1;
                p1.swipeIntent = { dx: intentDx, dy: intentDy, time: performance.now() };
            }
        }, {passive: true});

        // D-pad button controls
        const dpadDirs = { 'dpad-up': [0,-1], 'dpad-down': [0,1], 'dpad-left': [-1,0], 'dpad-right': [1,0] };
        Object.keys(dpadDirs).forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const [dx, dy] = dpadDirs[id];
            const fireIntent = () => {
                if (gameState !== 'PLAYING') return;
                const p1 = bugs.find(b => {
                    const isActuallyLocal = (room && room.sessionId) ? (b.sessionId === room.sessionId) : b.isLocal;
                    return b.isPlayer && isActuallyLocal;
                });
                if (!p1) return;
                p1.swipeIntent = { dx, dy, time: performance.now() };
            };
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); fireIntent(); }, { passive: false });
            btn.addEventListener('mousedown', fireIntent);
        });

        // --- MENU BUTTON BINDINGS ---
        
        // Generate once on load and inject everywhere
        const myCode = generateFriendCode();
        document.querySelectorAll('.display-friend-code').forEach(el => el.innerText = myCode);

        // In-game Menu Button
        inGameMenuBtn.addEventListener('click', () => {
            returnToMenu();
        });

        // Persistent audio toggle buttons
        musicBtn.addEventListener('click', () => {
            if (document.activeElement) document.activeElement.blur();
            Synth.toggleMusic();
        });

        sfxBtn.addEventListener('click', () => {
            if (document.activeElement) document.activeElement.blur();
            Synth.toggleSfx();
        });

        // Menu Navigation
        customSettingsBtn.addEventListener('click', () => {
            initialMenu.classList.add('hidden');
            lobbyLayer.classList.remove('hidden');
        });

        lobbyBackBtn.addEventListener('click', () => {
            lobbyLayer.classList.add('hidden');
            initialMenu.classList.remove('hidden');
        });

        // Start actions
        const client = new Colyseus.Client("ws://localhost:2567");
        let room;

        quickStartBtn.addEventListener('click', async () => {
            Synth.init();
            Synth.startMusic();
            if (Synth.ctx.state === 'suspended') Synth.ctx.resume();

            console.log("Searching for game...");
            bugs = []; // Explicitly clear any local bugs before joining networked game
            try {
                room = await client.joinOrCreate("game");
                
                // Wait a tiny bit to ensure sessionId is ready
                if (!room.sessionId) {
                    await new Promise(resolve => setTimeout(resolve, 50));
                }

                console.log("Joined room:", room.roomId, "SessionID:", room.sessionId);

                // Now that we have a room and a sessionId, we can safely init the match
                initMatch();
                if (animationId) cancelAnimationFrame(animationId);
                draw(true);

                // Listen for server state changes
                room.onStateChange((state) => {
                    // Update timer from server
                    timerElement.innerText = formatTime(state.timer * 1000);
                    
                    // Update goal
                    goal.x = state.goalX;
                    goal.y = state.goalY;

                    // Sync Maze Grid
                    if (state.grid && state.grid.length > 0) {
                        cols = state.cols;
                        rows = state.rows;
                        grid = [];
                        for (let x = 0; x < cols; x++) {
                            grid[x] = [];
                            for (let y = 0; y < rows; y++) {
                                const serverCell = state.grid[x * rows + y];
                                const cell = new Cell(x, y);
                                cell.walls = [
                                    serverCell.walls[0],
                                    serverCell.walls[1],
                                    serverCell.walls[2],
                                    serverCell.walls[3]
                                ];
                                grid[x][y] = cell;
                            }
                        }
                        generateDistanceMap();
                        cellSize = width / cols;
                    }

                    // Sync Power-ups
                    powerUps = [];
                    state.powerUps.forEach(pu => {
                        powerUps.push({ x: pu.x, y: pu.y, type: pu.type });
                    });

                    // Sync Players
                    state.players.forEach((playerState, sessionId) => {
                        let bug = bugs.find(b => b.sessionId === sessionId);
                        const isLocal = sessionId === room.sessionId;
                        if (!bug) {
                            // Create new bug for joined player
                            bug = new Bug({
                                id: playerState.id,
                                sessionId: sessionId,
                                color: playerState.color,
                                x: playerState.x,
                                y: playerState.y,
                                isPlayer: true,
                                isLocal: isLocal,
                                controlScheme: 'WASD' // Default
                            });
                            bugs.push(bug);
                        } else {
                            // Ensure isLocal status is always correct
                            bug.isLocal = isLocal;

                            // If player position changed drastically, trigger teleport animation
                            if (Math.abs(bug.gridX - playerState.x) > 1 || Math.abs(bug.gridY - playerState.y) > 1) {
                                if (bug.state === 'normal') {
                                    // Trigger local teleport effect for visual consistency
                                    bug.state = 'teleport_out';
                                    bug.stateTimer = 1.0;
                                    bug.targetGridX = playerState.x;
                                    bug.targetGridY = playerState.y;
                                    
                                    if (bug.isLocal) Synth.zip();
                                    else Synth.glitch();
                                }
                            } else {
                                // Normal movement sync
                                bug.gridX = playerState.x;
                                bug.gridY = playerState.y;
                            }
                        }
                    });

                    // Remove players who left. 
                    // In networked games, we ONLY keep bugs that have an active server sessionId match.
                    bugs = bugs.filter(b => state.players.has(b.sessionId));
                });
            } catch (e) {
                console.error("Could not join/create room", e);
                // Fallback to local if join fails
                initMatch();
                if (animationId) cancelAnimationFrame(animationId);
                draw(true);
            }
        });
        joinFriendBtn.addEventListener('click', () => {
            if (joinCodeInput.value.length < 3) return; // Simple check
            Synth.init(); 
            Synth.startMusic();
            if (Synth.ctx.state === 'suspended') Synth.ctx.resume();
            initMatch(); // Prototype fallback to quick match
            if (animationId) cancelAnimationFrame(animationId);
            draw(true);
        });

        startBtn.addEventListener('click', () => {
            Synth.init(); 
            Synth.startMusic();
            if (Synth.ctx.state === 'suspended') Synth.ctx.resume();
            initMatch(); 
            if (animationId) cancelAnimationFrame(animationId);
            draw(true);
        });

        // Play Again button at the match end
        playAgainBtn.addEventListener('click', () => {
            initMatch(); 
            if (animationId) cancelAnimationFrame(animationId);
            draw(true);
        });

        menuBtn.addEventListener('click', () => {
            returnToMenu();
        });

        window.addEventListener('resize', resizeCanvas);

        window.onload = () => {
            buildLobby();
            generateMaze();
            resizeCanvas();
        };
    </script>
</body>
</html>
