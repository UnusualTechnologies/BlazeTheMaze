                        ctx.fillStyle   = bodyColor;
                        ctx.shadowBlur  = 20;
                        ctx.shadowColor = bodyColor;
                        ctx.beginPath();
                        ctx.moveTo(0, -cellSize * 0.4);
                        ctx.lineTo(cellSize * 0.25, cellSize * 0.25);
                        ctx.lineTo(0, cellSize * 0.1);
                        ctx.lineTo(-cellSize * 0.25, cellSize * 0.25);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                    ctx.shadowBlur  = 0;
                    ctx.globalAlpha = 1;
                }

                // Speed streaks: radial lines pointing backward when moving fast
                if (this.speedBlur > 0.28 && (this.lastDx !== 0 || this.lastDy !== 0)) {
                    const backAngle = Math.atan2(-this.lastDy, -this.lastDx);
                    const streakLen = cellSize * (0.55 + this.speedBlur * 0.7);
                    ctx.save();
                    ctx.strokeStyle = bodyColor;
                    ctx.lineCap = 'round';
                    for (let s = 0; s < 7; s++) {
                        const spread = (Math.random() - 0.5) * 0.55;
                        const ang = backAngle + spread;
                        const startDist = size * (0.9 + Math.random() * 0.4);
                        const len = streakLen * (0.4 + Math.random() * 0.6);
                        ctx.lineWidth = Math.max(0.5, size * 0.08);
                        ctx.globalAlpha = this.speedBlur * 0.18 * Math.random();
                        ctx.shadowBlur = 6;
                        ctx.shadowColor = bodyColor;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(ang) * startDist, Math.sin(ang) * startDist);
                        ctx.lineTo(Math.cos(ang) * (startDist + len), Math.sin(ang) * (startDist + len));
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                    ctx.restore();
                }

                // Rotate to face direction of travel before drawing body
                ctx.rotate(angle + Math.PI / 2);

                ctx.globalAlpha = 0.75;
                if (isFrozen) {
                    // Outer glow in ice blue, bright white core
                    for (const [blur, color] of [[40, '#44bbff'], [15, '#ffffff']]) {
                        ctx.fillStyle = color;
                        ctx.shadowBlur = blur;
                        ctx.shadowColor = color;
                        ctx.beginPath();
                        ctx.moveTo(0, -cellSize * 0.4);
                        ctx.lineTo(cellSize * 0.25, cellSize * 0.25);
                        ctx.lineTo(0, cellSize * 0.1);
                        ctx.lineTo(-cellSize * 0.25, cellSize * 0.25);
                        ctx.closePath();
                        ctx.fill();
                    }
                } else {
                    for (const blur of [40, 15]) {
                        ctx.fillStyle = bodyColor;
                        ctx.shadowBlur = blur;
                        ctx.shadowColor = bodyColor;
                        ctx.beginPath();
                        ctx.moveTo(0, -cellSize * 0.4);
                        ctx.lineTo(cellSize * 0.25, cellSize * 0.25);
                        ctx.lineTo(0, cellSize * 0.1);
                        ctx.lineTo(-cellSize * 0.25, cellSize * 0.25);
                        ctx.closePath();
                        ctx.fill();
                    }
                }
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;

                // Speed-glow white outline — brightens at dirStreak 3→6 without washing out the fill colour
                if (this.speedGlow > 0.01 && !isFrozen && !isMirrored) {
                    ctx.beginPath();
                    ctx.moveTo(0, -cellSize * 0.4);
                    ctx.lineTo(cellSize * 0.25, cellSize * 0.25);
                    ctx.lineTo(0, cellSize * 0.1);
                    ctx.lineTo(-cellSize * 0.25, cellSize * 0.25);
                    ctx.closePath();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = Math.max(1, size * 0.28) * this.speedGlow;
                    ctx.globalAlpha = 0.85 * this.speedGlow;
                    ctx.shadowBlur = 16 * this.speedGlow;
                    ctx.shadowColor = '#ffffff';
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }

                // Red outline while mirror controls are active
                if (isMirrored) {
                    ctx.beginPath();
                    ctx.moveTo(0, -cellSize * 0.4);
                    ctx.lineTo(cellSize * 0.25, cellSize * 0.25);
                    ctx.lineTo(0, cellSize * 0.1);
                    ctx.lineTo(-cellSize * 0.25, cellSize * 0.25);
                    ctx.closePath();
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = Math.max(1, size * 0.28);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        const MIN_CELL_SIZE = 8;  // px — below this cells are too small to navigate
        const MAX_CELL_SIZE = 80; // px — above this cells are too large / wasteful

        function getMazeLimits() {
            const size = Math.min(gameContainer.clientWidth, gameContainer.clientHeight);
            if (size <= 0) return { min: 15, max: 999 }; // container not laid out yet — allow anything
            return {
                min: Math.max(15, Math.ceil(size / MAX_CELL_SIZE)),
                max: Math.floor(size / MIN_CELL_SIZE)
            };
        }

        function updateGridSizeInputLimits() {
            const { min, max } = getMazeLimits();
            gridSizeInput.min = min;
            gridSizeInput.max = max;
            const current = parseInt(gridSizeInput.value, 10);
            if (current < min) gridSizeInput.value = min;
            else if (current > max) gridSizeInput.value = max;
            gridSizeHint.style.display = 'none';
        }

        function clampGridSizeInput() {
            const { min, max } = getMazeLimits();
            const val = parseInt(gridSizeInput.value, 10);
            if (isNaN(val) || val < min) {
                gridSizeInput.value = min;
                gridSizeHint.textContent = `Min for your screen: ${min}`;
                gridSizeHint.style.display = 'inline';
            } else if (val > max) {
                gridSizeInput.value = max;
                gridSizeHint.textContent = `Max for your screen: ${max}`;
                gridSizeHint.style.display = 'inline';
            } else {
                gridSizeHint.style.display = 'none';
            }
        }

        function checkPowerUpCaps() {
            const grid = parseInt(gridSizeInput.value, 10) || 20;
            const maxPerType = Math.floor((grid * grid - 9) * 0.35);
            ['opp', 'self', 'rocket', 'mirror', 'mystery', 'freeze', 'beacon'].forEach(k => {
                const el = document.getElementById(`pu-${k}-input`);
                if (!el) return;
                const v = parseInt(el.value, 10);
                if (!isNaN(v) && v > maxPerType) el.value = String(maxPerType);
            });
        }

        function resizeCanvas() {
            let size = Math.min(gameContainer.clientWidth, gameContainer.clientHeight);
            width = size;
            height = size;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            cellSize = width / cols;
            mazeCacheValid = false;
            vignetteGrad = null;
            blazers.forEach(blazer => blazer.updatePixelPos(true));
            draw(true);
        }

        function generateMaze() {
            grid = [];
            for (let x = 0; x < cols; x++) {
                grid[x] = [];
                for (let y = 0; y < rows; y++) grid[x][y] = new Cell(x, y);
            }

            // Force the goal to be a dead-end with exactly one entrance
            let goalCell = grid[goal.x][goal.y];
            goalCell.visited = true; 

            let entranceNeighbors = [];
            if (goal.y > 0) entranceNeighbors.push(grid[goal.x][goal.y - 1]);
            if (goal.x < cols - 1) entranceNeighbors.push(grid[goal.x + 1][goal.y]);
            if (goal.y < rows - 1) entranceNeighbors.push(grid[goal.x][goal.y + 1]);
            if (goal.x > 0) entranceNeighbors.push(grid[goal.x - 1][goal.y]);

            let entrance = entranceNeighbors[Math.floor(Math.random() * entranceNeighbors.length)];
            removeWalls(goalCell, entrance);

            entrance.visited = true;
            let frontier = getUnvisitedNeighbors(entrance);

            while (frontier.length > 0) {
                let randomIndex = Math.floor(Math.random() * frontier.length);
                let current = frontier[randomIndex];
                frontier.splice(randomIndex, 1);

                if (current.visited) continue;

                let visitedNeighbors = getVisitedNeighbors(current);
                if (visitedNeighbors.length > 0) {
                    let vNeighbor = visitedNeighbors[Math.floor(Math.random() * visitedNeighbors.length)];
                    removeWalls(current, vNeighbor);
                    current.visited = true;

                    let newNeighbors = getUnvisitedNeighbors(current);
                    for (let n of newNeighbors) {
                        if (!frontier.includes(n)) {
                            frontier.push(n);
                        }
                    }
                }
            }
            generateDistanceMap();
            mazeCacheValid = false;
        }

        function getUnvisitedNeighbors(cell) {
            let n = [];
            let x = cell.x, y = cell.y;
            if (y > 0 && !grid[x][y - 1].visited) n.push(grid[x][y - 1]);
            if (x < cols - 1 && !grid[x + 1][y].visited) n.push(grid[x + 1][y]);
            if (y < rows - 1 && !grid[x][y + 1].visited) n.push(grid[x][y + 1]);
            if (x > 0 && !grid[x - 1][y].visited) n.push(grid[x - 1][y]);
            return n;
        }

        function getVisitedNeighbors(cell) {
            let n = [];
            let x = cell.x, y = cell.y;
            if (y > 0 && grid[x][y - 1].visited && !(x === goal.x && y - 1 === goal.y)) n.push(grid[x][y - 1]);
            if (x < cols - 1 && grid[x + 1][y].visited && !(x + 1 === goal.x && y === goal.y)) n.push(grid[x + 1][y]);
            if (y < rows - 1 && grid[x][y + 1].visited && !(x === goal.x && y + 1 === goal.y)) n.push(grid[x][y + 1]);
            if (x > 0 && grid[x - 1][y].visited && !(x - 1 === goal.x && y === goal.y)) n.push(grid[x - 1][y]);
            return n;
        }

        function removeWalls(a, b) {
            let x = a.x - b.x;
            if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
            else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }

            let y = a.y - b.y;
            if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
            else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        function generateDistanceMap() {
            distanceMap = Array(cols).fill().map(() => Array(rows).fill(Infinity));
            distanceMap[goal.x][goal.y] = 0;
            let queue = [{x: goal.x, y: goal.y}];

            while(queue.length > 0) {
                let curr = queue.shift();
                let cell = grid[curr.x][curr.y];

                if (!cell.walls[0] && distanceMap[curr.x][curr.y-1] === Infinity) { distanceMap[curr.x][curr.y-1] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y-1}); }
                if (!cell.walls[1] && distanceMap[curr.x+1][curr.y] === Infinity) { distanceMap[curr.x+1][curr.y] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x+1, y: curr.y}); }
                if (!cell.walls[2] && distanceMap[curr.x][curr.y+1] === Infinity) { distanceMap[curr.x][curr.y+1] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y+1}); }
                if (!cell.walls[3] && distanceMap[curr.x-1][curr.y] === Infinity) { distanceMap[curr.x-1][curr.y] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x-1, y: curr.y}); }
            }
        }

        function startTeleport(b) {
            if (b.state !== 'normal') return;
            b.state = 'teleport_out';
            b.stateTimer = 1.0;
            let rx = goal.x, ry = goal.y;
            
            let isValidDestination = false;
            let attempts = 0;
            while (!isValidDestination && attempts < 500) {
                rx = Math.floor(Math.random() * cols); 
                ry = Math.floor(Math.random() * rows); 
                isValidDestination = true;

                // Cannot teleport onto the goal
                if (rx === goal.x && ry === goal.y) isValidDestination = false;
                
                // Cannot teleport onto a power-up
                if (powerUps.some(p => p.x === rx && p.y === ry)) isValidDestination = false;

                // Ensure teleporting player is not placed within 10 cells of the goal
                if (distanceMap.length > 0 && distanceMap[rx] && distanceMap[rx][ry] !== undefined) {
                    if (attempts < 200 && distanceMap[rx][ry] <= 10) isValidDestination = false;
                }
                
                attempts++;
            }
            
            b.targetGridX = rx; b.targetGridY = ry;
        }

        function triggerTeleport(triggeringBlazer) {
            blazers.forEach(b => { if (b !== triggeringBlazer) startTeleport(b); });
        }

        // --- MATCH & ROUND LOGIC ---
        function unlockAchievement(apiName) {
            window.electronAPI?.unlockAchievement?.(apiName);
        }

        // Defense-in-depth against HTML/CSS injection: player ids and colors originate
        // from server state (sanitized server-side too) but are also escaped/validated
        // here before being interpolated into innerHTML.
        // Convert 1-100 speed scale to ms: 1 = 1000ms (slowest), 100 = 100ms (fastest)
        function speedScaleToMs(s) { return Math.round(100 + (100 - s) * (900 / 99)); }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }
        function safeColor(c) {
            return (typeof c === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(c)) ? c : '#ffffff';
        }

        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            let millis = Math.floor(ms % 1000);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${Math.floor(millis / 100)}`;
        }

        function updateScoreboard() {
            const sorted = [...blazers].sort((a, b) => {
                const na = parseInt(a.id.replace(/\D/g, '')) || 0;
                const nb = parseInt(b.id.replace(/\D/g, '')) || 0;
                return na - nb;
            });
            // Group players by win count (capped at 2 since 3 = instant win)
            const groups = [[], [], []];
            sorted.forEach(b => {
                if (scoreHiddenIds.has(b.id)) return; // flying — hide from all columns
                const w = Math.min(scores[b.id] ?? 0, WINS_TO_MATCH - 1);
                const num = b.id.replace(/\D/g, '');
                groups[w].push(`<span style="color:${safeColor(b.color)}">P${num}</span>`);
            });
            // Negative delay syncs new stars to the global animation cycle,
            // preventing a visible restart every time updateScoreboard() rebuilds the DOM.
            const _s = Date.now() / 1000;
            const _spinDelay = -(_s % 6).toFixed(3);
            const _hueDelay  = -(_s % 2).toFixed(3);
            const GOAL = `<svg class="goal-star-svg" width="13" height="13" viewBox="0 0 100 100" style="vertical-align:-1px;animation-delay:${_spinDelay}s,${_hueDelay}s"><polygon points="50,4 61,36 94,36 67,56 77,87 50,68 23,87 33,56 6,36 39,36" fill="none" stroke="#00ffff" stroke-width="9"/><circle cx="50" cy="50" r="10" fill="#ffffff"/></svg>`;
            const headers = ['–', GOAL, GOAL + GOAL];
            scoreboardElement.innerHTML = headers.map((h, i) =>
                `<div class="score-col">` +
                    `<div class="score-header">${h}</div>` +
                    `<div class="score-players">${groups[i].join(', ')}</div>` +
                `</div>`
            ).join('');
        }

        // Animates a player's coloured label from one scoreboard column to the next.
        // Returns the flying DOM element (caller removes it when done).
        function animateScoreStarToNextCol(winnerId, winnerColor, oldScore, newScore) {
            const cols = scoreboardElement.querySelectorAll('.score-col');
            const oldColIdx = Math.min(oldScore, 2);
            const newColIdx = Math.min(newScore, 2);
            if (oldColIdx === newColIdx || !cols[oldColIdx] || !cols[newColIdx]) return null;

            const oldRect = cols[oldColIdx].getBoundingClientRect();
            const newRect = cols[newColIdx].getBoundingClientRect();

            const el = document.createElement('div');
            const num = winnerId.replace(/\D/g, '');
            const wc = safeColor(winnerColor);
            el.innerHTML = `<span style="color:${wc};font-weight:bold;font-size:14px;font-family:inherit;text-shadow:0 0 8px ${wc},0 0 18px ${wc}">P${num}</span>`;
            el.style.cssText = [
                'position:fixed',
                `left:${oldRect.left + oldRect.width / 2}px`,
                `top:${oldRect.top + oldRect.height / 2}px`,
                'transform:translate(-50%,-50%) scale(1.6)',
                'pointer-events:none',
                'z-index:9999',
                'transition:left 0.9s cubic-bezier(0.25,0.46,0.45,0.94),' +
                           'top 0.9s cubic-bezier(0.25,0.46,0.45,0.94),' +
                           'transform 0.9s ease'
            ].join(';');
            document.body.appendChild(el);

            // Double-rAF so the browser registers the start position before we change it
            requestAnimationFrame(() => requestAnimationFrame(() => {
                el.style.left      = `${newRect.left + newRect.width / 2}px`;
                el.style.top       = `${newRect.top  + newRect.height / 2}px`;
                el.style.transform = 'translate(-50%,-50%) scale(1)';
            }));

            return el;
        }

        /** Reset all input and transient animation state on a blazer between rounds/matches. */
        function resetBlazerInputState(blazer) {
            blazer.state = 'normal';
            blazer.stateTimer = 0;
            // Do NOT clear heldDirections — if the player is holding a key through the
            // round transition it should stay active so movement fires the instant the
            // new-round move lock expires. Released keys are already removed by keyup.
            blazer.turnIntent = null;
            blazer.swipeIntent = null;
            blazer.dirKeyDownTimes = {};
            blazer.bonkTimer = 0;
            blazer.bonkDx = 0;
            blazer.bonkDy = 0;
            blazer._speedBoostActive = false;
            blazer._recentMoveGaps = [];
            blazer._lastMoveTs = 0;
            blazer._dirChangeCount = 0;
        }

        function initMatch() {
            // Remove focus from any clicked UI buttons so pressing Spacebar doesn't trigger them
            if (document.activeElement) {
                document.activeElement.blur();
            }

            postMatchLayer.classList.remove('winner-pulse');

            parseLobby();
            if (activePlayersData.length === 0) return; // Need at least 1 player

            scores = {};
            activePlayersData.forEach(p => scores[p.id] = 0);
            
            matchTime = 0;
            roundTimes = []; // Clear previous match's round times
            
            initialMenu.classList.add('hidden');
            lobbyLayer.classList.add('hidden');
            lobbyRulesLayer.classList.add('hidden');
            postMatchLayer.classList.add('hidden');
            hud.classList.remove('hidden');
            hudBar.classList.remove('hidden');

            // Clear any leftover blazers; players are created fresh via onStateChange.
            blazers = [];
            updateScoreboard();

            // Apply exactly the remaining portion of the server's move lock.
            // If timer > 3s the lock already expired — pass 0 to skip it entirely.
            // If timer is small (e.g. 0.1s after room creation), we still lock for 2.9s
            // instead of skipping the lock and letting the server reject every early move.
            const MOVE_LOCK_MS = ROUND_START_MS * (2 / 3); // 3000 — matches server MOVE_LOCK_MS
            const _rawTimer = (room && room.state && typeof room.state.timer === 'number') ? room.state.timer : 0;
            const serverElapsedMs = _rawTimer * 1000;
            const remainingLockMs = Math.max(0, MOVE_LOCK_MS - serverElapsedMs);
            initRound(remainingLockMs, true); // mid-game join — suppress countdown beep
        }

        // lockMs: how long to lock movement from now. -1 (default) = full 3-second lock.
        // 0 = no lock (round already in progress). Positive = partial remaining lock.
        // NaN/Infinity treated as -1 (full lock) so a bad caller can't permanently lock movement.
        // midGameJoin: true when joining a round already in progress — suppresses the countdown beep.
        function initRound(lockMs = -1, midGameJoin = false) {
            gameState = 'INITIALIZING'; // Temporarily change state to block draw() recursion
            bgTintR = bgTintG = bgTintB = 0; // reset so leader tint fades in fresh each round
            document.body.style.backgroundColor = '#000000';
            stopVictoryStars();
            stopWinnerLap();

            // Solo play: generate a fresh random maze locally.
            // Networked play: keep the existing grid. The server's correct maze arrives via
            // onStateChange within ~50ms (round_reset) or has already arrived before the
            // match_reset message fires. Calling generateMaze() here would overwrite a
            // correctly-loaded server grid (match_reset) or create a brief window where the
            // client navigates a wrong maze (round_reset), both causing server-rejected moves
            // and snap-back to the server's last accepted position (often spawn).
            if (!room) generateMaze();

            shockwaves = [];
            particles = [];
            rockets = [];
            smokePuffs = [];
            powerUpBursts = [];
            powerUps = []; // Will be repopulated by server state
            screenShake = 0;
            goalRipples = [];
            lastGoalRippleTime = 0;
            floatLabels = [];
            dustParticles = [];
            for (let i = 0; i < 28; i++) {
                dustParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.18,
                    vy: (Math.random() - 0.5) * 0.18,
                    size: Math.random() * 2.5 + 1.0,
                    alpha: Math.random() * 0.22 + 0.12,
                    hue: Math.random() * 360
                });
            }
            
            resizeCanvas(); // Safe to resize and draw now that the new maze grid is generated!
            
            gameState = 'PLAYING';
            window.electronAPI?.setRichPresence('Racing');
            postMatchLayer.classList.add('hidden');
            lastTime = performance.now();
            roundStartTime = performance.now();
            roundRingTime = performance.now();
            // Networked play: the SERVER decides exactly when movement unlocks (it sends a
            // "movement_unlock" message when its lock expires). The client's local timer is only
            // a failsafe in case that message is lost — so we set it LONGER than the server's lock
            // (MOVE_LOCK_MS=3000) to guarantee the client never unlocks before the server. If the
            // local timer fired first (even by ~13ms of clock skew), the player would move, get a
            // move_reject, and snap back — the visible jump-back. Solo play has no server, so it
            // keeps the original timer-based unlock.
            const _networkedFailsafe = (ROUND_START_MS * (2 / 3)) + 1500; // 3000 server lock + 1500 latency margin
            const _autoLock = room ? _networkedFailsafe : ROUND_START_MS * (2 / 3);
            const _lockDuration = (lockMs >= 0 && isFinite(lockMs)) ? lockMs : _autoLock;
            roundMoveLockEnd = performance.now() + _lockDuration;
            roundUnlockFlashFired = (_lockDuration === 0); // no unlock flash if movement was never locked
            roundSonarsFired = 0;
            Synth.stopMenuMusic();
            Synth.stopHeartbeat();
            if (_lockDuration > 0 && !midGameJoin) Synth.countdownBeep();
            Synth.muffle(false);
        }

        // Starts the 30-second SVG ring countdown shown on the post-match overlay.
        // Called when a match ends; drives the countdown button until match_reset arrives.
        function startMatchEndTimer() {
            const isSolo = typeof room === 'undefined' || !room;

            if (isSolo) {
                // Solo: "Play Again" is immediately enabled with a 10-second auto-return countdown.
                const SOLO_WAIT = 10000;
                pmJoinIntent = false;
                const btn = pmNextGameBtn;
                if (btn) {
                    btn.style.display = '';
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                    btn.textContent = `Play Again (10)`;
                    btn.onclick = () => {
                        clearInterval(matchEndTimerInterval);
                        matchEndTimerInterval = null;
                        btn.style.display = 'none';
                        postMatchLayer.classList.add('hidden');
                        postMatchLayer.classList.remove('winner-pulse');
                        stopVictoryStars();
                        stopWinnerLap();
                        initMatch();
                    };
                }
                clearInterval(matchEndTimerInterval);
                const startTime = Date.now();
                matchEndTimerInterval = setInterval(() => {
                    const elapsed  = Date.now() - startTime;
                    const secsLeft = Math.max(0, Math.ceil((SOLO_WAIT - elapsed) / 1000));
                    if (btn) btn.textContent = `Play Again (${secsLeft})`;
                    if (elapsed >= SOLO_WAIT) {
                        clearInterval(matchEndTimerInterval);
                        matchEndTimerInterval = null;
                        if (btn) btn.style.display = 'none';
                    }
                }, 100);
                return;
            }

            // Networked: wait for server match_reset (up to 15 s); button unlocks in last 5 s.
            const MATCH_END_WAIT = 15000;
            const JOIN_UNLOCK_MS = 10000;
            pmJoinIntent = false;
            const btn = pmNextGameBtn;
            if (btn) {
                btn.style.display = '';
                btn.disabled = true;
                btn.style.opacity = '0.4';
                btn.style.cursor = 'default';
                btn.textContent = 'Next game starting in 15';
                btn.onclick = () => {
                    if (btn.disabled) return;
                    pmJoinIntent = true;
                    btn.disabled = true;
                    btn.style.cursor = 'default';
                    btn.textContent = 'Joining next game…';
                };
            }
            clearInterval(matchEndTimerInterval);
            const startTime = Date.now();
            matchEndTimerInterval = setInterval(() => {
                const elapsed  = Date.now() - startTime;
                const secsLeft = Math.max(0, Math.ceil((MATCH_END_WAIT - elapsed) / 1000));
                if (btn && !pmJoinIntent) {
                    if (elapsed < JOIN_UNLOCK_MS) {
                        btn.textContent = `Next game starting in ${secsLeft}`;
                    } else {
                        if (btn.disabled) {
                            btn.disabled = false;
                            btn.style.opacity = '1';
                            btn.style.cursor = 'pointer';
                        }
                        btn.textContent = `Game available - Join now (${secsLeft})`;
                    }
                }
                if (elapsed >= MATCH_END_WAIT) {
                    clearInterval(matchEndTimerInterval);
                    matchEndTimerInterval = null;
                    if (btn && !pmJoinIntent) btn.style.display = 'none';
                }
            }, 100);
        }

        function returnToMenu() {
            stopVictoryStars();
            stopWinnerLap();
            document.body.style.backgroundColor = '#000000';
            window.electronAPI?.closeSteamLobby();
            window.electronAPI?.setRichPresence('In Menu');
            if (typeof room !== 'undefined' && room) {
                leavingIntentionally = true;
                room.leave();
                room = null;
            }
            clearInterval(matchEndTimerInterval);
            matchEndTimerInterval = null;
            setButtonLoading(quickStartBtn, false);
            setButtonLoading(startBtn, false);
            setButtonLoading(joinFriendBtn, false);
            gameState = 'MENU';
            postMatchLayer.classList.add('hidden');
            postMatchLayer.classList.remove('winner-pulse');
            pmJoinIntent = false;
            if (pmNextGameBtn) pmNextGameBtn.style.display = 'none';
            hud.classList.add('hidden');
            hudBar.classList.add('hidden');
            lobbyLayer.classList.add('hidden');
            lobbyRulesLayer.classList.add('hidden');
            initialMenu.classList.remove('hidden');
            Synth.stopHeartbeat();
            Synth.muffle(true);
            Synth.startMenuMusic();

            generateMaze();
            blazers = [];
            powerUps = [];
            particles = [];
            shockwaves = [];
            rockets = [];
            updateDpad();
            draw(true);
        }

        // --- DRAW LOOP ---

        function buildMazeCache() {
            if (!width || !height) return;
            const dpr = window.devicePixelRatio || 1;
            if (!mazeCache) mazeCache = document.createElement('canvas');
            // Setting width/height resets the context (clears transforms etc.)
            mazeCache.width  = width  * dpr;
            mazeCache.height = height * dpr;
            const mc = mazeCache.getContext('2d');
            mc.scale(dpr, dpr);

            // Floor grid
            mc.strokeStyle = '#ffffff';
            mc.globalAlpha = 0.07;
            mc.lineWidth   = 0.5;
            mc.beginPath();
            const halfCell = cellSize * 0.5;
            for (let gx = 0; gx <= cols * 2; gx++) {
                mc.moveTo(gx * halfCell, 0);
                mc.lineTo(gx * halfCell, height);
            }
            for (let gy = 0; gy <= rows * 2; gy++) {
                mc.moveTo(0, gy * halfCell);
                mc.lineTo(width, gy * halfCell);
            }
            mc.stroke();
            mc.globalAlpha = 1;

            // Maze walls
            mc.strokeStyle = colors.wall;
            mc.lineWidth   = Math.max(1, cellSize * 0.12);
            mc.lineCap     = 'square';
            mc.beginPath();
            if (grid && grid.length > 0) {
                for (let x = 0; x < cols; x++) {
                    for (let y = 0; y < rows; y++) {
                        const cell = grid[x][y];
                        if (!cell || !cell.walls) continue;
                        const cx = x * cellSize, cy = y * cellSize;
                        if (cell.walls[0]) { mc.moveTo(cx,            cy);            mc.lineTo(cx + cellSize, cy);            }
                        if (cell.walls[1]) { mc.moveTo(cx + cellSize, cy);            mc.lineTo(cx + cellSize, cy + cellSize); }
                        if (cell.walls[2]) { mc.moveTo(cx,            cy + cellSize); mc.lineTo(cx + cellSize, cy + cellSize); }
                        if (cell.walls[3]) { mc.moveTo(cx,            cy);            mc.lineTo(cx,            cy + cellSize); }
                    }
                }
            }
            mc.stroke();
            mazeCacheValid = true;
        }

        function drawMaze() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            // Static background: floor grid + walls (rebuilt only when maze changes or canvas resizes)
            if (!mazeCacheValid) buildMazeCache();
            if (mazeCache && mazeCache.width > 0 && mazeCache.height > 0) {
                ctx.drawImage(mazeCache, 0, 0, width, height);
            }

            // Find the leader (closest blazer to goal by BFS distance) — always, from round start
            let closestBlazer = null;
            let minDist = Infinity;
            if (distanceMap.length > 0 && blazers.length > 0) {
                blazers.forEach(blazer => {
                    const d = distanceMap[blazer.gridX]?.[blazer.gridY] ?? Infinity;
                    if (d < minDist) { minDist = d; closestBlazer = blazer; }
                });
            }

            // Heartbeat: plays while the local player is within 8 cells of the goal
            if (gameState === 'PLAYING' && distanceMap.length > 0) {
                const localBlazer = blazers.find(b => b.isActuallyLocal?.() ?? b.isLocal);
                const localDist = localBlazer ? (distanceMap[localBlazer.gridX]?.[localBlazer.gridY] ?? Infinity) : Infinity;
                const HEARTBEAT_THRESHOLD = cols * 2;
                if (localDist <= HEARTBEAT_THRESHOLD) Synth.startHeartbeat(localDist, HEARTBEAT_THRESHOLD);
                else Synth.stopHeartbeat();
            }

            // Always-on background tint: page bg + canvas edges glow in the leader's colour
            if (closestBlazer) {
                const [tr, tg, tb] = hexToRgb(closestBlazer.color);
                bgTintR += (tr - bgTintR) * 0.08;
                bgTintG += (tg - bgTintG) * 0.08;
                bgTintB += (tb - bgTintB) * 0.08;
                // Drive the page background-color to a vivid version of the leader's colour.
                // Only write the style when the rounded values actually change to avoid
                // triggering a style recalculation every animation frame.
                const pr = Math.round(bgTintR * 0.25);
                const pg = Math.round(bgTintG * 0.25);
                const pb = Math.round(bgTintB * 0.25);
                if (pr !== lastBgR || pg !== lastBgG || pb !== lastBgB) {
                    lastBgR = pr; lastBgG = pg; lastBgB = pb;
                    document.body.style.backgroundColor = `rgb(${pr},${pg},${pb})`;
                }
                // Vignette on the canvas edges — gradient cached until colour shifts enough to matter
                const vsR = Math.round(bgTintR / 4) * 4;
                const vsG = Math.round(bgTintG / 4) * 4;
                const vsB = Math.round(bgTintB / 4) * 4;
                if (!vignetteGrad || vsR !== vignetteSnapR || vsG !== vignetteSnapG || vsB !== vignetteSnapB) {
                    vignetteSnapR = vsR; vignetteSnapG = vsG; vignetteSnapB = vsB;
                    vignetteGrad = ctx.createRadialGradient(
                        width / 2, height / 2, Math.min(width, height) * 0.22,
                        width / 2, height / 2, Math.max(width, height) * 0.88
                    );
                    vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
                    vignetteGrad.addColorStop(1, `rgba(${vsR},${vsG},${vsB},0.28)`);
                }
                ctx.fillStyle = vignetteGrad;
                ctx.fillRect(0, 0, width, height);
            }

            // Tension pulse: mirrors AI threat range (cols*2) so flash/heartbeat/AI all react together
            const TENSION_THRESHOLD = cols * 2;
            if (closestBlazer && minDist <= TENSION_THRESHOLD && gameState === 'PLAYING') {
                const TENSION_FAST_DIST = 8; // full intensity from here to the goal
                const remapped = Math.max(0, (Math.max(TENSION_FAST_DIST, minDist) - TENSION_FAST_DIST) / (TENSION_THRESHOLD - TENSION_FAST_DIST));
                const tension = Math.pow(1 - remapped, 3);
                const aboutToWin = (scores[closestBlazer.id] ?? 0) >= WINS_TO_MATCH - 1;
                const maxAlpha = aboutToWin ? 0.80 : 0.58;
                // Pulse rate accelerates as blazer closes in (120ms → 55ms)
                const pulseSpeed = aboutToWin ? 55 : Math.max(55, 120 - tension * 65);
                const pulse = (Math.sin(performance.now() / pulseSpeed) + 1) / 2;
                ctx.fillStyle = closestBlazer.color;
                ctx.globalAlpha = tension * pulse * maxAlpha;
                ctx.fillRect(0, 0, width, height);
                ctx.globalAlpha = 1.0;

                // Chromatic aberration: red/cyan vertical edge bars when on match point
                if (aboutToWin && tension > 0.3) {
                    const edgeAlpha = tension * pulse * 0.55;
                    const edgeWidth = width * (0.12 + tension * 0.10);
                    ctx.save();
                    ctx.globalCompositeOperation = 'screen';
                    // Cyan bleeds in from the left
                    const leftGrad = ctx.createLinearGradient(0, 0, edgeWidth, 0);
                    leftGrad.addColorStop(0, `rgba(0,255,255,${edgeAlpha})`);
                    leftGrad.addColorStop(1, 'rgba(0,255,255,0)');
                    ctx.fillStyle = leftGrad;
                    ctx.fillRect(0, 0, edgeWidth, height);
                    // Red bleeds in from the right
                    const rightGrad = ctx.createLinearGradient(width - edgeWidth, 0, width, 0);
                    rightGrad.addColorStop(0, 'rgba(255,0,0,0)');
                    rightGrad.addColorStop(1, `rgba(255,0,0,${edgeAlpha})`);
                    ctx.fillStyle = rightGrad;
                    ctx.fillRect(width - edgeWidth, 0, edgeWidth, height);
                    ctx.restore();
                }
            }

            // Wall glow: only the walls of the blazer's current cell light up in their colour
            if (blazers.length > 0) {
                blazers.forEach(blazer => {
                    const wcell = grid[blazer.gridX]?.[blazer.gridY];
                    if (!wcell?.walls) return;
                    const wcx = blazer.gridX * cellSize, wcy = blazer.gridY * cellSize;
                    ctx.save();
                    ctx.strokeStyle = blazer.color;
                    ctx.lineWidth = Math.max(1, cellSize * 0.12);
                    ctx.lineCap = 'square';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = blazer.color;
                    ctx.globalAlpha = 0.38;
                    ctx.beginPath();
                    if (wcell.walls[0]) { ctx.moveTo(wcx,            wcy);            ctx.lineTo(wcx + cellSize, wcy);            }
                    if (wcell.walls[1]) { ctx.moveTo(wcx + cellSize, wcy);            ctx.lineTo(wcx + cellSize, wcy + cellSize); }
                    if (wcell.walls[2]) { ctx.moveTo(wcx,            wcy + cellSize); ctx.lineTo(wcx + cellSize, wcy + cellSize); }
                    if (wcell.walls[3]) { ctx.moveTo(wcx,            wcy);            ctx.lineTo(wcx,            wcy + cellSize); }
                    ctx.stroke();
                    ctx.restore();
                });
            }

            const { x: gx, y: gy } = gridToPixel(goal.x, goal.y);
            const time = performance.now() / 500;
            
            ctx.save();
            ctx.translate(gx, gy);

            // Tiny mini-stars floating around the main star
            const miniCount = 5;
            for (let i = 0; i < miniCount; i++) {
                const phase    = (i / miniCount) * Math.PI * 2;
                const orbitR   = cellSize * (0.47 + (i % 2) * 0.06); // alternate inner/outer ring, close to star
                const wobble   = Math.sin(time * 1.5 + phase * 2) * cellSize * 0.035; // gentle float
                const orbitAng = phase + time * (0.65 + i * 0.07);   // each orbits at its own speed
                const mx = Math.cos(orbitAng) * (orbitR + wobble);
                const my = Math.sin(orbitAng) * (orbitR + wobble);
                const mOuter = cellSize * (0.053 + Math.sin(time * 2.2 + phase) * 0.007);
                const mInner = mOuter * 0.4;
                const mHue   = ((time * 120) + i * 72) % 360;
                ctx.save();
                ctx.translate(mx, my);
                ctx.rotate(time * 3 * (i % 2 === 0 ? 1 : -1));
                ctx.beginPath();
                for (let j = 0; j < 10; j++) {
                    const a = j * Math.PI / 5 - Math.PI / 2;
                    const r = j % 2 === 0 ? mOuter : mInner;
                    if (j === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                    else         ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.fillStyle = '#050510';
                ctx.fill();
                ctx.lineWidth  = Math.max(0.5, cellSize * 0.04);
                ctx.strokeStyle = `hsl(${mHue}, 100%, 70%)`;
                ctx.shadowBlur  = 6;
                ctx.shadowColor = `hsl(${mHue}, 100%, 70%)`;
                ctx.stroke();
                ctx.restore();
            }

            // 5 rainbow rays
            ctx.rotate(time * 2.0);
            for (let i = 0; i < 5; i++) {
                ctx.rotate(Math.PI * 2 / 5);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(cellSize * 0.16, cellSize * 0.72);
                ctx.lineTo(-cellSize * 0.16, cellSize * 0.72);
                const rayHue = (i * 72 + time * 100) % 360;
                const alpha = 0.15 + Math.sin(time * 2) * 0.1;
                ctx.fillStyle = `hsla(${rayHue}, 100%, 50%, ${alpha})`;
                ctx.fill();
            }

            // Counter-rotating star body
            ctx.rotate(-time * 1.5);
            const pulse = (Math.sin(time * 3) + 1) / 2;
            const outerR = cellSize * 0.54 + pulse * cellSize * 0.04;
            const innerR = cellSize * 0.22;
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const angle = i * Math.PI / 5 - Math.PI / 2;
                const r = i % 2 === 0 ? outerR : innerR;
                const px = Math.cos(angle) * r;
                const py = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = '#050510';
            ctx.fill();
            const starHue = (time * 150) % 360;
            ctx.lineWidth = 2;
            ctx.strokeStyle = `hsl(${starHue}, 100%, 60%)`;
            ctx.shadowBlur = 18 + pulse * 10;
            ctx.shadowColor = `hsl(${starHue}, 100%, 60%)`;
            ctx.stroke();

            // Central bright spark
            ctx.beginPath();
            ctx.arc(0, 0, cellSize * 0.08, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 20;
            const sparkHue = (time * 300) % 360;
            ctx.shadowColor = `hsl(${sparkHue}, 100%, 50%)`;
            ctx.fill();

            ctx.restore();
        }

        function drawSmokePuffs() {
            const SMOKE_MS = 500;
            const now = performance.now();
            smokePuffs = smokePuffs.filter(puff => {
                const progress = Math.min((now - puff.startTime) / SMOKE_MS, 1);
                if (progress >= 1) return false;

                const { x: fromPx, y: fromPy } = gridToPixel(puff.fromX, puff.fromY);
                const { x: toPx,   y: toPy   } = gridToPixel(puff.toX,   puff.toY);

                // Drift slowly toward destination — fades well before arriving
                const cx = fromPx + (toPx - fromPx) * progress * 0.28;
                const cy = fromPy + (toPy - fromPy) * progress * 0.28;

                // Cloud expands as it disperses
                const puffR  = cellSize * (0.22 + progress * 0.38);
                const alpha  = (1 - progress) * 0.38;

                cloudOffsets.forEach(o => {
                    ctx.beginPath();
                    ctx.arc(cx + o.dx * puffR * 1.3, cy + o.dy * puffR * 1.3, puffR * o.rs, 0, Math.PI * 2);
                    ctx.fillStyle = puff.color;
                    ctx.globalAlpha = alpha;
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = puff.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                ctx.globalAlpha = 1;
                return true;
            });
        }

        /** Trace the shortest path from (startX, startY) to the goal using the client-side distance map. */
        function getPathToGoal(startX, startY) {
            if (!grid[startX]?.[startY] || distanceMap[startX]?.[startY] === undefined) return [];
            const DIRS = [
                { dx:  0, dy: -1, wall: 0 },
                { dx:  1, dy:  0, wall: 1 },
                { dx:  0, dy:  1, wall: 2 },
                { dx: -1, dy:  0, wall: 3 },
            ];
            const path = [];
            let x = startX, y = startY;
            for (let step = 0; step < cols * rows; step++) {
                if (x === goal.x && y === goal.y) break;
                path.push({ x, y });
                const cell = grid[x][y];
                let bestX = -1, bestY = -1, bestDist = distanceMap[x][y] ?? Infinity;
                for (const d of DIRS) {
                    const nx = x + d.dx, ny = y + d.dy;
                    if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && !cell.walls[d.wall]) {
                        const nd = distanceMap[nx]?.[ny] ?? Infinity;
                        if (nd < bestDist) { bestX = nx; bestY = ny; bestDist = nd; }
                    }
                }
                if (bestX === -1) break; // at goal or stuck
                x = bestX; y = bestY;
            }
            return path;
        }

        /** Draw glowing path-cells for any blazer whose beacon power-up is active. */
        function drawBeaconPaths() {
            const now = Date.now();
            blazers.forEach(b => {
                if (!b.beaconUntil || now >= b.beaconUntil) return;
                if (!grid.length || !distanceMap.length) return;
                const timeLeft = (b.beaconUntil - now) / 1000;
                const fadeAlpha = Math.min(1, timeLeft / 1.5); // fade out over last 1.5 s
                const pulse = 0.28 + 0.07 * Math.sin(now / 150);
                // Recompute path only when the blazer has moved to a new cell
                if (b.gridX !== b._beaconPathCacheX || b.gridY !== b._beaconPathCacheY) {
                    b._beaconPathCache = getPathToGoal(b.gridX, b.gridY);
                    b._beaconPathCacheX = b.gridX;
                    b._beaconPathCacheY = b.gridY;
                }
                const path = b._beaconPathCache;
                const pathLen = path.length;
                if (pathLen === 0) return;

                path.forEach(({ x, y }, idx) => {
                    const { x: px, y: py } = gridToPixel(x, y);
                    // Brighter near the player, dimmer towards the goal
                    const intensityFrac = 1 - idx / Math.max(1, pathLen);
                    const alpha = (pulse + intensityFrac * 0.12) * fadeAlpha;

                    // Glowing cell fill — halved brightness
                    ctx.save();
                    ctx.globalAlpha = Math.min(0.275, alpha * 0.5);
                    ctx.fillStyle = b.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = b.color;
                    ctx.fillRect(px - cellSize / 2 + 1, py - cellSize / 2 + 1, cellSize - 2, cellSize - 2);
                    ctx.shadowBlur = 0;
                    ctx.restore();

                    // Directional arrow (white, pointing toward goal)
                    if (idx < pathLen - 1) {
                        const next = path[idx + 1];
                        const angle = Math.atan2(next.y - y, next.x - x);
                        const al = cellSize * 0.18;
                        ctx.save();
                        ctx.translate(px, py);
                        ctx.rotate(angle);
                        ctx.globalAlpha = Math.min(0.375, (pulse + 0.1) * fadeAlpha * 0.5);
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowBlur = 4;
                        ctx.shadowColor = b.color;
                        ctx.beginPath();
                        ctx.moveTo( al,       0);
                        ctx.lineTo(-al * 0.5, -al * 0.5);
                        ctx.lineTo(-al * 0.5,  al * 0.5);
                        ctx.closePath();
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }
                });
            });
        }

        function drawPowerUps() {
            const time = performance.now() / 600;
            powerUps.forEach(p => {
                const { x: px, y: py } = gridToPixel(p.x, p.y);
                ctx.save();
                ctx.translate(px, py);
                if (p.type === 'opponents') {
                    // Spinning dashed circle + cycling "1" — matches menu icon
                    ctx.beginPath();
                    ctx.arc(0, 0, cellSize * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = colors.bg;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ffffff';
                    ctx.setLineDash([5, 5]);
                    ctx.lineDashOffset = -time * 8;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffffff';
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.lineDashOffset = 0;
                    ctx.shadowBlur = 0;
                    const oppCol = playerColors[Math.floor(performance.now() / 300) % playerColors.length] || '#ffff00';
                    ctx.font = `bold ${Math.round(cellSize * 0.32)}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = oppCol;
                    ctx.fillStyle = oppCol;
                    ctx.fillText('1', 0, 0);
                    ctx.shadowBlur = 0;
                } else if (p.type === 'self') {
                    // Spinning dashed circle — matches menu icon
                    ctx.beginPath();
                    ctx.arc(0, 0, cellSize * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = colors.bg;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ffffff';
                    ctx.setLineDash([5, 5]);
                    ctx.lineDashOffset = -time * 8;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffffff';
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.lineDashOffset = 0;
                } else if (p.type === 'rocket') {
                    const pulse = 1 + Math.sin(time * 3) * 0.1;
                    ctx.scale(pulse, pulse);
                    const HR    = cellSize * 0.19;
                    const HH    = cellSize * 0.52;
                    const N     = 64;
                    const lw    = Math.max(1.5, cellSize * 0.07);
                    const slotMs   = 700;
                    const rSlot    = Math.floor((time * 600) / slotMs);
                    const corColor = playerColors[rSlot % playerColors.length] || '#ff3300';
                    drawHelixCorkscrew(ctx, time * 2.5, HR, HH, N, lw, corColor);
                } else if (p.type === 'mirror') {
                    // 4 solid white outward arrows — matches menu icon polygons
                    const s = cellSize * 0.3 / 12;
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 8;
                    // Up:    points="0,-13 5.5,-7.5 -5.5,-7.5"
                    ctx.beginPath();
                    ctx.moveTo(0, -13 * s); ctx.lineTo(5.5 * s, -7.5 * s); ctx.lineTo(-5.5 * s, -7.5 * s);
                    ctx.closePath(); ctx.fill();
                    // Down:  points="0,13 5.5,7.5 -5.5,7.5"
                    ctx.beginPath();
                    ctx.moveTo(0, 13 * s); ctx.lineTo(5.5 * s, 7.5 * s); ctx.lineTo(-5.5 * s, 7.5 * s);
                    ctx.closePath(); ctx.fill();
                    // Left:  points="-13,0 -7.5,5.5 -7.5,-5.5"
                    ctx.beginPath();
                    ctx.moveTo(-13 * s, 0); ctx.lineTo(-7.5 * s, 5.5 * s); ctx.lineTo(-7.5 * s, -5.5 * s);
                    ctx.closePath(); ctx.fill();
                    // Right: points="13,0 7.5,5.5 7.5,-5.5"
                    ctx.beginPath();
                    ctx.moveTo(13 * s, 0); ctx.lineTo(7.5 * s, 5.5 * s); ctx.lineTo(7.5 * s, -5.5 * s);
                    ctx.closePath(); ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (p.type === 'mystery') {
                    // Yellow diamond outline + "?" — matches menu icon
                    const s = cellSize * 0.3 / 12;
                    const d = 12 * s;
                    ctx.strokeStyle = '#ffee00';
                    ctx.lineWidth   = 2;
                    ctx.shadowBlur  = 12;
                    ctx.shadowColor = '#ffee00';
                    // Diamond: polygon points="0,-12 12,0 0,12 -12,0"
                    ctx.beginPath();
                    ctx.moveTo(0, -d); ctx.lineTo(d, 0); ctx.lineTo(0, d); ctx.lineTo(-d, 0);
                    ctx.closePath();
                    ctx.stroke();
                    // "?" label
                    ctx.shadowBlur   = 10;
                    ctx.shadowColor  = '#ffee00';
                    ctx.fillStyle    = '#ffee00';
                    ctx.font         = `bold ${Math.round(cellSize * 0.30)}px monospace`;
                    ctx.textAlign    = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('?', 0, 0);
                    ctx.shadowBlur   = 0;
                } else if (p.type === 'freeze') {
                    // 6-point snowflake, scaled to fill the same space as the self circle
                    const pulse    = (Math.sin(performance.now() / 350) + 1) / 2;
                    const spokeLen = cellSize * 0.30;
                    const barLen   = spokeLen * 0.38;
                    ctx.lineWidth  = Math.max(1, cellSize * 0.055);
                    ctx.lineCap    = 'round';
                    for (let i = 0; i < 6; i++) {
                        const a  = i * Math.PI / 3 + time * 0.25;
                        const tx = Math.cos(a) * spokeLen, ty = Math.sin(a) * spokeLen;
                        const bx = Math.cos(a) * spokeLen * 0.55, by = Math.sin(a) * spokeLen * 0.55;
                        const pa = a + Math.PI / 2;
                        ctx.strokeStyle = '#88ddff';
                        ctx.shadowBlur  = 8 + pulse * 10;
                        ctx.shadowColor = '#00aaff';
                        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(tx, ty); ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(bx - Math.cos(pa) * barLen, by - Math.sin(pa) * barLen);
                        ctx.lineTo(bx + Math.cos(pa) * barLen, by + Math.sin(pa) * barLen);
                        ctx.stroke();
                    }
                    ctx.lineCap    = 'butt';
                    ctx.shadowBlur = 0;
                } else if (p.type === 'beacon') {
                    // Cyan rounded-rect outline — matches menu icon
                    const s  = cellSize * 0.3 / 12;
                    const hw = 11 * s;  // half-width (rect is ±11 in SVG)
                    const rr = 2 * s;   // border-radius
                    ctx.shadowBlur  = 8;
                    ctx.shadowColor = '#00ffff';
                    ctx.globalAlpha = 0.2;
                    ctx.fillStyle   = '#00ffff';
                    ctx.beginPath();
                    ctx.roundRect(-hw, -hw, hw * 2, hw * 2, rr);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth   = 2;
                    ctx.beginPath();
                    ctx.roundRect(-hw, -hw, hw * 2, hw * 2, rr);
                    ctx.stroke();
                    ctx.shadowBlur  = 0;
                }
                ctx.restore();
            });

            // Burst animations for collected opponents power-ups
            const BURST_MS = 600;
            const burstNow = performance.now();
            powerUpBursts = powerUpBursts.filter(burst => {
                const progress = Math.min((burstNow - burst.startTime) / BURST_MS, 1);
                if (progress >= 1) return false;

                const { x: px, y: py } = gridToPixel(burst.gridX, burst.gridY);
                const radius = cellSize * 0.32;

                ctx.save();
                ctx.translate(px, py);

                // Collector colour: fills instantly, fades out
                const fillAlpha = progress < 0.1 ? 1 : Math.max(0, 1 - (progress - 0.1) / 0.9);
                ctx.globalAlpha = fillAlpha;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fillStyle = burst.hitColor;
                ctx.shadowBlur = 15;
                ctx.shadowColor = burst.hitColor;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Other wedges fly toward the player they represent, fading as they reach ~8 cells out
                const maxDist = cellSize * 2.8;
                burst.otherPlayers.forEach(p => {
                    const dist = progress * maxDist;
                    const pieceAlpha = Math.max(0, 1 - progress);
                    ctx.globalAlpha = pieceAlpha;
                    ctx.save();
                    ctx.translate(Math.cos(p.angle) * dist, Math.sin(p.angle) * dist);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    const spread = Math.PI / 6;
                    ctx.arc(0, 0, radius, p.angle - spread, p.angle + spread);
                    ctx.closePath();
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.restore();
                });

                ctx.globalAlpha = 1;
                ctx.restore();
                return true;
            });
        }

        function draw(force = false) {
            if (gameState === 'MENU' && !force) return;
            pollGamepads();

            const now = performance.now();
            const dt = now - lastTime;
            lastTime = now;
            if (dt > 0 && dt < 500) avgFps = avgFps * 0.95 + (1000 / dt) * 0.05;

            ctx.save();
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake, sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
                screenShake -= dt * 0.05; 
                if (screenShake < 0) screenShake = 0;
            }

            drawMaze();
            drawBeaconPaths(); // lit path cells drawn beneath power-ups and blazers
            drawPowerUps();

            // Ambient dust particles — slow drifting specks
            ctx.save();
            dustParticles.forEach(d => {
                d.x += d.vx; d.y += d.vy;
                if (d.x < 0) d.x = width; if (d.x > width) d.x = 0;
                if (d.y < 0) d.y = height; if (d.y > height) d.y = 0;
                ctx.globalAlpha = d.alpha;
                ctx.fillStyle = `hsl(${d.hue}, 70%, 70%)`;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            ctx.restore();

            // Goal ripple rings — emit every 2s, expand outward and fade
            {
                const rippleNow = performance.now();
                if (gameState === 'PLAYING' && rippleNow - lastGoalRippleTime > 2000) {
                    goalRipples.push({ startTime: rippleNow, sonar: false });
                    lastGoalRippleTime = rippleNow;
                }
                if (goalRipples.length > 0) {
                    const { x: grpx, y: grpy } = gridToPixel(goal.x, goal.y);
                    ctx.save();
                    goalRipples = goalRipples.filter(rip => {
                        const t = (rippleNow - rip.startTime) / (rip.sonar ? 1000 : 1500);
                        if (t >= 1) return false;
                        const radius = t * cellSize * (rip.sonar ? 4.5 : 3.2);
                        const alpha = (1 - t) * (rip.sonar ? 0.7 : 0.4);
                        const hue = (rippleNow / 5) % 360;
                        ctx.beginPath();
                        ctx.arc(grpx, grpy, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = Math.max(0.5, cellSize * (rip.sonar ? 0.09 : 0.05));
                        ctx.shadowBlur = rip.sonar ? 14 : 8;
                        ctx.shadowColor = `hsl(${hue}, 100%, 65%)`;
                        ctx.stroke();
                        return true;
                    });
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                if (sw.update(dt)) sw.draw(); else shockwaves.splice(i, 1);
            }

            blazers.sort((a, b) => (a.isPlayer === b.isPlayer) ? 0 : a.isPlayer ? 1 : -1);
            blazers.forEach(blazer => { blazer.update(dt); blazer.draw(); });

            // 3 countdown pulses: big → mid → small, each expanding outward from the blazer
            // Pulse 3 finishes exactly when movement unlocks; blazer briefly flashes white at that moment
            if (roundRingTime !== null) {
                const ringElapsed = now - roundRingTime;
                const ringDuration = ROUND_START_MS;
                if (ringElapsed < ringDuration) {
                    const PULSE_COUNT = 3;
                    const pulseDur = ringDuration / PULSE_COUNT;
                    const pulseIdx = Math.min(PULSE_COUNT - 1, Math.floor(ringElapsed / pulseDur)); // 0,1,2
                    const pulseT = (ringElapsed - pulseIdx * pulseDur) / pulseDur; // 0→1 within pulse
                    // Flash white and unlock at the very start of pulse 3
                    if (pulseIdx === 2 && !roundUnlockFlashFired) {
                        blazers.forEach(b => { if (b.isLocal) b.flashTimer = 1.0; });
                        roundUnlockFlashFired = true;
                    }
                    // Sonar ping from goal at the start of each pulse (3-2-1 countdown feel)
                    while (roundSonarsFired <= pulseIdx) {
                        goalRipples.push({ startTime: roundRingTime + roundSonarsFired * pulseDur, sonar: true });
                        roundSonarsFired++;
                    }
                    // Each pulse reaches a smaller max: big=1.0, mid≈0.67, small≈0.33 of max radius
                    const endFrac = 1 - pulseIdx / PULSE_COUNT;
                    // Ease-out expand — fast burst then settles at the edge
                    const expand = 1 - Math.pow(1 - pulseT, 2);
                    // Base fade: dims as the ring reaches full size
                    const baseAlpha = 0.9 * (1 - pulseT);
                    ctx.save();
                    blazers.forEach(b => {
                        if (!b.isLocal) return;
                        const { x: goalPx, y: goalPy } = gridToPixel(goal.x, goal.y);
                        const dx = goalPx - b.pixelX, dy = goalPy - b.pixelY;
                        const maxRadius = Math.sqrt(dx * dx + dy * dy);
                        const radius = maxRadius * endFrac * expand;
                        if (radius < 2) return;
                        // Pulse 3: also fade out once the ring reaches 2 cells from the blazer
                        const radiusFade = pulseIdx === 2
                            ? Math.max(0, 1 - radius / (2 * cellSize))
                            : 1;
                        const alpha = baseAlpha * radiusFade;
                        if (alpha <= 0) return;
                        ctx.beginPath();
                        ctx.arc(b.pixelX, b.pixelY, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = b.color;
                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = Math.max(1.5, cellSize * 0.07);
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = b.color;
                        ctx.stroke();
                    });
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.restore();
                } else {
                    roundRingTime = null;
                }
            }

            // Player identification labels — every round, fades over ROUND_START_MS
            if (roundRingTime !== null) {
                const labelElapsed = now - roundRingTime;
                if (labelElapsed < ROUND_START_MS) {
                    const alpha = 1 - labelElapsed / ROUND_START_MS;
                    const fontSize = Math.round(cellSize * 0.55);
                    ctx.save();
                    ctx.font = `bold ${fontSize}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    blazers.forEach(b => {
                        if (!b.isLocal) return;
                        const rawLabel = schemeNames[b.controlScheme] ||
                            (b.controlScheme || '?').replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
                        // Split by spaces; "/" merges onto the preceding word's line
                        const tokens = rawLabel.split(' ');
                        const lines = [];
                        for (const tok of tokens) {
                            if (tok === '/' && lines.length > 0) lines[lines.length - 1] += ' /';
                            else lines.push(tok);
                        }
                        const lineH = fontSize * 1.3;
                        const lx = b.pixelX;
                        const goBelow = (b.pixelY - cellSize * 0.72) < fontSize;
                        const blockCenter = goBelow ? b.pixelY + cellSize * 0.72 : b.pixelY - cellSize * 0.72;
                        const ly0 = blockCenter - (lines.length - 1) * lineH / 2;
                        lines.forEach((line, i) => {
                            const ly = ly0 + i * lineH;
                            const tw = ctx.measureText(line).width;
                            const clampedLx = Math.max(tw / 2, Math.min(width - tw / 2, lx));
                            ctx.globalAlpha = alpha * 0.85;
                            ctx.lineWidth = fontSize * 0.25;
                            ctx.strokeStyle = '#000';
                            ctx.shadowBlur = 0;
                            ctx.strokeText(line, clampedLx, ly);
                            ctx.globalAlpha = alpha;
                            ctx.fillStyle = b.color;
                            ctx.shadowBlur = 14;
                            ctx.shadowColor = b.color;
                            ctx.fillText(line, clampedLx, ly);
                        });
                    });
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            }

            // Floating player-name labels on teleport arrival
            if (floatLabels.length > 0) {
                const floatNow = performance.now();
                const FLOAT_MS = 1100;
                const floatFontSize = Math.round(cellSize * 0.48);
                ctx.save();
                ctx.font = `bold ${floatFontSize}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                floatLabels = floatLabels.filter(fl => {
                    const t = (floatNow - fl.startTime) / FLOAT_MS;
                    if (t >= 1) return false;
                    const alpha = t < 0.25 ? t / 0.25 : 1 - (t - 0.25) / 0.75;
                    const yOff = -t * cellSize * 1.8;
                    ctx.globalAlpha = alpha;
                    ctx.shadowBlur = 14;
                    ctx.shadowColor = fl.color;
                    ctx.fillStyle = fl.color;
                    const floatLabel = schemeNames[fl.scheme] || (fl.scheme || '?').replace(/_/g, ' ');
                    ctx.fillText(floatLabel, fl.x, fl.y + yOff);
                    return true;
                });
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            drawSmokePuffs();

            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                const roundDone = gameState === 'ROUND_OVER_COUNTDOWN' || gameState === 'MATCH_OVER';
                if (roundDone) { r.draw(); } else if (r.update(dt)) r.draw(); else rockets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.update(dt)) p.draw(); else particles.splice(i, 1);
            }

            // In-game round over celebration overlay
            if (gameState === 'ROUND_OVER_COUNTDOWN') {
                roundCountdown -= dt;
                const secondsLeft = Math.ceil(roundCountdown / 1000);
                ctx.save();

                const titleSize = Math.max(20, width * 0.06);
                const subSize = Math.max(14, width * 0.04);

                // Slight dark bar for readability
                ctx.fillStyle = "rgba(5, 5, 16, 0.7)";
                ctx.fillRect(0, height / 2 - titleSize * 1.5, width, titleSize * 3.8);

                ctx.font = `bold ${titleSize}px monospace`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 20;
                ctx.shadowColor = currentWinner.color;
                ctx.fillStyle = currentWinner.color;
                ctx.fillText(`${currentWinner.id} Wins the Round!`, width / 2, height / 2 - titleSize * 0.2);

                ctx.fillStyle = "#fff";
                ctx.font = `bold ${subSize}px monospace`;
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 5;
                if (secondsLeft > 0) {
                    ctx.fillText(`Next round in ${secondsLeft}`, width / 2, height / 2 + subSize * 1.5);
                } else {
                    ctx.fillText(`Next round starting...`, width / 2, height / 2 + subSize * 1.5);
                }

                if (!room && secondsLeft > 0) {
                    ctx.fillStyle = "#aaa";
                    ctx.font = `normal ${subSize * 0.8}px monospace`;
                    ctx.shadowBlur = 2;
                    ctx.fillText(`(Press Space to skip)`, width / 2, height / 2 + subSize * 2.8);
                }

                ctx.restore();

                if (roundCountdown <= 0) {
                    if (roundFlashStart === null) roundFlashStart = performance.now();
                    if (!room) initRound(); // networked play uses round_reset message instead
                }
            }

            ctx.restore();

            // Round-transition white flash — full white for 1s then instant cut
            if (roundFlashStart !== null) {
                const elapsed = performance.now() - roundFlashStart;
                if (elapsed >= 1000) {
                    roundFlashStart = null;
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                }
            }

            if (gameState !== 'MENU') {
                if (animationId) cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(() => draw(false));
            }
        }

        // --- INPUT HANDLING ---
        const schemeNames = { WASD: 'WASD', TFGH: 'TFGH', IJKL: 'IJKL', Arrows: 'Arrow Keys', Numpad: 'Numpad (8456)', TouchMouse: 'Touch / Mouse' };

        const controlsMap = {
            'WASD': { up: ['w', 'W'], right: ['d', 'D'], down: ['s', 'S'], left: ['a', 'A'] },
            'TFGH': { up: ['t', 'T'], right: ['h', 'H'], down: ['g', 'G'], left: ['f', 'F'] },
            'IJKL': { up: ['i', 'I'], right: ['l', 'L'], down: ['k', 'K'], left: ['j', 'J'] },
            'Arrows': { up: ['ArrowUp'], right: ['ArrowRight'], down: ['ArrowDown'], left: ['ArrowLeft'] },
            'Numpad': { up: ['8', 'Numpad8'], right: ['6', 'Numpad6'], down: ['5', 'Numpad5'], left: ['4', 'Numpad4'] },
            'TouchMouse': { up: [], right: [], down: [], left: [] }
        };

        // When there is only one local player, merge all keyboard schemes so any keys work.
        function effectiveControlMap(blazer) {
            const localCount = blazers.filter(b => b.isPlayer && b.isActuallyLocal()).length;
            if (localCount === 1) {
                return {
                    up:    Object.values(controlsMap).flatMap(m => m.up),
                    right: Object.values(controlsMap).flatMap(m => m.right),
                    down:  Object.values(controlsMap).flatMap(m => m.down),
                    left:  Object.values(controlsMap).flatMap(m => m.left),
                };
            }
            return controlsMap[blazer.controlScheme];
        }

        // --- GAMEPAD SUPPORT ---
        const gamepadPrevState = {};
        const gamepadABtnPrev = {};

        function getGamepadDirs(gp) {
            const DEADZONE = 0.3;
            return {
                up:    !!(gp.buttons[12]?.pressed) || gp.axes[1] < -DEADZONE,
                right: !!(gp.buttons[15]?.pressed) || gp.axes[0] >  DEADZONE,
                down:  !!(gp.buttons[13]?.pressed) || gp.axes[1] >  DEADZONE,
                left:  !!(gp.buttons[14]?.pressed) || gp.axes[0] < -DEADZONE,
            };
        }

        function pollGamepads() {
            const gamepads = navigator.getGamepads();
            for (let gpIdx = 0; gpIdx <= 7; gpIdx++) {
                const gp = gamepads[gpIdx];
                const scheme = `controller_${gpIdx + 1}`;
                const prev = gamepadPrevState[gpIdx] ?? { up: false, right: false, down: false, left: false };

                const blazer = blazers.find(b => b.isPlayer && b.controlScheme === scheme && b.isActuallyLocal());

                if (!gp || !blazer) {
                    if (!gp && blazer) { blazer.heldDirections = []; blazer.turnIntent = null; }
                    gamepadPrevState[gpIdx] = { up: false, right: false, down: false, left: false };
                    gamepadABtnPrev[gpIdx] = false;
                    continue;
                }

                // A/Cross (button 0): skips local countdown, or triggers Play Again on win screen
                const aPressed = !!(gp.buttons[0]?.pressed);
                if (aPressed && !gamepadABtnPrev[gpIdx]) {
                    if (!room && gameState === 'ROUND_OVER_COUNTDOWN') roundCountdown = 0;
                    else if (gameState === 'MATCH_OVER') menuBtn.click();
                }
                gamepadABtnPrev[gpIdx] = aPressed;

                const curr = getGamepadDirs(gp);
                ['up', 'right', 'down', 'left'].forEach(dir => {
                    if (curr[dir] && !prev[dir]) {
                        if (!blazer.heldDirections.includes(dir)) {
                            blazer.heldDirections.push(dir);
                            if (gameState === 'PLAYING') blazer.turnIntent = { dir, time: performance.now() };
                        }
                    } else if (!curr[dir] && prev[dir]) {
                        const idx = blazer.heldDirections.indexOf(dir);
                        if (idx > -1) blazer.heldDirections.splice(idx, 1);
                        if (blazer.turnIntent?.dir === dir) blazer.turnIntent = null;
                    }
                });
                gamepadPrevState[gpIdx] = curr;
            }
        }

        // Track connected gamepad indices ourselves — getGamepads() may still return the
        // old entry during the gamepaddisconnected callback, so don't rely on it there.
        const connectedGamepadIndices = new Set();

        function updateControllerOptions() {
            lobbySlots.forEach(slot => {
                for (let gpIdx = 0; gpIdx <= 7; gpIdx++) {
                    const existing = slot.controlSelect.querySelector(`.gp-opt-${gpIdx}`);
                    if (connectedGamepadIndices.has(gpIdx) && !existing) {
                        const opt = document.createElement('option');
                        opt.value = `controller_${gpIdx + 1}`;
                        opt.className = `gp-opt-${gpIdx}`;
                        opt.textContent = `Controller ${gpIdx + 1}`;
                        slot.controlSelect.appendChild(opt);
                    } else if (!connectedGamepadIndices.has(gpIdx) && existing) {
                        existing.remove();
                    }
                }
            });
        }

        // gamepadconnected/disconnected keep the Set accurate for disconnect detection,
        // but Chrome won't fire gamepadconnected until a button is pressed. The menu
        // loop polls getGamepads() every frame as the primary detection mechanism.
        window.addEventListener('gamepaddisconnected', (e) => {
            connectedGamepadIndices.delete(e.gamepad.index);
            updateControllerOptions();
        });

        const JOYSTICK_RADIUS   = 34; // px from centre to edge of base
        const JOYSTICK_DEAD     =  8; // px dead zone before a direction registers
        const JOYSTICK_DIAG     = 0.33; // secondary axis fraction threshold for diagonal assist
