<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaze the Maze</title>
    <script src="https://browser.sentry-cdn.com/7.60.0/bundle.min.js" crossorigin="anonymous"></script>
    <!-- Colyseus SDK is vendored locally so the game has no third-party CDN dependency at
         runtime (removes both an availability single-point-of-failure and the supply-chain
         risk of executing CDN-served JS). If it fails to load, __colyseusLoadFailed is set
         and the UI shows a clear "cannot connect" message instead of failing silently. -->
    <script src="vendor/colyseus-0.17.0.js" onerror="window.__colyseusLoadFailed=true;"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            transition: filter 0.1s;
            /* Respect notch / home bar on iOS and Android */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* All viewports: canvas centred in a column, controls above and below */
        #main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: 100%;
            height: 100%;
            padding: clamp(10px, 2vh, 20px);
            box-sizing: border-box;
        }

        /* Top bar: audio controls on the left, menu button on the right */
        #hud-bar {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: min(85vmin, calc(100vh - 280px));
            max-width: 100%;
            flex-shrink: 0;
            z-index: 5;
            transition: opacity 0.3s;
        }

        /* Bottom controls: 2-col grid
           Left  col: friend-code (row 1) | scoreboard (row 2)
           Right col: timer       (row 1) | dpad       (row 2)  */
        #hud {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            width: min(85vmin, calc(100vh - 280px));
            max-width: 100%;
            gap: 8px;
            flex-shrink: 0;
            margin-top: 0;
            z-index: 5;
            transition: opacity 0.3s;
            align-items: start;
        }

        #timer      { grid-column: 1; grid-row: 1; }
        #scoreboard { grid-column: 1; grid-row: 2; }
        #dpad       { grid-column: 2; grid-row: 1 / span 2; align-self: stretch; }

        .hud-buttons {
            display: flex;
            gap: 5px;
        }
        
        #timer {
            font-size: clamp(1.4rem, 3.5vw, 2.5rem);
            font-weight: bold;
            color: #fff;
            font-family: monospace;
            text-shadow: 0 0 5px #000, 0 0 10px #000;
        }
        
        #scoreboard {
            display: flex;
            flex-direction: row;
            color: #fff;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 10px 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }

        .score-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }


        .score-col + .score-col {
            border-left: 1px solid rgba(255,255,255,0.2);
        }

        .score-header {
            font-size: 0.9rem;
            width: 100%;
            text-align: center;
            padding-bottom: 4px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            min-height: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .goal-star-svg {
            transform-box: fill-box;
            transform-origin: center;
            animation: goal-star-spin 6s linear infinite, goal-star-hue 2s linear infinite;
            overflow: visible;
        }
        @keyframes goal-star-spin {
            to { transform: rotate(360deg); }
        }
        @keyframes goal-star-hue {
            to { filter: hue-rotate(360deg); }
        }

        .score-players {
            font-size: 0.8rem;
            line-height: 1.5;
            text-align: center;
            word-break: break-word;
            padding: 0 4px;
        }

        #friend-code-hud {
            font-family: monospace;
            font-size: 0.85rem;
            color: #fff;
            text-align: center;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 8px;
        }

        .display-friend-code {
            /* Render as invisible input so browsers give it native selection behaviour */
            background: none;
            border: none;
            outline: none;
            font-family: monospace;
            font-size: inherit;
            font-weight: bold;
            color: #fff;
            text-align: center;
            width: 9ch;
            padding: 0;
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
        }

        .display-friend-code.copied-flash {
            color: #00ff88 !important;
            transition: color 0.15s;
        }

        #game-container {
            position: relative;
            flex-shrink: 0;
            width: min(85vmin, calc(100vh - 280px));
            max-width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
            background: #000000;
            overflow: hidden;
            transition: filter 0.1s;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.3s, background-color 0.5s;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* Celebratory pulse effect for match winner */
        @keyframes winnerPulse {
            0% { box-shadow: inset 0 0 30px var(--winner-color); background-color: rgba(0, 0, 0, 0.95); }
            50% { box-shadow: inset 0 0 150px var(--winner-color); background-color: rgba(0, 0, 0, 0.80); }
            100% { box-shadow: inset 0 0 30px var(--winner-color); background-color: rgba(0, 0, 0, 0.95); }
        }

        .winner-pulse {
            animation: winnerPulse 2s infinite ease-in-out;
        }

        /* ── Victory stars ──────────────────────────────────────────────────── */
        @keyframes vstar-fall {
            0%   { transform: translateY(0)             rotate(0deg);          opacity: 0;   }
            7%   {                                                               opacity: 1;   }
            88%  {                                                               opacity: 0.9; }
            100% { transform: translateY(var(--vfall))  rotate(var(--vspin));  opacity: 0;   }
        }

        #victory-stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 9999;
        }

        .vstar {
            position: absolute;
            top: -40px;
            pointer-events: none;
            user-select: none;
            will-change: transform, opacity;
            animation: vstar-fall linear infinite;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 3rem);
            margin-bottom: 1rem;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            color: #fff;
            text-align: center;
        }

        p.subtitle {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: #aaa;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
        }

        .menu-friend-code {
            font-family: monospace;
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        /* Post-Match Statistics Customization */
        .pm-buttons-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        .pm-buttons-vertical button {
            width: 100%;
            margin: 0;
        }

        .stats-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .scrollable-rounds {
            overflow-y: auto;
            max-height: 150px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-family: monospace;
            font-size: 1rem;
            color: #ddd;
            text-align: left;
            line-height: 1.8;
        }

        /* Lobby Grid Styles */
        #slots-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        /* Lobby screens always scroll as one unified column — no inner scroll regions */
        #lobby-layer, #lobby-rules-layer {
            justify-content: flex-start;
            padding-top: 24px;
            padding-bottom: 24px;
        }

        .player-slot {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .player-slot.inactive {
            opacity: 0.5;
            border-color: transparent;
        }

        .slot-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        select, input[type="number"] {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
        }

        select:focus, input[type="number"]:focus {
            border-color: #00ffff;
        }

        button.action-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #050510;
            background: #00ffff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #00ffff;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            margin: 5px;
        }

        button.action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff;
        }

        button.secondary-btn {
            background: #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
        }
        
        button.secondary-btn:hover {
            box-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff;
        }

        #in-game-menu-btn {
            border: 2px solid #fff;
        }

        button.tertiary-btn {
            background: #39ff14;
            box-shadow: 0 0 20px #39ff14;
        }
        
        button.tertiary-btn:hover {
            box-shadow: 0 0 30px #39ff14, 0 0 60px #39ff14;
        }

        button.action-btn:disabled {
            background: #444;
            box-shadow: none;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        /* Muted state specifically for the UI audio button */
        button.action-btn.muted {
            background: #555 !important;
            box-shadow: 0 0 10px #555 !important;
            color: #aaa !important;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .join-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .join-group input[type="text"] {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            font-family: monospace;
            outline: none;
            width: 120px;
            text-align: center;
            text-transform: uppercase;
        }

        .join-group input[type="text"]::placeholder {
            color: rgba(255,255,255,0.3);
            text-transform: none;
        }

        .join-group button {
            padding: 10px 25px;
            font-size: 1rem;
            margin: 0;
        }

        .lobby-settings-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .rules-panel-wrap {
            display: flex;
            flex-direction: column;
            align-self: center;
            width: 100%;
            max-width: 480px;
        }

        #apply-player-defaults-btn {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .lobby-settings-panel {
            width: 100%;
            box-sizing: border-box;
        }

        #version-number { display: none; }

        .ver-text {
            font-family: monospace;
            font-size: 0.75rem;
            color: #fff;
            white-space: nowrap;
            flex-shrink: 0;
        }

        #hud-bar .ver-text {
            margin-right: 8px;
        }

        .audio-controls {
            display: flex;
            gap: 8px;
        }

        .audio-btn {
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: #00ffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
        }

        .audio-btn:hover {
            box-shadow: 0 0 16px rgba(0, 255, 255, 0.5);
        }

        .audio-btn svg.icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .audio-btn .slash {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .audio-btn.muted {
            color: #555;
            border-color: rgba(80, 80, 80, 0.4);
            box-shadow: none;
        }

        .audio-btn.muted .slash {
            display: block;
        }

        #dpad {
            display: grid;
            grid-template-areas: ". up ." "left down right";
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 60px);
            align-content: center;
            gap: 8px;
            width: 100%;
            padding: 6px 0;
        }

        #dpad.hidden { display: none; }

        @keyframes legend-color-cycle {
            0%    { fill: #ff0055; }
            12.5% { fill: #ff8800; }
            25%   { fill: #ffee00; }
            37.5% { fill: #00ff22; }
            50%   { fill: #00ffff; }
            62.5% { fill: #4466ff; }
            75%   { fill: #aa00ff; }
            87.5% { fill: #ff00ff; }
            100%  { fill: #ff0055; }
        }
        .legend-color-cycle { animation: legend-color-cycle 2.4s steps(8, end) infinite; }

        @keyframes dash-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .spin-dash {
            animation: dash-spin 4s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        /* Power-up legend (replaces dpad) */
        #pu-legend {
            grid-column: 2;
            grid-row: 1 / span 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            color: rgba(255, 255, 255, 0.85);
            font-family: monospace;
            font-size: clamp(0.58rem, 1.4vmin, 0.8rem);
            align-self: stretch;
        }

        .pu-legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pu-legend-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            overflow: visible;
        }

        /* Popup joystick */
        #joystick-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        #joystick-base {
            position: absolute;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 3px solid rgba(0, 255, 255, 0.45);
            background: rgba(0, 0, 0, 0.25);
            box-shadow: 0 0 24px rgba(0, 255, 255, 0.15);
            transform: translate(-50%, -50%);
        }
        #joystick-knob {
            position: absolute;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.7);
            box-shadow: 0 0 14px rgba(0, 255, 255, 0.55);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background 0.07s, transform 0.07s, border-bottom-width 0.07s;
        }

        .dpad-btn[data-dir="up"]    { grid-area: up; }
        .dpad-btn[data-dir="left"]  { grid-area: left; }
        .dpad-btn[data-dir="right"] { grid-area: right; }
        .dpad-btn[data-dir="down"]  { grid-area: down; }

        .dpad-btn.pressed {
            background: rgba(0, 255, 255, 0.15);
            border-color: rgba(0, 255, 255, 0.45);
            color: #00ffff;
            transform: translateY(2px);
        }

        /* Lobby slots go single-column below 600px */
        @media (max-width: 600px) {
            #slots-container { grid-template-columns: 1fr; }
        }

        /* Mobile / Portrait — layout is already column from desktop styles.
           Only override: menus go full-screen, lobby scrolls from top. */
        @media (max-width: 900px), (max-aspect-ratio: 1/1) {
            #slots-container { grid-template-columns: 1fr; }

            /* Menus cover full viewport (not just the canvas square) */
            .menu-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                height: auto;
                z-index: 1000;
            }

            /* On mobile, respect the notch safe area for lobby top padding */
            #lobby-layer, #lobby-rules-layer { padding-top: max(24px, env(safe-area-inset-top)); }

            /* Join code input fills available space */
            .join-group { width: 90%; }
            .join-group input[type="text"] { flex: 1; width: auto; min-width: 80px; }
        }

        /* Extra-small phones (≤ 480px) */
        @media (max-width: 480px) {
            .menu-overlay { padding: 12px; }

            button.action-btn {
                padding: 12px 28px;
                font-size: 1rem;
            }

            .lobby-settings-panel > div {
                flex-wrap: wrap;
            }

            #scoreboard {
                font-size: 0.78rem;
                padding: 6px;
            }
        }

        #menu-title {
            color: #fff; font-size: 3.5em; font-style: italic; font-weight: 900;
            letter-spacing: 4px; text-transform: uppercase;
            transform: skewX(-20deg);
            transform-origin: left center;
            text-shadow:
                -5px   0px  0px rgba(255,120,120,0.60),
                -11px -1px  0px rgba(255, 70, 70,0.50),
                -18px -2px  0px rgba(240, 40, 40,0.40),
                -27px -3px  0px rgba(210, 20, 20,0.30),
                -38px -4px  0px rgba(180, 10, 10,0.22),
                -51px -5px  0px rgba(150,  5,  5,0.15),
                -67px -7px  0px rgba(120,  2,  2,0.10),
                -90px  -9px 25px rgba(200,  0,  0,0.12),
               -150px -15px 45px rgba(100,  0,  0,0.08);
            margin: 0; padding: 0 30px; flex-shrink: 0; align-self: flex-start;
        }
        #menu-mini-canvas {
            display: block;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div id="version-number">v1.5.333</div>

    <div id="main-wrapper">
        <!-- Top bar: audio controls (left) + menu button (right), above the canvas -->
        <div id="hud-bar" class="hidden">
            <div class="audio-controls">
                <button class="audio-btn music-btn" title="Toggle Music">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                    <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
                <button class="audio-btn sfx-btn" title="Toggle Sound Effects">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div id="friend-code-hud">Friend code:<br><input class="display-friend-code" readonly value="" tabindex="-1"></div>
            <span class="ver-text"></span>
            <div class="hud-buttons">
                <button class="action-btn secondary-btn" id="in-game-menu-btn" style="padding: 10px; font-size: 0.9rem; flex: 1; margin: 0;">Menu</button>
            </div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <!-- This menu now ONLY appears when the entire match is over -->
            <div id="post-match-layer" class="menu-overlay hidden">
                <h1 id="pm-title">Match Over</h1>

    <script>
        // --- ERROR MONITORING ---
        if (typeof Sentry !== 'undefined') {
            Sentry.init({
                dsn: 'https://26e32c9a0c7a4f6e857f255d14fe9cb2@glitchtip.unusualtechnologies.com/15',
                tracesSampleRate: 0.2,
            });
        }

        // --- BULLETPROOF AUDIO SYSTEM ---
        // Web: always starts muted — first click anywhere unmutes, then only buttons control it.
        // Electron: starts unmuted (no autoplay restrictions); localStorage saves the preference.
        const _isElectron = !!window.electronAPI;
        const _savedMusicMuted = _isElectron ? localStorage.getItem('blazeMusicMuted') : null;
        const _savedSfxMuted   = _isElectron ? localStorage.getItem('blazeSfxMuted')   : null;
        const Synth = {
            isMusicMuted: _savedMusicMuted !== null ? _savedMusicMuted === '1' : !_isElectron,
            isSfxMuted:   _savedSfxMuted   !== null ? _savedSfxMuted   === '1' : !_isElectron,
            bgMusic:       new Audio('./assets/audio/music_game.ogg'),
            menuMusic:     new Audio('./assets/audio/music_menu.ogg'),
            victoryMusic:  new Audio('./assets/audio/music_victory.ogg'),
            defeatMusic:   new Audio('./assets/audio/music_fail.ogg'),
            heartbeatSingle: new Audio('./assets/audio/heartbeat_single.ogg'),
            _menuMusicActive: false,
            _heartbeatActive:    false,
            _heartbeatTimer:     null,
            _heartbeatDist:      Infinity,
            _heartbeatThreshold: 20,
            // Master volume table — all defaults live here. Debug panel reads/writes this.
            _volumes: {
                'music_game.ogg':       0.32,
                'music_menu.ogg':       0.35,
                'heartbeat_single.ogg': 0.5,
                'music_victory.ogg':    0.6,
                'music_fail.ogg':       0.6,
                'zip.ogg':              0.6,
                'glitch.ogg':           0.6,
                'win.ogg':              0.6,
                'rocket_hit_star.ogg':  0.6,
                'rocket_launch.ogg':    0.55,
                'rocket_hit.ogg':       0.7,
                'freeze_cast.ogg':      0.6,
                'freeze_thaw.ogg':      0.6,
                'pu_pickup_self.ogg':   0.6,
                'pu_pickup_opp.ogg':    0.6,
                'pu_pickup_mystery.ogg':0.6,
                'countdown.ogg':        0.6,
                'speed.ogg':            0.6,
                'ui_click.ogg':         0.4,
            },
            init() {
                this.bgMusic.loop = true;
                this.bgMusic.volume = this._volumes['music_game.ogg'];
                this._setupTrack(this.bgMusic, 'music_game.ogg');
                this.menuMusic.loop = true;
                this.menuMusic.volume = this._volumes['music_menu.ogg'];
                this._setupTrack(this.menuMusic, 'music_menu.ogg');
                this._setupTrack(this.heartbeatSingle, 'heartbeat_single.ogg');
                this._setupTrack(this.victoryMusic, 'music_victory.ogg');
                this._setupTrack(this.defeatMusic, 'music_fail.ogg');
                this._syncButtons();
            },
            _setupTrack(audio, filename) {
                audio.onerror = () => {
                    console.warn(`[Audio] Missing: ${filename}`);
                    if (typeof Sentry !== 'undefined') Sentry.captureMessage(`Audio file missing: ${filename}`, 'warning');
                };
            },
            _syncButtons() {
                document.querySelectorAll('.music-btn').forEach(b => b.classList.toggle('muted', this.isMusicMuted));
                document.querySelectorAll('.sfx-btn').forEach(b => b.classList.toggle('muted', this.isSfxMuted));
            },
            playSound(filename, volume = 0.6) {
                if (this.isSfxMuted) return;
                const audio = new Audio('./assets/audio/' + filename);
                audio.volume = this._volumes[filename] ?? volume;
                audio.onerror = () => {
                    console.warn(`[Audio] Missing SFX: ${filename}`);
                    if (typeof Sentry !== 'undefined') Sentry.captureMessage(`Audio file missing: ${filename}`, 'warning');
                };
                audio.play().catch(() => {});
            },
            // One-shot stingers controlled by the music button, not the SFX button
            playMusicSound(filename, volume = 0.6) {
                if (this.isMusicMuted) return;
                const audio = new Audio('./assets/audio/' + filename);
                audio.volume = this._volumes[filename] ?? volume;
                audio.onerror = () => console.warn(`[Audio] Missing: ${filename}`);
                audio.play().catch(() => {});
            },
            // SFX triggers
            zip()           { this.playSound('zip.ogg'); },
            glitch()        { this.playSound('glitch.ogg'); },
            win()           { this.playSound('win.ogg'); },
            rocketHitStar() { this.playSound('rocket_hit_star.ogg'); },
            rocketLaunch()  { this.playSound('rocket_launch.ogg', 0.55); },
            rocketHit()     { this.playSound('rocket_hit.ogg', 0.7); },
            freezeCast()    { this.playSound('freeze_cast.ogg'); },
            freezeThaw()    { this.playSound('freeze_thaw.ogg'); },
            puPickupSelf()  { this.playSound('pu_pickup_self.ogg'); },
            puPickupOpp()   { this.playSound('pu_pickup_opp.ogg'); },
            puPickupMystery(){ this.playSound('pu_pickup_mystery.ogg'); },
            countdownBeep() { this.playSound('countdown.ogg'); },
            speedBoost()    { this.playSound('speed.ogg'); },
            uiClick()       { this.playSound('ui_click.ogg', 0.4); },
            // Music control
            startMenuMusic() {
                this._menuMusicActive = true;
                this.bgMusic.pause(); // stop game music underneath
                if (this.isMusicMuted) return;
                this.menuMusic.currentTime = 0;
                this.menuMusic.play().catch(() => {});
            },
            stopMenuMusic() {
                this._menuMusicActive = false;
                this.menuMusic.pause();
                this.menuMusic.currentTime = 0;
            },
            playVictoryStinger() {
                if (this.isSfxMuted) return;
                this.victoryMusic.volume = this._volumes['music_victory.ogg'];
                this.victoryMusic.currentTime = 0;
                this.victoryMusic.play().catch(() => {});
            },
            playDefeatStinger() {
                if (this.isSfxMuted) return;
                this.defeatMusic.volume = this._volumes['music_fail.ogg'];
                this.defeatMusic.currentTime = 0;
                this.defeatMusic.play().catch(() => {});
            },
            startHeartbeat(dist, threshold) {
                this._heartbeatDist      = dist;
                this._heartbeatThreshold = threshold ?? this._heartbeatThreshold ?? 20;
                if (this._heartbeatActive) return; // already ticking; dist/threshold updated, next beat picks them up
                this._heartbeatActive = true;
                this._scheduleHeartbeat(true); // immediate first beat
            },
            stopHeartbeat() {
                this._heartbeatActive = false;
                if (this._heartbeatTimer) { clearTimeout(this._heartbeatTimer); this._heartbeatTimer = null; }
            },
            _scheduleHeartbeat(immediate) {
                if (!this._heartbeatActive) return;
                // dist ≤8 → 300ms (max speed), dist threshold → 1000ms; capped at 8 cells
                const HEARTBEAT_FAST_DIST = 8;
                const maxDist = (this._heartbeatThreshold ?? 20) - HEARTBEAT_FAST_DIST;
                const clampedDist = Math.max(HEARTBEAT_FAST_DIST, this._heartbeatDist);
                const t = Math.max(0, Math.min(1, (clampedDist - HEARTBEAT_FAST_DIST) / maxDist));
                const interval = Math.round(300 + t * 700);
                const delay = immediate ? 0 : interval;
                this._heartbeatTimer = setTimeout(() => {
                    if (!this._heartbeatActive) return;
                    if (!this.isSfxMuted) {
                        this.heartbeatSingle.currentTime = 0;
                        this.heartbeatSingle.volume = this._volumes['heartbeat_single.ogg'];
                        this.heartbeatSingle.play().catch(() => {});
                    }
                    this._scheduleHeartbeat(false);
                }, delay);
            },
            startMusic() {
                this.stopMenuMusic(); // stop menu music before game music starts
                if (!this.isMusicMuted) {
                    this.bgMusic.play().catch(() => {});
                }
            },
            muffle(isMuffled) {
                const gv = this._volumes['music_game.ogg'];
                this.bgMusic.volume = isMuffled ? gv * 0.375 : gv;
            },
            toggleMusic() {
                this.isMusicMuted = !this.isMusicMuted;
                if (this.isMusicMuted) {
                    this.bgMusic.pause();
                    this.menuMusic.pause();
                } else {
                    if (this._menuMusicActive) {
                        this.menuMusic.play().catch(() => {});
                    } else {
                        this.bgMusic.play().catch(() => {});
                    }
                }
                if (_isElectron) localStorage.setItem('blazeMusicMuted', this.isMusicMuted ? '1' : '0');
                this._syncButtons();
            },
            toggleSfx() {
                this.isSfxMuted = !this.isSfxMuted;
                if (_isElectron) localStorage.setItem('blazeSfxMuted', this.isSfxMuted ? '1' : '0');
                this._syncButtons();
            }
        };
        // --- END AUDIO SYSTEM ---

        // ── DEBUG VOLUME PANEL ────────────────────────────────────────────────────
        // Temporary widget for tuning volumes. Remove once values are locked in.
        (function buildDebugAudioPanel() {
            const LOOP_ENTRIES = [
                { label: 'music_game',    file: 'music_game.ogg',    obj: () => Synth.bgMusic },
                { label: 'music_menu',    file: 'music_menu.ogg',    obj: () => Synth.menuMusic },
            ];
            const LOOP_FILES = new Set(LOOP_ENTRIES.map(e => e.file));

            const panel = document.createElement('div');
            panel.id = 'debug-audio-panel';
            Object.assign(panel.style, {
                position: 'fixed', right: '10px', top: '50%', transform: 'translateY(-50%)',
                background: 'rgba(0,0,0,0.88)', color: '#ddd', padding: '8px 10px',
                borderRadius: '8px', fontFamily: 'monospace', fontSize: '11px',
                width: '340px', maxHeight: '82vh', overflowY: 'auto',
                zIndex: '9999', border: '1px solid #555', lineHeight: '1.2',
            });

            const addSection = (title) => {
                const el = document.createElement('div');
                Object.assign(el.style, { margin: '7px 0 3px', fontSize: '10px', color: '#777',
                    borderTop: '1px solid #333', paddingTop: '4px' });
                el.textContent = title;
                panel.appendChild(el);
            };

            const addRow = (label, file, audioObjGetter) => {
                const vol = Synth._volumes[file] ?? 0.6;
                const row = document.createElement('div');
                Object.assign(row.style, { display: 'flex', alignItems: 'center', margin: '2px 0', gap: '4px' });

                const lbl = document.createElement('span');
                Object.assign(lbl.style, { width: '160px', overflow: 'hidden', textOverflow: 'ellipsis',
                    whiteSpace: 'nowrap', color: '#aaa', fontSize: '10px', cursor: 'default' });
                lbl.title = file;
                lbl.textContent = label;

                const slider = document.createElement('input');
                slider.type = 'range'; slider.min = 0; slider.max = 1; slider.step = 0.01;
                slider.value = vol;
                Object.assign(slider.style, { flex: '1', accentColor: '#7af', cursor: 'pointer' });

                const valSpan = document.createElement('span');
                Object.assign(valSpan.style, { width: '32px', textAlign: 'right', color: '#7af', fontSize: '11px' });
                valSpan.textContent = vol.toFixed(2);

                slider.addEventListener('input', () => {
                    const v = parseFloat(slider.value);
                    valSpan.textContent = v.toFixed(2);
                    Synth._volumes[file] = v;
                    if (audioObjGetter) audioObjGetter().volume = v;
                });

                row.appendChild(lbl); row.appendChild(slider); row.appendChild(valSpan);
                panel.appendChild(row);
            };

            // Header with collapse toggle
            const header = document.createElement('div');
            Object.assign(header.style, { fontWeight: 'bold', marginBottom: '4px', fontSize: '12px',
                display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' });
            header.innerHTML = '<span>🔊 Vol Debug</span><span id="dbg-toggle" style="color:#7af;user-select:none;">▲</span>';
            panel.appendChild(header);

        // ── Auto-scale power-up counts and grid size to player count ─────────
        // Formulas (n = number of active players):
        //   Teleport Other / Self : 7 − (n−1)          [−1 per extra player, base 6 at 1p]
        //   Homing Missiles       : 4  − ⌊(n−1)/2⌋    [−1 per 2 extra players]
        //   Mirror Controls       : 0  (off by default)
        //   Grid Size             : 20 (1-2p) → 21 (3-4p) → 22 (5-6p) → 23 (7-8p)
        // Inputs that were manually edited (puManualFlags / gridSizeManualFlag) are left unchanged.
        function updatePowerUpDefaults() {
            const n = lobbySlots.filter(s => {
                const v = s.typeSelect.value;
                return v !== 'inactive' && v !== 'friend_only';
            }).length;
            const bracket = Math.floor((n - 1) / 2); // 0=1-2p, 1=3-4p, 2=5-6p, 3=7-8p

            const auto = {
                opp:     Math.max(0, 10 - bracket),
                self:    Math.max(0, 10 - bracket),
                rocket:  Math.max(0, 5  - bracket),
                mirror:  0,
                mystery: 0,
                freeze:  0,
                beacon:  0,
            };

            PU_KEYS.forEach(k => {
                if (!puManualFlags.has(k)) {
                    const el = document.getElementById(`pu-${k}-input`);
                    if (el) el.value = String(auto[k]);
                }
            });

            if (!gridSizeManualFlag) {
                gridSizeInput.value = String(20 + bracket);
            }
        }

        /**
         * Apply maze dimensions and power-up counts scaled to the current player count.
         * Grid: 20 (1-2p) → 21 (3-4p) → 22 (5-6p) → 23 (7-8p)
         * Teleport leader / self: 10, 9, 8, 7  (-1 per bracket)
         * Homing missile:         5,  4, 3, 2  (-1 per bracket)
         * All other power-ups: 0
         * Always overrides current values regardless of manual-edit flags.
         */
        function applyPlayerCountDefaults() {
            const n = lobbySlots.filter(s => {
                const v = s.typeSelect.value;
                return v !== 'inactive' && v !== 'friend_only';
            }).length;
            const bracket = Math.floor((n - 1) / 2); // 0=1-2p, 1=3-4p, 2=5-6p, 3=7-8p
            gridSizeInput.value = String(20 + bracket);
            clampGridSizeInput();
            puOppInput.value    = String(Math.max(0, 10 - bracket));
            puSelfInput.value   = String(Math.max(0, 10 - bracket));
            puRocketInput.value = String(Math.max(0, 5  - bracket));
            puMirrorInput.value  = '0';
            puMysteryInput.value = '0';
            puFreezeInput.value  = '0';
            puBeaconInput.value  = '0';
            // Clear manual flags so future slot-count changes can auto-scale again
            puManualFlags.clear();
            gridSizeManualFlag = false;
        }

            };
        }

        /**
         * Restore a previously saved lobby state.  If nothing has been saved yet, falls through to
         * updatePowerUpDefaults() so the first visit always gets sensible auto-scaled values.
         */
        function restoreLobbyState() {
            if (!savedLobbyState) { updatePowerUpDefaults(); return; }
            const s = savedLobbyState;
            // 1. Lock ALL auto-scaling keys so slot change events can't overwrite saved values
            PU_KEYS.forEach(k => puManualFlags.add(k));
            gridSizeManualFlag = true;
            // 2. Restore each slot (dispatching 'change' keeps the show/hide UI logic in sync)
            s.slots.forEach((sd, i) => {
                const slot = lobbySlots[i];
                if (!slot) return;
                slot.typeSelect.value = sd.mode;
                slot.typeSelect.dispatchEvent(new Event('change'));
                slot.controlSelect.value    = sd.control;
                slot.aiBehaviorSelect.value = sd.aiBehavior;
                slot.aiSpeedSelect.value    = sd.aiSpeed;
                slot.aiSpeedSelect.dispatchEvent(new Event('change')); // shows/hides custom-speed wrapper
                slot.customSpeedSlider.value = sd.customSpeed;
                const display = slot.customSpeedSlider.parentElement.querySelector('.custom-speed-display');
                if (display) display.innerText = sd.customSpeed;
            });
            // 3. Restore all settings inputs
            gridSizeInput.value  = s.gridSize;
            puOppInput.value     = s.puOpp;
            puSelfInput.value    = s.puSelf;
            puRocketInput.value  = s.puRocket;
            puMirrorInput.value  = s.puMirror;
            puMysteryInput.value = s.puMystery;
            puFreezeInput.value  = s.puFreeze;
            puBeaconInput.value  = s.puBeacon;
            document.getElementById('collisions-toggle').checked = s.collisions;
            orbLeaderToggle.checked = s.orbLeader;
            if (s.moveSpeed) moveSpeedSelect.value = s.moveSpeed;
            // 4. Restore the actual manual-flag state (not the all-locked state from step 1)
            puManualFlags      = new Set(s.puManualFlags);
            gridSizeManualFlag = s.gridSizeManual;
        }

        // --- ENTITY CLASSES ---
        class Cell {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.walls = [true, true, true, true]; 
                this.visited = false;
            }
        }

        class Shockwave {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.life = 1.0;
                this.maxRadius = cellSize * 4;
            }
            update(dt) {
                this.life -= dt * 0.002; 
                return this.life > 0;
            }
            draw() {
                const currentRadius = (1 - this.life) * this.maxRadius;
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.life * 8;
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                // Faster and more dramatic burst speed for stronger visual impact
                const speed = (Math.random() * 15 + 4) * (cellSize * 0.02); 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01; 
                this.size = Math.random() * (cellSize * 0.25) + 2;
            }
            update(dt) {
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.x += this.vx * (dt * 0.05);
                this.y += this.vy * (dt * 0.05);
                this.life -= this.decay * (dt * 0.05);
                return this.life > 0;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }
        
        function drawHelixCorkscrew(ctx, phase, HR, HH, N, lw, color, shadowBlur = 10) {
            const TURNS = 2.5;
            const hpts = [];
            for (let s = 0; s <= N; s++) {
                const t = (s / N) * TURNS * Math.PI * 2;
                hpts.push({ x: HR * Math.cos(t + phase), y: -HH / 2 + (s / N) * HH, z: Math.sin(t + phase) });
            }
            ctx.lineWidth = lw;
            ctx.lineCap   = 'round';
            ctx.lineJoin  = 'round';
            ctx.globalAlpha = 0.28;
            ctx.strokeStyle = color;
            ctx.shadowBlur  = 0;
            ctx.beginPath();
            let inSeg = false;
            for (const hp of hpts) {
                if (hp.z < 0) { if (!inSeg) { ctx.moveTo(hp.x, hp.y); inSeg = true; } else ctx.lineTo(hp.x, hp.y); }
                else { inSeg = false; }
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = color;
            ctx.shadowBlur  = shadowBlur;
            ctx.shadowColor = color;
            ctx.beginPath();
            inSeg = false;
            for (const hp of hpts) {
                if (hp.z >= 0) { if (!inSeg) { ctx.moveTo(hp.x, hp.y); inSeg = true; } else ctx.lineTo(hp.x, hp.y); }
                else { inSeg = false; }
            }
            ctx.stroke();
            ctx.shadowBlur  = 0;
            ctx.globalAlpha = 1;
        }

        class Rocket {
            constructor(x, y, color, id, ownerSessionId = null) {
                this.gridX = x;
                this.gridY = y;
                ({ x: this.pixelX, y: this.pixelY } = gridToPixel(x, y));
                this.color = color;
                this.id = id;
                this.ownerSessionId = ownerSessionId; // activator — immune to their own rocket
                this.moveTimer = 0;
                this.moveInterval = 50; // Zooms at 50ms per square
                this.life = true;
                this.angle = 0;
                this.stepsTaken = 0;
                this.hitTargets = new Set(); // prevents double-reporting the same target
                this.trail = [];
                this.maxTrail = 14;
            }

            update(dt) {
                this.moveTimer += dt;

                // Smooth visual following
                const target = gridToPixel(this.gridX, this.gridY);
                this.pixelX += (target.x - this.pixelX) * 0.52;
                this.pixelY += (target.y - this.pixelY) * 0.52;

                // Record pixel position for trail
                this.trail.push({ x: this.pixelX, y: this.pixelY });
                if (this.trail.length > this.maxTrail) this.trail.shift();

                if (this.moveTimer >= this.moveInterval) {
                    this.moveTimer = 0;
                    try { this.step(); } catch(e) { console.warn('Rocket step error:', e); }
                }
                return this.life;
            }

            step() {
                if (this.gridX === goal.x && this.gridY === goal.y) {
                    this.life = false;
                    Synth.rocketHitStar();
                    for(let i=0; i<20; i++) { if (particles.length < 200) particles.push(new Particle(this.pixelX, this.pixelY, this.color)); }
                    return;
                }

                const currDist = distanceMap[this.gridX][this.gridY];
                let bestMove = null;
                let minDist = currDist;
                
                const cell = grid[this.gridX][this.gridY];

                if (!cell.walls[0] && distanceMap[this.gridX][this.gridY-1] < minDist) { bestMove = {dx: 0, dy: -1}; minDist = distanceMap[this.gridX][this.gridY-1]; }
                if (!cell.walls[1] && distanceMap[this.gridX+1][this.gridY] < minDist) { bestMove = {dx: 1, dy: 0}; minDist = distanceMap[this.gridX+1][this.gridY]; }
                if (!cell.walls[2] && distanceMap[this.gridX][this.gridY+1] < minDist) { bestMove = {dx: 0, dy: 1}; minDist = distanceMap[this.gridX][this.gridY+1]; }
                if (!cell.walls[3] && distanceMap[this.gridX-1][this.gridY] < minDist) { bestMove = {dx: -1, dy: 0}; minDist = distanceMap[this.gridX-1][this.gridY]; }

                if (bestMove) {
                    this.gridX += bestMove.dx;
                    this.gridY += bestMove.dy;
                    this.angle = Math.atan2(bestMove.dy, bestMove.dx);
                    this.stepsTaken++;
                } else {
                    // No valid move (shouldn't happen in a connected maze — skip this step)
                    this.stepsTaken++;
                }

                // Check collision with blazers on the way
                if (this.stepsTaken > 0) {
                    blazers.forEach(b => {
                        if (b.gridX === this.gridX && b.gridY === this.gridY && b.state === 'normal') {
                            if (this.hitTargets.has(b.sessionId)) return;
                            if (b.sessionId === this.ownerSessionId) return; // activator is immune
                            this.hitTargets.add(b.sessionId);
                            screenShake = 10;
                            Synth.rocketHit();
                            for(let i=0; i<15; i++) { if (particles.length < 200) particles.push(new Particle(this.pixelX, this.pixelY, this.color)); }
                            // The hit/teleport is resolved server-side (the server simulates the
                            // rocket); onStateChange drives the victim's teleport visual. We only
                            // play local FX here, so a client can no longer spoof rocket hits.
                            if (this.ownerSessionId === room?.sessionId) achRoundRocketHit = true;
                        }
                    });
                }

                if (this.gridX === goal.x && this.gridY === goal.y) {
                    this.life = false;
                    Synth.rocketHitStar();
                    for(let i=0; i<20; i++) { if (particles.length < 200) particles.push(new Particle(this.pixelX, this.pixelY, this.color)); }
                }
            }

            draw() {
                // Comet trail — glowing line segments, fading toward the tail
                if (this.trail.length > 1) {
                    ctx.save();
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.shadowColor = this.color;
                    for (let i = 1; i < this.trail.length; i++) {
                        const frac = i / this.trail.length; // 0=oldest gap, 1=newest gap
                        ctx.lineWidth = Math.max(1, cellSize * 0.14 * frac);
                        ctx.strokeStyle = this.color;
                        ctx.globalAlpha = frac * 0.7;
                        ctx.shadowBlur = 10 * frac;
                        ctx.beginPath();
                        ctx.moveTo(this.trail[i - 1].x, this.trail[i - 1].y);
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }

                const HR    = cellSize * 0.12;
                const HH    = cellSize * 0.38;
                const N     = 48;
                const lw    = Math.max(1.5, cellSize * 0.06);
                const phase = performance.now() / 150;
                ctx.save();
                ctx.translate(this.pixelX, this.pixelY);
                ctx.rotate(this.angle + Math.PI / 2);
                drawHelixCorkscrew(ctx, phase, HR, HH, N, lw, this.color);
                ctx.restore();
            }
        }

        function mirrorDir(dir) {
            if (dir === 'up') return 'down';
            if (dir === 'down') return 'up';
            if (dir === 'left') return 'right';
            if (dir === 'right') return 'left';
            return dir;
        }

        class Blazer {
            constructor(data) {
                const pos = getStartPos(data.startIndex || 0);
                this.gridX = data.x !== undefined ? data.x : pos.x;
                this.gridY = data.y !== undefined ? data.y : pos.y;
                this.pixelX = 0;
                this.pixelY = 0;
                this.lastPixelX = 0;
                this.lastPixelY = 0;
                
                this.id = data.id;
                this.sessionId = data.sessionId || null;
                this.color = data.color;
                this.isPlayer = data.isPlayer;
                this.isLocal = !!data.isLocal;
                this.isSecondaryLocal = !!data.isSecondaryLocal;
                this.slotIndex = data.slotIndex ?? -1;
                this.controlScheme = data.controlScheme || 'WASD';
                
                this.trail = [];
                this.maxTrail = 25;
                this.moveTimer = 0;
                this.moveCooldown = 150;

                this.lastMoveTime = 0;
                this.lastExecuteTime = 0;
                this.lastDx = 0;
                this.lastDy = 0;
                this.dirStreak = 0;  // consecutive cells in the same direction
                this.speedGlow = 0; // 0→1: white hot-streak glow (ramps dirStreak 3→6)
                this.speedBlur = 0;  // 0–1 smoothed, drives motion-blur ghost opacity

                // Speed-boost: 5 consecutive fast cells, ≤2 direction changes, no wall bumps
                this._recentMoveGaps = []; // last 4 inter-move gaps (real ms)
                this._lastMoveTs     = 0;  // real timestamp of last executed move
                this._speedBoostActive = false;
                this._dirChangeCount = 0;  // direction changes since last 3-cell straight run

                this.heldDirections = [];
                this.turnIntent = null;
                this.swipeIntent = null;
                this.dirKeyDownTimes = {}; // dir → performance.now() when key was pressed

                this.state = 'normal'; 
                this.stateTimer = 0;
                this.targetGridX = 0;
                this.targetGridY = 0;
                this.flashTimer = 0;
                this.mirrorUntil = 0;   // Date.now() timestamp until mirror controls expire for this blazer
                this.frozenUntil = 0;   // Date.now() timestamp until freeze expires for this blazer
                this.lastTeleportSeq = undefined; // last server teleportSeq seen (drives teleport animation)
                this.sentMoves = [];    // recent predicted positions sent to server, for reconciliation
                this.beaconUntil = 0; // Date.now() timestamp until path-guide beacon expires
                this._beaconPathCache = [];        // cached path for beacon rendering
                this._beaconPathCacheX = -1;       // gridX when path was last computed
                this._beaconPathCacheY = -1;       // gridY when path was last computed
                
                this.bonkDx = 0;
                this.bonkDy = 0;
                this.bonkTimer = 0;

                this.updatePixelPos(true);
            }

            updatePixelPos(instant = false) {
                const { x: targetX, y: targetY } = gridToPixel(this.gridX, this.gridY);

                this.lastPixelX = this.pixelX;
                this.lastPixelY = this.pixelY;

                if (instant) {
                    this.pixelX = targetX;
                    this.pixelY = targetY;
                    this.lastPixelX = targetX;
                    this.lastPixelY = targetY;
                } else {
                    this.pixelX += (targetX - this.pixelX) * 0.52;
                    this.pixelY += (targetY - this.pixelY) * 0.52;
                }
            }

            canMove(dx, dy) {
                if (this.gridX + dx < 0 || this.gridX + dx >= cols || this.gridY + dy < 0 || this.gridY + dy >= rows) return false;
                const cell = grid[this.gridX][this.gridY];
                if (!cell || !cell.walls) return false;
                if (dy === -1 && !cell.walls[0]) return true;
                if (dx === 1 && !cell.walls[1]) return true;
                if (dy === 1 && !cell.walls[2]) return true;
                if (dx === -1 && !cell.walls[3]) return true;
                return false;
            }

            canMoveAtCell(cx, cy, dx, dy) {
                if (cx + dx < 0 || cx + dx >= cols || cy + dy < 0 || cy + dy >= rows) return false;
                const cell = grid[cx]?.[cy];
                if (!cell || !cell.walls) return false;
                if (dy === -1 && !cell.walls[0]) return true;
                if (dx ===  1 && !cell.walls[1]) return true;
                if (dy ===  1 && !cell.walls[2]) return true;
                if (dx === -1 && !cell.walls[3]) return true;
                return false;
            }

            _executeTurnIntent(dx, dy, intentDir) {
                this.executeMove(dx, dy);
                const idx = this.heldDirections.indexOf(intentDir);
                if (idx > -1) {
                    this.heldDirections.splice(idx, 1);
                    if (!tapOnlyToggle.checked) {
                        this.heldDirections.unshift(intentDir);
                    }
                }
                this.turnIntent = null;
            }

            triggerBonk(dx, dy) {
                this.bonkDx = dx;
                this.bonkDy = dy;
                this.bonkTimer = 1.0;
                // Wall bump kills the speed streak
                this._speedBoostActive = false;
                this._recentMoveGaps = [];
                this._dirChangeCount = 0;
            }

            /**
             * True if this blazer should process local input / prediction on this client.
             * Covers both the primary local player and secondary co-op slots.
             */
            isActuallyLocal() {
                return (room && room.sessionId)
                    ? (this.sessionId === room.sessionId || this.isSecondaryLocal)
                    : this.isLocal;
            }

            executeMove(dx, dy) {
                if (gameState !== 'PLAYING') return;

                if (dx !== this.lastDx || dy !== this.lastDy) {
                    this.lastDx = dx;
                    this.lastDy = dy;
                    this.dirStreak = 0; // reset on direction change
                    // Count direction changes — too many kills the streak
                    this._dirChangeCount++;
                    if (this._dirChangeCount > 2) {
                        this._speedBoostActive = false;
                        this._recentMoveGaps = [];
                        this._dirChangeCount = 0;
                    }
                }
                this.dirStreak++; // 1 on first step in a direction, 3+ = max blur
                // After 3 cells in the same direction, forgive accumulated direction changes
                if (this.dirStreak === 3) this._dirChangeCount = 0;

                this.gridX += dx;
                this.gridY += dy;
                const _moveNow = performance.now();
                this.lastExecuteTime = _moveNow;

                // Speed-boost tracking (direction-independent: purely about move frequency)
                if (this._lastMoveTs > 0) {
                    const gap = _moveNow - this._lastMoveTs;
                    const tolerance = this.moveCooldown * 1.15; // 15% grace for input jitter
                    if (gap > tolerance) {
                        // Too slow — clear streak and deactivate boost
                        this._speedBoostActive = false;
                        this._recentMoveGaps = [];
                    } else {
                        this._recentMoveGaps.push(gap);
                        if (this._recentMoveGaps.length > 4) this._recentMoveGaps.shift();
                        // Activate once we have 4 fast gaps in a row (= 5 cells at max pace)
                        if (this._recentMoveGaps.length === 4 && !this._speedBoostActive) {
                            this._speedBoostActive = true;
                            Synth.speedBoost();
                        }
                    }
                }
                this._lastMoveTs = _moveNow;

                const _eff = this._speedBoostActive ? Math.min(100, this.moveCooldown) : this.moveCooldown;
                this.lastMoveTime = Math.min(this.lastMoveTime + _eff, _moveNow);
                
                // Authoritative local check for sending moves to server
                const isActuallyLocal = (room && room.sessionId) ? (this.sessionId === room.sessionId) : this.isLocal;
                if (room) {
                    if (isActuallyLocal) {
                        room.send("move", { x: this.gridX, y: this.gridY });
                    } else if (this.isSecondaryLocal) {
                        room.send("move_secondary", { slotIndex: this.slotIndex, x: this.gridX, y: this.gridY });
                    }
                    if (isActuallyLocal || this.isSecondaryLocal) {
                        // Record the predicted position so onStateChange can tell normal
                        // prediction-lag (server trailing through our sent cells) apart from a
                        // genuine desync (server at a cell we never sent → snap to recover).
                        this.sentMoves.push({ x: this.gridX, y: this.gridY });
                        if (this.sentMoves.length > 32) this.sentMoves.shift();
                    }
                    const scheme = this.controlScheme || 'WASD';
                    if (!controlSchemesReported.has(scheme)) {
                        controlSchemesReported.add(scheme);
                        room.send("controls_used", { scheme, slotIndex: this.slotIndex });
                    }
                }
            }

            update(dt) {
                const now = performance.now();

                // Detect freeze thaw for local player
                const _nowFrozen = this.frozenUntil > 0 && Date.now() < this.frozenUntil;
                if (this.isPlayer && this.isActuallyLocal() && this._wasFrozen && !_nowFrozen) Synth.freezeThaw();
                this._wasFrozen = _nowFrozen;

                if (this.isPlayer && this.state === 'normal' && this.isActuallyLocal() && now >= roundMoveLockEnd && Date.now() >= this.frozenUntil) {
                    // Pick up any live speed change from the lobby dropdown
                    this.moveCooldown = parseInt(moveSpeedSelect.value, 10) || 150;

                    // Deactivate speed boost if inputs have gone silent for longer than one base interval
                    if (this._speedBoostActive && this._lastMoveTs > 0 && now - this._lastMoveTs > this.moveCooldown * 1.5) {
                        this._speedBoostActive = false;
                        this._recentMoveGaps = [];
                    }

                    const effectiveCooldown = this._speedBoostActive ? Math.min(100, this.moveCooldown) : this.moveCooldown;

                    // If the schedule fell more than 2 periods behind (frozen, locked, tab hidden, etc.),
                    // reset it so at most one move fires immediately — no catch-up burst.
                    if (now - this.lastMoveTime > effectiveCooldown * 2) {
                        this.lastMoveTime = now - effectiveCooldown;
                    }
                    if (now - this.lastMoveTime >= effectiveCooldown) {
                        let moved = false;
                        const mirrored = this.mirrorUntil > 0 && Date.now() < this.mirrorUntil;

                        // Helper: convert a stored direction string to dx/dy, flipping if mirror is active
                        const dirToDxDy = (dir) => {
                            const d = mirrored ? mirrorDir(dir) : dir;
                            if (d === 'up') return { dx: 0, dy: -1 };
                            if (d === 'right') return { dx: 1, dy: 0 };
                            if (d === 'down') return { dx: 0, dy: 1 };
                            if (d === 'left') return { dx: -1, dy: 0 };
                            return { dx: 0, dy: 0 };
                        };

                        // 1. Check Input Intent Buffer (lookahead latch — Pac-Man style)
                        if (this.turnIntent && now - this.turnIntent.time < 300) {
                            const { dx, dy } = dirToDxDy(this.turnIntent.dir);
                            const intentDir = this.turnIntent.dir;

                            if (this.canMove(dx, dy)) {
                                // a. Current cell supports the turn — execute immediately
                                this._executeTurnIntent(dx, dy, intentDir);
                                moved = true;

                            } else if (this.turnIntent.latchX !== undefined) {
                                // b. Waiting for a specific ahead-cell — check arrival
                                if (this.gridX === this.turnIntent.latchX && this.gridY === this.turnIntent.latchY) {
                                    this._executeTurnIntent(dx, dy, intentDir);
                                    moved = true;
                                } else {
                                    // Invalidate if player has already passed the latch cell
                                    const tdx = this.lastDx, tdy = this.lastDy;
                                    const passed = tdx !== 0
                                        ? (tdx > 0 ? this.gridX > this.turnIntent.latchX : this.gridX < this.turnIntent.latchX)
                                        : (tdy > 0 ? this.gridY > this.turnIntent.latchY : this.gridY < this.turnIntent.latchY);
                                    if (passed) this.turnIntent = null;
                                }

                            } else {
                                // c. Not yet latched — scan ahead for the first cell that supports this turn
                                const LOOKAHEAD = 3;
                                const tdx = this.lastDx, tdy = this.lastDy;
                                if (tdx !== 0 || tdy !== 0) {
                                    for (let step = 1; step <= LOOKAHEAD; step++) {
                                        const cx = this.gridX + tdx * step;
                                        const cy = this.gridY + tdy * step;
                                        if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) break;
                                        // Verify path to this cell is unobstructed
                                        let reachable = true;
                                        for (let s = 0; s < step; s++) {
                                            if (!this.canMoveAtCell(this.gridX + tdx * s, this.gridY + tdy * s, tdx, tdy)) {
                                                reachable = false;
                                                break;
                                            }
                                        }
                                        if (!reachable) break;
                                        if (this.canMoveAtCell(cx, cy, dx, dy)) {
                                            this.turnIntent = { ...this.turnIntent, latchX: cx, latchY: cy };
                                            break;
                                        }
                                    }
                                }
                            }
                        }

                        // 2. Check currently held directions
                        if (!moved) {
                            for (let i = this.heldDirections.length - 1; i >= 0; i--) {
                                const rawDir = this.heldDirections[i];
                                const { dx, dy } = dirToDxDy(rawDir);

                                if (this.canMove(dx, dy)) {
                                    this.executeMove(dx, dy);
                                    moved = true;

                                    // In tap-only mode, consume the direction so the key must be re-pressed
                                    this.heldDirections.splice(i, 1);
                                    if (!tapOnlyToggle.checked) {
                                        this.heldDirections.unshift(rawDir);
                                    }
                                    break;
                                }
                            }
                        }

                        // 3. Mobile Swipe Intent
                        if (!moved && this.swipeIntent && now - this.swipeIntent.time < 400) {
                            const sdx = mirrored ? -this.swipeIntent.dx : this.swipeIntent.dx;
                            const sdy = mirrored ? -this.swipeIntent.dy : this.swipeIntent.dy;
                            if (this.canMove(sdx, sdy)) {
                                this.executeMove(sdx, sdy);
                                this.swipeIntent = null;
                                moved = true;
                            }
                        }

                        if (!moved) {
                            let bonkDx = 0, bonkDy = 0;
                            if (this.turnIntent && now - this.turnIntent.time < 300) {
                                const { dx, dy } = dirToDxDy(this.turnIntent.dir);
                                // Don't bonk if latched — turn is pending, not blocked
                                if (this.turnIntent.latchX === undefined) {
                                    bonkDx = dx; bonkDy = dy;
                                }
                            } else if (this.heldDirections.length > 0) {
                                const { dx, dy } = dirToDxDy(this.heldDirections[this.heldDirections.length - 1]);
                                bonkDx = dx; bonkDy = dy;
                            } else if (this.swipeIntent && now - this.swipeIntent.time < 400) {
                                bonkDx = mirrored ? -this.swipeIntent.dx : this.swipeIntent.dx;
                                bonkDy = mirrored ? -this.swipeIntent.dy : this.swipeIntent.dy;
                            }

                            if (bonkDx !== 0 || bonkDy !== 0) {
                                this.triggerBonk(bonkDx, bonkDy);
                            }
                        }
                    }
                }

                if (this.state === 'teleport_out') {
                    this.stateTimer -= dt * 0.003; 
                    if (this.stateTimer <= 0) {
                        this.state = 'teleport_in';
                        this.stateTimer = 1.0;
                        // gridX/gridY already set to destination when teleport fired;
                        // updatePixelPos(true) snaps pixelX/pixelY to the new cell now.
                        this.gridX = this.targetGridX;
                        this.gridY = this.targetGridY;
                        this.updatePixelPos(true);
                        this.trail = [];
                    }
                    return; 
                } else if (this.state === 'teleport_in') {
                    this.stateTimer -= dt * 0.003;
                    if (this.stateTimer <= 0) {
                        this.state = 'normal';
                        // A second teleport may have arrived while we were mid-animation and
                        // updated targetGridX/Y. gridX/Y was already set at the out→in transition
                        // so it points to the first destination. Correct it now so the player
                        // lands at the latest authoritative position instead of the stale one.
                        if (this.gridX !== this.targetGridX || this.gridY !== this.targetGridY) {
                            this.gridX = this.targetGridX;
                            this.gridY = this.targetGridY;
                            this.updatePixelPos(true);
                        }
                        // Float the player's name briefly at the arrival point
                        floatLabels.push({ x: this.pixelX, y: this.pixelY, color: this.color, scheme: this.controlScheme, startTime: performance.now() });
                    }
                    return;
                }

                this.updatePixelPos();

                // Speed-blur: ramps 0→1 as dirStreak goes 1→3
                const blurTarget = Math.min(1, Math.max(0, (this.dirStreak - 1) / 2));
                this.speedBlur += (blurTarget - this.speedBlur) * 0.22;

                // Speed glow follows _speedBoostActive — has correct timing/silence guards,
                // so single taps and held-still never trigger white.
                const glowTarget = this._speedBoostActive ? 1 : 0;
                if (glowTarget > this.speedGlow) this.speedGlow = glowTarget; // instant on
                else this.speedGlow += (glowTarget - this.speedGlow) * 0.15;  // smooth off

                if (this.flashTimer > 0) this.flashTimer -= dt * 0.005;
                if (this.bonkTimer > 0) this.bonkTimer -= dt * 0.01;

                this.trail.push({ x: this.pixelX, y: this.pixelY });
                if (this.trail.length > this.maxTrail) this.trail.shift();

            }

            draw() {
                const size = cellSize * 0.216;
                const angle = (this.lastDx !== 0 || this.lastDy !== 0)
                    ? Math.atan2(this.lastDy, this.lastDx)
                    : -Math.PI / 2;

                // Trail
                ctx.lineWidth = size * 0.8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const isMirrored = this.mirrorUntil > 0 && Date.now() < this.mirrorUntil;
                const isFrozen   = this.frozenUntil > 0 && Date.now() < this.frozenUntil;
                if (this.trail.length > 1) {
                    ctx.save();
                    for (let i = 1; i < this.trail.length; i++) {
                        const frac = i / this.trail.length; // 0=tail, 1=head
                        ctx.lineWidth = Math.max(0.5, size * (0.22 + frac * 0.58));
                        ctx.strokeStyle = isMirrored ? '#ffffff' : this.color;
                        ctx.globalAlpha = frac * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                        ctx.stroke();
                    }
                    // Speed-glow white overlay on trail
                    if (this.speedGlow > 0.01 && !isMirrored) {
                        ctx.shadowColor = '#ffffff';
                        for (let i = 1; i < this.trail.length; i++) {
                            const frac = i / this.trail.length;
                            ctx.lineWidth = Math.max(0.5, size * (0.22 + frac * 0.58));
                            ctx.strokeStyle = '#ffffff';
                            ctx.globalAlpha = frac * 0.5 * this.speedGlow;
                            ctx.shadowBlur = 8 * this.speedGlow * frac;
                            ctx.beginPath();
                            ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
                            ctx.lineTo(this.trail[i].x, this.trail[i].y);
                            ctx.stroke();
                        }
                        ctx.shadowBlur = 0;
                    }
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(this.pixelX, this.pixelY);

                // Teleport effect
                if (this.state === 'teleport_out' || this.state === 'teleport_in') {
                    const scale = this.state === 'teleport_out' ? this.stateTimer : (1 - this.stateTimer);
                    ctx.scale(scale, scale);
                    ctx.rotate(this.stateTimer * 10);
                }

                // Bonk effect
                if (this.bonkTimer > 0) {
                    const offset = Math.sin(this.bonkTimer * 20) * 5 * this.bonkTimer;
                    ctx.translate(this.bonkDx * offset, this.bonkDy * offset);
                }

                // Body — drawn three times with decreasing shadowBlur for maximum bloom
                const bodyColor = (this.flashTimer > 0 || isMirrored) ? '#ffffff' : this.color;

                // Motion-blur ghost copies — appear after 2+ cells in the same direction
                if (this.speedBlur > 0.04 && (this.lastDx !== 0 || this.lastDy !== 0)) {
                    for (let g = 3; g >= 1; g--) {
                        const frac  = g / 3;
                        const alpha = this.speedBlur * (1 - frac * 0.6) * 0.4;
                        const offX  = -this.lastDx * cellSize * 0.30 * g;
                        const offY  = -this.lastDy * cellSize * 0.30 * g;
                        const ghostScale = 1 - g * 0.10;
                        ctx.save();
                        ctx.translate(offX, offY);
                        ctx.rotate(angle + Math.PI / 2);
                        ctx.scale(ghostScale, ghostScale);
                        ctx.globalAlpha = alpha;
