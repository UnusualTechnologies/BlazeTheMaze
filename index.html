                    if (j === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                    else         ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.fillStyle = '#050510';
                ctx.fill();
                ctx.lineWidth  = Math.max(0.5, cellSize * 0.04);
                ctx.strokeStyle = `hsl(${mHue}, 100%, 70%)`;
                ctx.shadowBlur  = 6;
                ctx.shadowColor = `hsl(${mHue}, 100%, 70%)`;
                ctx.stroke();
                ctx.restore();
            }

            // 5 rainbow rays
            ctx.rotate(time * 2.0);
            for (let i = 0; i < 5; i++) {
                ctx.rotate(Math.PI * 2 / 5);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(cellSize * 0.16, cellSize * 0.72);
                ctx.lineTo(-cellSize * 0.16, cellSize * 0.72);
                const rayHue = (i * 72 + time * 100) % 360;
                const alpha = 0.15 + Math.sin(time * 2) * 0.1;
                ctx.fillStyle = `hsla(${rayHue}, 100%, 50%, ${alpha})`;
                ctx.fill();
            }

            // Counter-rotating star body
            ctx.rotate(-time * 1.5);
            const pulse = (Math.sin(time * 3) + 1) / 2;
            const outerR = cellSize * 0.54 + pulse * cellSize * 0.04;
            const innerR = cellSize * 0.22;
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const angle = i * Math.PI / 5 - Math.PI / 2;
                const r = i % 2 === 0 ? outerR : innerR;
                const px = Math.cos(angle) * r;
                const py = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = '#050510';
            ctx.fill();
            const starHue = (time * 150) % 360;
            ctx.lineWidth = 2;
            ctx.strokeStyle = `hsl(${starHue}, 100%, 60%)`;
            ctx.shadowBlur = 18 + pulse * 10;
            ctx.shadowColor = `hsl(${starHue}, 100%, 60%)`;
            ctx.stroke();

            // Central bright spark
            ctx.beginPath();
            ctx.arc(0, 0, cellSize * 0.08, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 20;
            const sparkHue = (time * 300) % 360;
            ctx.shadowColor = `hsl(${sparkHue}, 100%, 50%)`;
            ctx.fill();

            ctx.restore();
        }

        function drawSmokePuffs() {
            const SMOKE_MS = 500;
            const now = performance.now();
            smokePuffs = smokePuffs.filter(puff => {
                const progress = Math.min((now - puff.startTime) / SMOKE_MS, 1);
                if (progress >= 1) return false;

                const { x: fromPx, y: fromPy } = gridToPixel(puff.fromX, puff.fromY);
                const { x: toPx,   y: toPy   } = gridToPixel(puff.toX,   puff.toY);

                // Drift slowly toward destination — fades well before arriving
                const cx = fromPx + (toPx - fromPx) * progress * 0.28;
                const cy = fromPy + (toPy - fromPy) * progress * 0.28;

                // Cloud expands as it disperses
                const puffR  = cellSize * (0.22 + progress * 0.38);
                const alpha  = (1 - progress) * 0.38;

                cloudOffsets.forEach(o => {
                    ctx.beginPath();
                    ctx.arc(cx + o.dx * puffR * 1.3, cy + o.dy * puffR * 1.3, puffR * o.rs, 0, Math.PI * 2);
                    ctx.fillStyle = puff.color;
                    ctx.globalAlpha = alpha;
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = puff.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                ctx.globalAlpha = 1;
                return true;
            });
        }

        /** Trace the shortest path from (startX, startY) to the goal using the client-side distance map. */
        function getPathToGoal(startX, startY) {
            if (!grid[startX]?.[startY] || distanceMap[startX]?.[startY] === undefined) return [];
            const DIRS = [
                { dx:  0, dy: -1, wall: 0 },
                { dx:  1, dy:  0, wall: 1 },
                { dx:  0, dy:  1, wall: 2 },
                { dx: -1, dy:  0, wall: 3 },
            ];
            const path = [];
            let x = startX, y = startY;
            for (let step = 0; step < cols * rows; step++) {
                if (x === goal.x && y === goal.y) break;
                path.push({ x, y });
                const cell = grid[x][y];
                let bestX = -1, bestY = -1, bestDist = distanceMap[x][y] ?? Infinity;
                for (const d of DIRS) {
                    const nx = x + d.dx, ny = y + d.dy;
                    if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && !cell.walls[d.wall]) {
                        const nd = distanceMap[nx]?.[ny] ?? Infinity;
                        if (nd < bestDist) { bestX = nx; bestY = ny; bestDist = nd; }
                    }
                }
                if (bestX === -1) break; // at goal or stuck
                x = bestX; y = bestY;
            }
            return path;
        }

        /** Draw glowing path-cells for any blazer whose beacon power-up is active. */
        function drawBeaconPaths() {
            const now = Date.now();
            blazers.forEach(b => {
                if (!b.beaconUntil || now >= b.beaconUntil) return;
                if (!grid.length || !distanceMap.length) return;
                const timeLeft = (b.beaconUntil - now) / 1000;
                const fadeAlpha = Math.min(1, timeLeft / 1.5); // fade out over last 1.5 s
                const pulse = 0.28 + 0.07 * Math.sin(now / 150);
                const path = getPathToGoal(b.gridX, b.gridY).slice(0, cols);
                const pathLen = path.length;
                if (pathLen === 0) return;

                path.forEach(({ x, y }, idx) => {
                    const { x: px, y: py } = gridToPixel(x, y);
                    // Brighter near the player, dimmer towards the goal
                    const intensityFrac = 1 - idx / Math.max(1, pathLen);
                    const alpha = (pulse + intensityFrac * 0.12) * fadeAlpha;

                    // Glowing cell fill — halved brightness
                    ctx.save();
                    ctx.globalAlpha = Math.min(0.275, alpha * 0.5);
                    ctx.fillStyle = b.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = b.color;
                    ctx.fillRect(px - cellSize / 2 + 1, py - cellSize / 2 + 1, cellSize - 2, cellSize - 2);
                    ctx.shadowBlur = 0;
                    ctx.restore();

                    // Directional arrow (white, pointing toward goal)
                    if (idx < pathLen - 1) {
                        const next = path[idx + 1];
                        const angle = Math.atan2(next.y - y, next.x - x);
                        const al = cellSize * 0.18;
                        ctx.save();
                        ctx.translate(px, py);
                        ctx.rotate(angle);
                        ctx.globalAlpha = Math.min(0.375, (pulse + 0.1) * fadeAlpha * 0.5);
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowBlur = 4;
                        ctx.shadowColor = b.color;
                        ctx.beginPath();
                        ctx.moveTo( al,       0);
                        ctx.lineTo(-al * 0.5, -al * 0.5);
                        ctx.lineTo(-al * 0.5,  al * 0.5);
                        ctx.closePath();
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }
                });
            });
        }

        function drawPowerUps() {
            const time = performance.now() / 600;
            powerUps.forEach(p => {
                const { x: px, y: py } = gridToPixel(p.x, p.y);
                ctx.save();
                ctx.translate(px, py);
                if (p.type === 'opponents') {
                    const n = playerColors.length;
                    const r = cellSize * 0.21;
                    const sliceAngle = (Math.PI * 2) / n;
                    const gapAngle = sliceAngle * 0.12; // proportional gap — stays visible at all cell sizes
                    const arcAngle = sliceAngle - gapAngle;
                    ctx.rotate(time);
                    playerColors.forEach((col, i) => {
                        const startA = i * sliceAngle + gapAngle / 2;
                        for (let pass = 0; pass < 3; pass++) {
                            ctx.beginPath();
                            ctx.arc(0, 0, r, startA, startA + arcAngle);
                            ctx.lineWidth = 2;
                            ctx.strokeStyle = col;
                            ctx.shadowBlur = [60, 30, 12][pass];
                            ctx.shadowColor = col;
                            ctx.stroke();
                        }
                        ctx.shadowBlur = 0;
                    });
                } else if (p.type === 'self') {
                    ctx.rotate(-time);
                    ctx.beginPath();
                    ctx.arc(0, 0, cellSize * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = colors.bg;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = colors.powerupSelf;
                    ctx.setLineDash([5, 5]);
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = colors.powerupSelf;
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else if (p.type === 'rocket') {
                    const pulse = 1 + Math.sin(time * 3) * 0.1;
                    ctx.scale(pulse, pulse);
                    // Two-colour chase: next colour fills rocket from bottom to top
                    const slotMs = 700; // ms each colour holds before being chased out
                    const ms = time * 600;
                    const slot = Math.floor(ms / slotMs);
                    const progress = (ms % slotMs) / slotMs; // 0→1 within this slot
                    const curColor  = playerColors[slot % playerColors.length] || '#ff3300';
                    const nextColor = playerColors[(slot + 1) % playerColors.length] || '#ff3300';
                    const rTip = -cellSize * 0.25;
                    const rBot =  cellSize * 0.15;
                    const fillY = rBot - progress * (rBot - rTip); // chase line moves upward
                    const rocketPath = () => {
                        ctx.beginPath();
                        ctx.moveTo(0, rTip);
                        ctx.lineTo( cellSize * 0.15, rBot);
                        ctx.lineTo(0, cellSize * 0.05);
                        ctx.lineTo(-cellSize * 0.15, rBot);
                        ctx.closePath();
                    };
                    // Base: full rocket in current colour
                    rocketPath();
                    ctx.fillStyle = curColor;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = curColor;
                    ctx.fill();
                    // Chase strip: next colour clipped to the filled bottom portion
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(-cellSize * 0.2, fillY, cellSize * 0.4, rBot - fillY + 1);
                    ctx.clip();
                    rocketPath();
                    ctx.fillStyle = nextColor;
                    ctx.shadowBlur = 0;
                    ctx.fill();
                    ctx.restore();
                } else if (p.type === 'mirror') {
                    // Snap instantly between normal and flipped every ~1.2s
                    const flipped = Math.floor(time * 0.5) % 2 === 1;
                    const flipAngle = flipped ? Math.PI : 0;
                    const spH = cellSize * 0.21;
                    const spV = cellSize * 0.09; // scraping-close to bottom row
                    const ar  = cellSize * 0.155;
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = Math.max(1, cellSize * 0.055);
                    ctx.lineJoin = 'round';
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 10;
                    // WASD cross: [up] barely above [left][down][right]
                    const arrows = [
                        { ax:   0,  ay: -spV, base: -Math.PI / 2 }, // up
                        { ax: -spH, ay:  spV, base:  Math.PI     }, // left
                        { ax:   0,  ay:  spV, base:  Math.PI / 2 }, // down
                        { ax:  spH, ay:  spV, base:  0           }, // right
                    ];
                    arrows.forEach(({ ax, ay, base }) => {
                        ctx.save();
                        ctx.translate(ax, ay);
                        ctx.rotate(base + flipAngle);
                        ctx.beginPath();
                        ctx.moveTo( ar,        0);
                        ctx.lineTo(-ar * 0.5, -ar * 0.72);
                        ctx.lineTo(-ar * 0.5,  ar * 0.72);
                        ctx.closePath();
                        ctx.fill();
                        if (flipped) {
                            ctx.shadowBlur = 0; // no glow bleed on the outline
                            ctx.stroke();
                        }
                        ctx.restore();
                    });
                } else if (p.type === 'mystery') {
                    // Cycles through each power-up type's colour at 200 ms/type
                    const MYSTERY_COLORS = ['#ffff00', '#00ffff', '#ff6600', '#ff00ff', '#00aaff', '#ffcc00']; // opp/self/rocket/mirror/freeze/beacon
                    const cycleIdx = Math.floor(performance.now() / 200) % MYSTERY_COLORS.length;
                    const mColor   = MYSTERY_COLORS[cycleIdx];
                    const r        = cellSize * 0.28;

                    // Spinning diamond outline
                    ctx.save();
                    ctx.rotate(Math.PI / 4 + time * 1.5);
                    ctx.beginPath();
                    ctx.rect(-r, -r, r * 2, r * 2);
                    ctx.strokeStyle = mColor;
                    ctx.lineWidth   = 2;
                    ctx.shadowBlur  = 18;
                    ctx.shadowColor = mColor;
                    ctx.stroke();
                    ctx.restore();

                    // "?" label in the current colour
                    ctx.shadowBlur   = 10;
                    ctx.shadowColor  = mColor;
                    ctx.fillStyle    = mColor;
                    ctx.font         = `bold ${Math.round(cellSize * 0.30)}px monospace`;
                    ctx.textAlign    = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('?', 0, 0);
                } else if (p.type === 'freeze') {
                    // Icy snowball — dark navy sphere with 6-point snowflake, cold blue glow
                    const pulse   = (Math.sin(performance.now() / 350) + 1) / 2;
                    const sphereR = cellSize * 0.25;

                    // Sphere body (dark navy)
                    ctx.beginPath();
                    ctx.arc(0, 0, sphereR, 0, Math.PI * 2);
                    ctx.fillStyle   = '#001a33';
                    ctx.shadowBlur  = 18 + pulse * 12;
                    ctx.shadowColor = '#00aaff';
                    ctx.fill();

                    // Icy highlight ring
                    ctx.beginPath();
                    ctx.arc(0, 0, sphereR, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(136,220,255,${0.5 + pulse * 0.4})`;
                    ctx.lineWidth   = Math.max(1, cellSize * 0.04);
                    ctx.shadowBlur  = 6;
                    ctx.shadowColor = '#ffffff';
                    ctx.stroke();

                    // 6-point snowflake (slowly rotating)
                    const spokeLen  = sphereR * 0.75;
                    const barLen    = spokeLen * 0.35;
                    ctx.lineWidth   = Math.max(1, cellSize * 0.045);
                    ctx.lineCap     = 'round';
                    ctx.shadowBlur  = 6;
                    ctx.shadowColor = '#ffffff';
                    for (let i = 0; i < 6; i++) {
                        const a   = i * Math.PI / 3 + time * 0.25;
                        const tx  = Math.cos(a) * spokeLen, ty  = Math.sin(a) * spokeLen;
                        const bx  = Math.cos(a) * spokeLen * 0.55, by = Math.sin(a) * spokeLen * 0.55;
                        const pa  = a + Math.PI / 2;
                        ctx.strokeStyle = i % 2 === 0 ? '#ffffff' : '#88ddff';
                        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(tx, ty); ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(bx - Math.cos(pa) * barLen, by - Math.sin(pa) * barLen);
                        ctx.lineTo(bx + Math.cos(pa) * barLen, by + Math.sin(pa) * barLen);
                        ctx.stroke();
                    }
                    ctx.lineCap    = 'butt';
                    ctx.shadowBlur = 0;
                } else if (p.type === 'beacon') {
                    // Cycling path cell — looks like an activated beacon cell, loops through all 8 blazer colours
                    const cycleColor = playerColors[Math.floor(performance.now() / 350) % playerColors.length];
                    const pulse = 0.28 + 0.07 * Math.sin(time * 2.5);
                    // Clip to cell so glow doesn't bleed past the walls
                    ctx.beginPath();
                    ctx.rect(-cellSize / 2, -cellSize / 2, cellSize, cellSize);
                    ctx.clip();
                    ctx.globalAlpha = Math.min(0.55, pulse);
                    ctx.fillStyle = cycleColor;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = cycleColor;
                    ctx.fillRect(-cellSize / 2 + 1, -cellSize / 2 + 1, cellSize - 2, cellSize - 2);
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
                ctx.restore();
            });

            // Burst animations for collected opponents power-ups
            const BURST_MS = 600;
            const burstNow = performance.now();
            powerUpBursts = powerUpBursts.filter(burst => {
                const progress = Math.min((burstNow - burst.startTime) / BURST_MS, 1);
                if (progress >= 1) return false;

                const { x: px, y: py } = gridToPixel(burst.gridX, burst.gridY);
                const radius = cellSize * 0.32;

                ctx.save();
                ctx.translate(px, py);

                // Collector colour: fills instantly, fades out
                const fillAlpha = progress < 0.1 ? 1 : Math.max(0, 1 - (progress - 0.1) / 0.9);
                ctx.globalAlpha = fillAlpha;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fillStyle = burst.hitColor;
                ctx.shadowBlur = 15;
                ctx.shadowColor = burst.hitColor;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Other wedges fly toward the player they represent, fading as they reach ~8 cells out
                const maxDist = cellSize * 2.8;
                burst.otherPlayers.forEach(p => {
                    const dist = progress * maxDist;
                    const pieceAlpha = Math.max(0, 1 - progress);
                    ctx.globalAlpha = pieceAlpha;
                    ctx.save();
                    ctx.translate(Math.cos(p.angle) * dist, Math.sin(p.angle) * dist);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    const spread = Math.PI / 6;
                    ctx.arc(0, 0, radius, p.angle - spread, p.angle + spread);
                    ctx.closePath();
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.restore();
                });

                ctx.globalAlpha = 1;
                ctx.restore();
                return true;
            });
        }

        function draw(force = false) {
            if (gameState === 'MENU' && !force) return;
            pollGamepads();

            const now = performance.now();
            const dt = now - lastTime;
            lastTime = now;

            ctx.save();
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake, sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
                screenShake -= dt * 0.05; 
                if (screenShake < 0) screenShake = 0;
            }

            drawMaze();
            drawBeaconPaths(); // lit path cells drawn beneath power-ups and blazers
            drawPowerUps();

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                if (sw.update(dt)) sw.draw(); else shockwaves.splice(i, 1);
            }

            blazers.sort((a, b) => (a.isPlayer === b.isPlayer) ? 0 : a.isPlayer ? 1 : -1);
            blazers.forEach(blazer => { blazer.update(dt); blazer.draw(); });

            // 3 countdown pulses: big → mid → small, each expanding outward from the blazer
            // Pulse 3 finishes exactly when movement unlocks; blazer briefly flashes white at that moment
            if (roundRingTime !== null) {
                const ringElapsed = now - roundRingTime;
                const ringDuration = ROUND_START_MS;
                if (ringElapsed < ringDuration) {
                    const PULSE_COUNT = 3;
                    const pulseDur = ringDuration / PULSE_COUNT;
                    const pulseIdx = Math.min(PULSE_COUNT - 1, Math.floor(ringElapsed / pulseDur)); // 0,1,2
                    const pulseT = (ringElapsed - pulseIdx * pulseDur) / pulseDur; // 0→1 within pulse
                    // Flash white and unlock at the very start of pulse 3
                    if (pulseIdx === 2 && !roundUnlockFlashFired) {
                        blazers.forEach(b => { if (b.isLocal) b.flashTimer = 1.0; });
                        roundUnlockFlashFired = true;
                    }
                    // Each pulse reaches a smaller max: big=1.0, mid≈0.67, small≈0.33 of max radius
                    const endFrac = 1 - pulseIdx / PULSE_COUNT;
                    // Ease-out expand — fast burst then settles at the edge
                    const expand = 1 - Math.pow(1 - pulseT, 2);
                    // Base fade: dims as the ring reaches full size
                    const baseAlpha = 0.9 * (1 - pulseT);
                    ctx.save();
                    blazers.forEach(b => {
                        if (!b.isLocal) return;
                        const { x: goalPx, y: goalPy } = gridToPixel(goal.x, goal.y);
                        const dx = goalPx - b.pixelX, dy = goalPy - b.pixelY;
                        const maxRadius = Math.sqrt(dx * dx + dy * dy);
                        const radius = maxRadius * endFrac * expand;
                        if (radius < 2) return;
                        // Pulse 3: also fade out once the ring reaches 2 cells from the blazer
                        const radiusFade = pulseIdx === 2
                            ? Math.max(0, 1 - radius / (2 * cellSize))
                            : 1;
                        const alpha = baseAlpha * radiusFade;
                        if (alpha <= 0) return;
                        ctx.beginPath();
                        ctx.arc(b.pixelX, b.pixelY, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = b.color;
                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = Math.max(1.5, cellSize * 0.07);
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = b.color;
                        ctx.stroke();
                    });
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.restore();
                } else {
                    roundRingTime = null;
                }
            }

            // Player identification labels — every round, fades over ROUND_START_MS
            if (roundRingTime !== null) {
                const labelElapsed = now - roundRingTime;
                if (labelElapsed < ROUND_START_MS) {
                    const alpha = 1 - labelElapsed / ROUND_START_MS;
                    const fontSize = Math.round(cellSize * 0.55);
                    ctx.save();
                    ctx.font = `bold ${fontSize}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    blazers.forEach(b => {
                        if (!b.isLocal) return;
                        const rawLabel = schemeNames[b.controlScheme] ||
                            (b.controlScheme || '?').replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
                        // Split by spaces; "/" merges onto the preceding word's line
                        const tokens = rawLabel.split(' ');
                        const lines = [];
                        for (const tok of tokens) {
                            if (tok === '/' && lines.length > 0) lines[lines.length - 1] += ' /';
                            else lines.push(tok);
                        }
                        const lineH = fontSize * 1.3;
                        const lx = b.pixelX;
                        const goBelow = (b.pixelY - cellSize * 0.72) < fontSize;
                        const blockCenter = goBelow ? b.pixelY + cellSize * 0.72 : b.pixelY - cellSize * 0.72;
                        const ly0 = blockCenter - (lines.length - 1) * lineH / 2;
                        lines.forEach((line, i) => {
                            const ly = ly0 + i * lineH;
                            const tw = ctx.measureText(line).width;
                            const clampedLx = Math.max(tw / 2, Math.min(width - tw / 2, lx));
                            ctx.globalAlpha = alpha * 0.85;
                            ctx.lineWidth = fontSize * 0.25;
                            ctx.strokeStyle = '#000';
                            ctx.shadowBlur = 0;
                            ctx.strokeText(line, clampedLx, ly);
                            ctx.globalAlpha = alpha;
                            ctx.fillStyle = b.color;
                            ctx.shadowBlur = 14;
                            ctx.shadowColor = b.color;
                            ctx.fillText(line, clampedLx, ly);
                        });
                    });
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            }

            drawSmokePuffs();

            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                if (r.update(dt)) r.draw(); else rockets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.update(dt)) p.draw(); else particles.splice(i, 1);
            }

            // In-game round over celebration overlay
            if (gameState === 'ROUND_OVER_COUNTDOWN') {
                roundCountdown -= dt;
                const secondsLeft = Math.ceil(roundCountdown / 1000);

                ctx.save();

                const titleSize = Math.max(20, width * 0.06);
                const subSize = Math.max(14, width * 0.04);

                // Slight dark bar for readability
                ctx.fillStyle = "rgba(5, 5, 16, 0.7)";
                ctx.fillRect(0, height / 2 - titleSize * 1.5, width, titleSize * 3.8);

                ctx.font = `bold ${titleSize}px monospace`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 20;
                ctx.shadowColor = currentWinner.color;
                ctx.fillStyle = currentWinner.color;
                ctx.fillText(`${currentWinner.id} Wins Round!`, width / 2, height / 2 - titleSize * 0.2);

                ctx.fillStyle = "#fff";
                ctx.font = `bold ${subSize}px monospace`;
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 5;
                if (secondsLeft > 0) {
                    ctx.fillText(`${secondsLeft} second${secondsLeft !== 1 ? 's' : ''} to next round...`, width / 2, height / 2 + subSize * 1.5);
                } else {
                    ctx.fillText(`Next round starting...`, width / 2, height / 2 + subSize * 1.5);
                }

                if (!room && secondsLeft > 0) {
                    ctx.fillStyle = "#aaa";
                    ctx.font = `normal ${subSize * 0.8}px monospace`;
                    ctx.shadowBlur = 2;
                    ctx.fillText(`(Press Space to skip)`, width / 2, height / 2 + subSize * 2.8);
                }

                ctx.restore();

                if (roundCountdown <= 0) {
                    if (roundFlashStart === null) roundFlashStart = performance.now();
                    if (!room) initRound(); // networked play uses round_reset message instead
                }
            }

            ctx.restore();

            // Round-transition white flash — full white for 1s then instant cut
            if (roundFlashStart !== null) {
                const elapsed = performance.now() - roundFlashStart;
                if (elapsed >= 1000) {
                    roundFlashStart = null;
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                }
            }

            if (gameState !== 'MENU') {
                if (animationId) cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(() => draw(false));
            }
        }

        // --- INPUT HANDLING ---
        const schemeNames = { WASD: 'WASD', TFGH: 'TFGH', IJKL: 'IJKL', Arrows: 'Arrow Keys', Numpad: 'Numpad (8456)', TouchMouse: 'Touch / Mouse' };

        const controlsMap = {
            'WASD': { up: ['w', 'W'], right: ['d', 'D'], down: ['s', 'S'], left: ['a', 'A'] },
            'TFGH': { up: ['t', 'T'], right: ['h', 'H'], down: ['g', 'G'], left: ['f', 'F'] },
            'IJKL': { up: ['i', 'I'], right: ['l', 'L'], down: ['k', 'K'], left: ['j', 'J'] },
            'Arrows': { up: ['ArrowUp'], right: ['ArrowRight'], down: ['ArrowDown'], left: ['ArrowLeft'] },
            'Numpad': { up: ['8', 'Numpad8'], right: ['6', 'Numpad6'], down: ['5', 'Numpad5'], left: ['4', 'Numpad4'] },
            'TouchMouse': { up: [], right: [], down: [], left: [] }
        };

        // When there is only one local player, merge all keyboard schemes so any keys work.
        function effectiveControlMap(blazer) {
            const localCount = blazers.filter(b => b.isPlayer && b.isActuallyLocal()).length;
            if (localCount === 1) {
                return {
                    up:    Object.values(controlsMap).flatMap(m => m.up),
                    right: Object.values(controlsMap).flatMap(m => m.right),
                    down:  Object.values(controlsMap).flatMap(m => m.down),
                    left:  Object.values(controlsMap).flatMap(m => m.left),
                };
            }
            return controlsMap[blazer.controlScheme];
        }

        // --- GAMEPAD SUPPORT ---
        const gamepadPrevState = {};
        const gamepadABtnPrev = {};

        function getGamepadDirs(gp) {
            const DEADZONE = 0.3;
            return {
                up:    !!(gp.buttons[12]?.pressed) || gp.axes[1] < -DEADZONE,
                right: !!(gp.buttons[15]?.pressed) || gp.axes[0] >  DEADZONE,
                down:  !!(gp.buttons[13]?.pressed) || gp.axes[1] >  DEADZONE,
                left:  !!(gp.buttons[14]?.pressed) || gp.axes[0] < -DEADZONE,
            };
        }

        function pollGamepads() {
            const gamepads = navigator.getGamepads();
            for (let gpIdx = 0; gpIdx <= 7; gpIdx++) {
                const gp = gamepads[gpIdx];
                const scheme = `controller_${gpIdx + 1}`;
                const prev = gamepadPrevState[gpIdx] ?? { up: false, right: false, down: false, left: false };

                const blazer = blazers.find(b => b.isPlayer && b.controlScheme === scheme && b.isActuallyLocal());

                if (!gp || !blazer) {
                    if (!gp && blazer) { blazer.heldDirections = []; blazer.turnIntent = null; }
                    gamepadPrevState[gpIdx] = { up: false, right: false, down: false, left: false };
                    gamepadABtnPrev[gpIdx] = false;
                    continue;
                }

                // A/Cross (button 0): skips local countdown, or triggers Play Again on win screen
                const aPressed = !!(gp.buttons[0]?.pressed);
                if (aPressed && !gamepadABtnPrev[gpIdx]) {
                    if (!room && gameState === 'ROUND_OVER_COUNTDOWN') roundCountdown = 0;
                    else if (gameState === 'MATCH_OVER') menuBtn.click();
                }
                gamepadABtnPrev[gpIdx] = aPressed;

                const curr = getGamepadDirs(gp);
                ['up', 'right', 'down', 'left'].forEach(dir => {
                    if (curr[dir] && !prev[dir]) {
                        if (!blazer.heldDirections.includes(dir)) {
                            blazer.heldDirections.push(dir);
                            if (gameState === 'PLAYING') blazer.turnIntent = { dir, time: performance.now() };
                        }
                    } else if (!curr[dir] && prev[dir]) {
                        const idx = blazer.heldDirections.indexOf(dir);
                        if (idx > -1) blazer.heldDirections.splice(idx, 1);
                        if (blazer.turnIntent?.dir === dir) blazer.turnIntent = null;
                    }
                });
                gamepadPrevState[gpIdx] = curr;
            }
        }

        // Track connected gamepad indices ourselves — getGamepads() may still return the
        // old entry during the gamepaddisconnected callback, so don't rely on it there.
        const connectedGamepadIndices = new Set();

        function updateControllerOptions() {
            lobbySlots.forEach(slot => {
                for (let gpIdx = 0; gpIdx <= 7; gpIdx++) {
                    const existing = slot.controlSelect.querySelector(`.gp-opt-${gpIdx}`);
                    if (connectedGamepadIndices.has(gpIdx) && !existing) {
                        const opt = document.createElement('option');
                        opt.value = `controller_${gpIdx + 1}`;
                        opt.className = `gp-opt-${gpIdx}`;
                        opt.textContent = `Controller ${gpIdx + 1}`;
                        slot.controlSelect.appendChild(opt);
                    } else if (!connectedGamepadIndices.has(gpIdx) && existing) {
                        existing.remove();
                    }
                }
            });
        }

        // gamepadconnected/disconnected keep the Set accurate for disconnect detection,
        // but Chrome won't fire gamepadconnected until a button is pressed. The menu
        // loop polls getGamepads() every frame as the primary detection mechanism.
        window.addEventListener('gamepaddisconnected', (e) => {
            connectedGamepadIndices.delete(e.gamepad.index);
            updateControllerOptions();
        });

        // Persistent loop: detects controllers by polling (works before any button press
        // in Firefox; works after first button press in Chrome), and handles A-button
        // Quick Start while in the menu.
        const menuGamepadABtnPrev = {};
        (function menuGamepadLoop() {
            requestAnimationFrame(menuGamepadLoop);
            const gamepads = navigator.getGamepads();

            // Sync connectedGamepadIndices from live poll data
            let changed = false;
            for (let gpIdx = 0; gpIdx <= 7; gpIdx++) {
                const live = !!gamepads[gpIdx];
                if (live && !connectedGamepadIndices.has(gpIdx)) {
                    connectedGamepadIndices.add(gpIdx); changed = true;
                } else if (!live && connectedGamepadIndices.has(gpIdx)) {
                    connectedGamepadIndices.delete(gpIdx); changed = true;
                }
            }
            if (changed) updateControllerOptions();

            if (gameState !== 'MENU') return;
            for (let gpIdx = 0; gpIdx <= 7; gpIdx++) {
                const gp = gamepads[gpIdx];
                const aPressed = !!(gp?.buttons[0]?.pressed);
                if (aPressed && !menuGamepadABtnPrev[gpIdx]) quickStartBtn.click();
                menuGamepadABtnPrev[gpIdx] = aPressed;
            }
        })();

        window.addEventListener('keydown', (e) => {
            // Prevent spacebar or arrow keys from scrolling the page or pressing focused UI buttons!
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code) || e.key === ' ') {
                e.preventDefault();
            }

            // Allow skipping the round countdown instantly with Spacebar (local only — networked uses round_reset)
            if (!room && gameState === 'ROUND_OVER_COUNTDOWN' && (e.code === 'Space' || e.key === ' ')) {
                roundCountdown = 0;
                return;
            }

            if (gameState !== 'PLAYING') return;
            blazers.forEach(blazer => {
                if (!blazer.isPlayer) return;
                
                if (!blazer.isActuallyLocal()) return;

                const map = effectiveControlMap(blazer);
                if (!map) return;

                let dir = null;
                if (map.up.includes(e.key)) dir = 'up';
                else if (map.right.includes(e.key)) dir = 'right';
                else if (map.down.includes(e.key)) dir = 'down';
                else if (map.left.includes(e.key)) dir = 'left';

                if (dir) {
                    if (!blazer.heldDirections.includes(dir)) {
                        blazer.heldDirections.push(dir);
                        // Buffer the intent so early presses turn seamlessly, ONLY on initial keydown to avoid OS repeat bugs
                        blazer.turnIntent = { dir: dir, time: performance.now() };
                    }
                }
            });
        });

        window.addEventListener('keyup', (e) => {
            // No gameState gate — releases must always clean up heldDirections.
            // Gating here would leave ghost held directions if the key is released
            // during ROUND_OVER_COUNTDOWN, causing the blazer to auto-move next round.
            blazers.forEach(blazer => {
                if (!blazer.isPlayer) return;

                if (!blazer.isActuallyLocal()) return;

                const map = effectiveControlMap(blazer);
                if (!map) return;

                let dir = null;
                if (map.up.includes(e.key)) dir = 'up';
                else if (map.right.includes(e.key)) dir = 'right';
                else if (map.down.includes(e.key)) dir = 'down';
                else if (map.left.includes(e.key)) dir = 'left';

                if (dir) {
                    const index = blazer.heldDirections.indexOf(dir);
                    if (index > -1) blazer.heldDirections.splice(index, 1);
                    if (blazer.turnIntent && blazer.turnIntent.dir === dir) {
                        blazer.turnIntent = null;
                    }
                }
            });
        });

        // Touch / Mouse handling
        let touchStartX = 0, touchStartY = 0;
        let mouseStartX = 0, mouseStartY = 0;

        function getSwipeTarget() {
            return blazers.find(b => b.controlScheme === 'TouchMouse' && b.isLocal);
        }

        function applySwipe(dx, dy, threshold) {
            if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;
            const target = getSwipeTarget();
            if (!target) return;
            let intentDx = 0, intentDy = 0;
            if (Math.abs(dx) > Math.abs(dy)) intentDx = dx > 0 ? 1 : -1;
            else intentDy = dy > 0 ? 1 : -1;
            target.swipeIntent = { dx: intentDx, dy: intentDy, time: performance.now() };
        }

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].clientX;
            touchStartY = e.changedTouches[0].clientY;
        }, {passive: true});

        canvas.addEventListener('touchend', (e) => {
            if (!room && gameState === 'ROUND_OVER_COUNTDOWN') { roundCountdown = 0; return; }
            if (gameState !== 'PLAYING') return;
            applySwipe(
                e.changedTouches[0].clientX - touchStartX,
                e.changedTouches[0].clientY - touchStartY,
                30
            );
        }, {passive: true});

        canvas.addEventListener('mousedown', (e) => {
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (gameState !== 'PLAYING') return;
            applySwipe(e.clientX - mouseStartX, e.clientY - mouseStartY, 15);
        });

        // D-pad
        const dpadEl = document.getElementById('dpad');

        function dpadPress(dir) {
            const blazer = blazers.find(b => b.controlScheme === 'TouchMouse' && b.isLocal);
            if (!blazer) return;
            if (!blazer.heldDirections.includes(dir)) {
                blazer.heldDirections.push(dir);
                blazer.turnIntent = { dir, time: performance.now() };
            }
        }

        function dpadRelease(dir) {
            const blazer = blazers.find(b => b.controlScheme === 'TouchMouse' && b.isLocal);
            if (!blazer) return;
            const idx = blazer.heldDirections.indexOf(dir);
            if (idx > -1) blazer.heldDirections.splice(idx, 1);
            if (blazer.turnIntent?.dir === dir) blazer.turnIntent = null;
        }

        dpadEl.addEventListener('pointerdown', (e) => {
            const btn = e.target.closest('.dpad-btn');
            if (!btn) return;
            e.preventDefault();
            btn.setPointerCapture(e.pointerId);
            btn.classList.add('pressed');
            if (gameState === 'PLAYING') dpadPress(btn.dataset.dir);
        });

        dpadEl.addEventListener('pointerup', (e) => {
            const btn = e.target.closest('.dpad-btn');
            if (!btn) return;
            btn.classList.remove('pressed');
            dpadRelease(btn.dataset.dir);
        });

        dpadEl.addEventListener('pointercancel', (e) => {
            const btn = e.target.closest('.dpad-btn');
            if (!btn) return;
            btn.classList.remove('pressed');
            dpadRelease(btn.dataset.dir);
        });

        function updateDpad() {
            const show = blazers.some(b => b.controlScheme === 'TouchMouse' && b.isLocal);
            dpadEl.classList.toggle('hidden', !show);
        }


        // --- MENU BUTTON BINDINGS ---
        
        // Auto-clean and capitalize Friend Code input; gate Join button at exactly 9 chars
        joinFriendBtn.disabled = true;
        joinCodeInput.addEventListener('input', (e) => {
            const start = e.target.selectionStart;
            const end = e.target.selectionEnd;
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            e.target.setSelectionRange(start, end);
            joinFriendBtn.disabled = e.target.value.length !== 9;
        });

        // In-game Menu Button
        inGameMenuBtn.addEventListener('click', returnToMenu);

        // Click any friend-code display to copy it to clipboard
        document.addEventListener('click', e => {
            const el = e.target.closest('.display-friend-code');
            const text = el?.tagName === 'INPUT' ? el.value : el?.innerText;
            if (!el || !text) return;
            navigator.clipboard?.writeText(text).catch(() => {});
            el.classList.add('copied-flash');
            setTimeout(() => el.classList.remove('copied-flash'), 800);
        });

        // Audio toggle buttons (delegated — handles all instances)
        document.addEventListener('click', e => {
            if (e.target.closest('.music-btn')) { e.target.closest('.music-btn').blur(); Synth.toggleMusic(); }
            else if (e.target.closest('.sfx-btn')) { e.target.closest('.sfx-btn').blur(); Synth.toggleSfx(); }
        });

        // Menu Navigation
        customSettingsBtn.addEventListener('click', () => {
            restoreLobbyState(); // uses saved state if available, else runs updatePowerUpDefaults()
            lobbyLayer.scrollTop = 0;
            initialMenu.classList.add('hidden');
            lobbyLayer.classList.remove('hidden');
        });

        lobbyBackBtn.addEventListener('click', () => {
            saveLobbyState(); // preserve edits even if the player backs out without starting
            lobbyLayer.classList.add('hidden');
            initialMenu.classList.remove('hidden');
        });

        // Start actions
        let client;
        try { client = new Colyseus.Client("wss://gb-lhr-5b4d543b.colyseus.cloud"); } catch(e) { console.warn('Colyseus unavailable (offline?):', e); }
        let room;

        // When a friend clicks "Join Game" or accepts a Steam invite, Steam fires this
        // with the room code stored in the lobby metadata, feeding the same joinById path
        // used by the manual code input.
        window.electronAPI?.onSteamJoinRequest((roomCode) => {
            joiningViaCode = true;
            client.joinById(roomCode, { joinedViaCode: true })
                .then(newRoom => setupRoom(newRoom))
                .catch(e => {
                    joiningViaCode = false;
                    console.error('Steam join request failed:', e);
                    const msg = colyseusErrorText(e);
                    if (isNotFoundError(e, msg) || msg === 'MATCH_OVER') {
                        // Room gone or match ended — create a new one with the same code
                        startGameWithCode(roomCode);
                        return;
                    }
                    let body;
                    if (msg === "ROOM_FULL") {
                        body = "This room is currently full.";
                    } else {
                        body = "Could not join your friend's room. " + msg;
                    }
                    showNetworkNotification('Could Not Join', body, () => {}, 'OK');
                });
        });

        let reconnectionToken = null;
        let leavingIntentionally = false;

        async function setupRoom(newRoom) {
            // If the user navigated back to the menu while the join was in-flight,
            // abandon this room so it doesn't silently take over the client.
            if (gameState === 'MENU') {
                try { newRoom.leave(); } catch (_) {}
                return;
            }
            room = newRoom;
            reconnectionToken = newRoom.reconnectionToken ?? null;
            console.log("Joined room:", room.roomId, "SessionID:", room.sessionId);

            const isCodeJoin = joiningViaCode;
            joiningViaCode = false;

            if (!isCodeJoin) {
                // We created this room — create the Steam lobby then broadcast its ID
                // so every player in the Colyseus room can join it and become visible
                // to their own friends via Steam's "Join Game" button.
                (async () => {
                    const lobbyId = await window.electronAPI?.createSteamLobby(room.roomId);
                    if (lobbyId && room) room.send('set_steam_lobby', { lobbyId });
                })();
            } else if (window.electronAPI) {
                // We joined someone else's room — join their Steam lobby when we see the ID.
                // It may already be in the initial state sync, or arrive shortly after.
                let steamLobbyJoined = false;
                const tryJoinLobby = (state) => {
                    if (!steamLobbyJoined && state.steamLobbyId) {
                        steamLobbyJoined = true;
                        window.electronAPI.joinSteamLobby(state.steamLobbyId);
                    }
                };
                tryJoinLobby(room.state);
                room.onStateChange(tryJoinLobby);
            }
            window.electronAPI?.setRichPresence('In Lobby');
            let gridCompatChecked = false;

            // Update HUD to show the actual room code (prefer state.roomCode; falls back to room.roomId)
            const _updateRoomCodeDisplay = (code) => {
                if (code) document.querySelectorAll('.display-friend-code').forEach(el => {
                    if (el.tagName === 'INPUT') el.value = code; else el.innerText = code;
                });
            };
            _updateRoomCodeDisplay(room.state?.roomCode || room.roomId);

            // Now that we have a room and a sessionId, we can safely init the match
            initMatch();
            if (animationId) cancelAnimationFrame(animationId);
            draw(true);

            // Listen for server state changes
            room.onStateChange((state) => {
                // Ensure room code display reflects state (handles first-patch timing)
                _updateRoomCodeDisplay(state.roomCode);

                // Update timer from server
                timerElement.innerText = formatTime(state.timer * 1000);

                // Update goal
                goal.x = state.goalX;
                goal.y = state.goalY;

                // Sync Maze Grid
                if (state.grid && state.grid.length > 0) {
                    if (isCodeJoin && !gridCompatChecked) {
                        gridCompatChecked = true;
                        const { min, max } = getMazeLimits();
                        if (state.cols < min || state.cols > max) {
                            const reason = state.cols < min ? 'too small' : 'too big';
                            returnToMenu();
                            showNetworkNotification('Incompatible Maze', `This game's maze is ${reason} for your screen. You've been returned to the menu.`, () => {}, 'OK');
                            return;
                        }
                    }
                    cols = state.cols;
                    rows = state.rows;
                    grid = [];
                    for (let x = 0; x < cols; x++) {
                        grid[x] = [];
                        for (let y = 0; y < rows; y++) {
                            const serverCell = state.grid[x * rows + y];
                            const cell = new Cell(x, y);
                            cell.walls = [
                                serverCell.walls[0],
                                serverCell.walls[1],
                                serverCell.walls[2],
                                serverCell.walls[3]
                            ];
                            grid[x][y] = cell;
                        }
                    }
                    generateDistanceMap();
                    cellSize = width / cols;
                }

                // Sync Power-ups
                const prevPowerUps = powerUps.slice();
                powerUps = [];
                state.powerUps.forEach(pu => {
                    powerUps.push({ x: pu.x, y: pu.y, type: pu.type });
                });
                // Detect collected power-ups from state diff
                prevPowerUps.forEach(prev => {
                    if (powerUps.some(p => p.x === prev.x && p.y === prev.y)) return; // still exists

                    if (prev.type === 'opponents') {
                        // Burst animation for orb collection
                        let hitColor = null;
                        const otherPlayers = [];
                        state.players.forEach(ps => {
                            if (ps.x === prev.x && ps.y === prev.y) {
                                hitColor = ps.color;
                            } else {
                                otherPlayers.push({
                                    color: ps.color,
                                    angle: Math.atan2(ps.y - prev.y, ps.x - prev.x)
                                });
                            }
                        });
                        powerUpBursts.push({ gridX: prev.x, gridY: prev.y, hitColor: hitColor || '#ffffff', otherPlayers, startTime: performance.now() });

                    } else if (prev.type === 'rocket') {
                        // Rocket collected — spawn a homing rocket at that position on every client.
                        // Use a position-based ID so all clients produce the same dedup key for rocket_hit.
                        const rocketId = `r${prev.x}-${prev.y}`;
                        if (!rockets.some(r => r.id === rocketId)) {
                            // Find the collector's color and sessionId (player standing on the pickup cell)
                            let collectorColor = '#ff6600';
                            let collectorSessionId = null;
                            state.players.forEach((ps, sid) => {
                                if (ps.x === prev.x && ps.y === prev.y) {
                                    collectorColor = ps.color;
                                    collectorSessionId = sid;
                                }
                            });
                            rockets.push(new Rocket(prev.x, prev.y, collectorColor, rocketId, collectorSessionId));
                        }
                    }
                });

                // Sync Players
                state.players.forEach((playerState, sessionId) => {
                    let blazer = blazers.find(b => b.sessionId === sessionId);
                    const isLocal = sessionId === room.sessionId;
                    // Secondary local: an AI-held 'local' slot that this client owns (co-op on same machine)
                    const slotIndex = playerState.slotIndex;
                    const isSecondaryLocal = !isLocal && playerState.isAI &&
                        Object.prototype.hasOwnProperty.call(localSlotSchemes, slotIndex);
                    const effectiveScheme = isLocal ? localControlScheme
                        : isSecondaryLocal ? localSlotSchemes[slotIndex] : 'WASD';

                    if (!blazer) {
                        // Create new blazer for joined player
                        blazer = new Blazer({
                            id: playerState.id,
                            sessionId: sessionId,
                            color: playerState.color,
                            x: playerState.x,
                            y: playerState.y,
                            slotIndex: slotIndex,
                            isPlayer: !playerState.isAI || isSecondaryLocal,
                            isLocal: isLocal || isSecondaryLocal,
                            isSecondaryLocal: isSecondaryLocal,
                            controlScheme: effectiveScheme
                        });
                        blazers.push(blazer);
                        updateDpad();
                    } else {
                        // Ensure isLocal and isPlayer status is always correct
                        blazer.isLocal = isLocal || isSecondaryLocal;
                        blazer.isSecondaryLocal = isSecondaryLocal;
                        blazer.isPlayer = !playerState.isAI || isSecondaryLocal;

                        // Freeze position updates during round-over countdown — server is frozen too,
                        // so any position change here would be the reset teleport arriving early.
                        if (gameState === 'ROUND_OVER_COUNTDOWN') return;

                        // If player position changed drastically, trigger teleport animation
                        if (Math.abs(blazer.gridX - playerState.x) > 1 || Math.abs(blazer.gridY - playerState.y) > 1) {
                            if (blazer.state === 'normal') {
                                // Smoke puff at departure point, drifting toward destination
                                smokePuffs.push({
                                    fromX: blazer.gridX, fromY: blazer.gridY,
                                    toX: playerState.x,  toY: playerState.y,
                                    color: blazer.color,
                                    startTime: performance.now()
                                });
                                // Trigger local teleport effect for visual consistency
                                blazer.state = 'teleport_out';
                                blazer.stateTimer = 1.0;
                                blazer.targetGridX = playerState.x;
                                blazer.targetGridY = playerState.y;

                                if (blazer.isLocal) Synth.zip();
                                else Synth.glitch();
                            }
                        } else {
                            // Remote players: always sync from server.
                            // Local player: skip entirely — client prediction is authoritative for
                            // single-cell moves. The client uses the same wall data as the server,
                            // so its canMove() checks are always correct. Applying server state here
                            // causes jitter because stale ticks (broadcast before the server processed
                            // the latest move) temporarily snap the player back one cell.
                            if (!isLocal && !blazer.isSecondaryLocal) {
                                blazer.gridX = playerState.x;
                                blazer.gridY = playerState.y;
                            }
                        }
                    }
                });

                // Remove players who left
                blazers = blazers.filter(b => state.players.has(b.sessionId));

                // Sync server scores into local scores map (keeps scoreboard accurate for all clients).
                // Skip players whose score is being animated — their update is applied at animation end.
                state.players.forEach((playerState, sessionId) => {
                    if (!animatingScoreIds.has(playerState.id)) {
                        scores[playerState.id] = playerState.score;
                    }
                });
                updateScoreboard();

                // Late-joiner catch-up: server is in round-over but we haven't transitioned yet
                // (the round_won message was sent before our onMessage handler was registered)
                if (state.roundOver && gameState === 'PLAYING') {
                    const wId = state.lastWinnerId;
                    const wColor = state.lastWinnerColor;
                    scores[wId] = state.lastWinnerScore;
                    updateScoreboard();
                    if (state.matchOver) {
                        gameState = 'MATCH_OVER';
                        Synth.muffle(true);
                        postMatchLayer.style.setProperty('--winner-color', wColor);
                        postMatchLayer.classList.add('winner-pulse');
                        postMatchLayer.classList.remove('hidden');
                        pmTitle.innerText = '';
                        pmTitle.style.textShadow = '';
                        pmSubtitle.innerHTML = `${wId} won the Best-of-3!`;
                        document.getElementById('pm-round-times').innerHTML = '';
                        startMatchEndTimer();
                        startVictoryStars(wColor);
                        startWinnerLap(wColor);
                    } else {
                        gameState = 'ROUND_OVER_COUNTDOWN';
                        currentWinner = blazers.find(b => b.id === wId) || { id: wId, color: wColor };
                        roundCountdown = 3000;
                        startVictoryStars(wColor);
                    }
                }
            });

            room.onMessage("owner_confirm", () => {
                localSlotSchemes = pendingOwnerSlotSchemes;
                pendingOwnerSlotSchemes = {};
            });

            room.onMessage("round_won", ({ winnerId, winnerColor, winnerScore, isMatchWon }) => {
                if (gameState === 'ROUND_OVER_COUNTDOWN' || gameState === 'MATCH_OVER') return;

                const winnerBlazer = blazers.find(b => b.id === winnerId);
                const oldScore = scores[winnerId] ?? 0;

                // Round time tracking
                const currentRoundTime = performance.now() - roundStartTime;
                matchTime += currentRoundTime;
                roundTimes.push({ winnerId, winnerColor, time: currentRoundTime });

                // Explosion particles at winner's position
                screenShake = 40;
                if (winnerBlazer) {
                    for (let i = 0; i < 200; i++) {
                        particles.push(new Particle(winnerBlazer.pixelX, winnerBlazer.pixelY, winnerColor));
                        if (i % 4 === 0) particles.push(new Particle(winnerBlazer.pixelX, winnerBlazer.pixelY, '#ffffff'));
                    }
                }

                if (isMatchWon) {
                    // Match win: update score immediately then show post-match
                    scores[winnerId] = winnerScore;
                    updateScoreboard();

                    Synth.win();
                    Synth.muffle(true);
                    gameState = 'MATCH_OVER';

                    postMatchLayer.style.setProperty('--winner-color', winnerColor);
                    postMatchLayer.classList.add('winner-pulse');
                    postMatchLayer.classList.remove('hidden');
                    startVictoryStars(winnerColor);

                    const fastestRoundTime = Math.min(...roundTimes.map(rt => rt.time));
                    pmTitle.innerText = '';
                    pmTitle.style.textShadow = '';
                    startWinnerLap(winnerColor);

                    const isLocalWinner = winnerBlazer?.isLocal;
                    if (isLocalWinner) {
                        if (bestTime === null || matchTime < bestTime) { bestTime = matchTime; localStorage.setItem('blazeTheMazeBestTime', bestTime); }
                        if (worstTime === null || matchTime > worstTime) { worstTime = matchTime; localStorage.setItem('blazeTheMazeWorstTime', worstTime); }
                        pmSubtitle.innerHTML = `You won the Best-of-3!<br>Match Time: ${formatTime(matchTime)}<br>Fastest Round: ${formatTime(fastestRoundTime)}<br>Best Match Ever: ${formatTime(bestTime)} | Worst: ${formatTime(worstTime)}`;
                    } else {
                        pmSubtitle.innerHTML = `${winnerId} won the Best-of-3!<br>Match Time: ${formatTime(matchTime)}<br>Fastest Round: ${formatTime(fastestRoundTime)}`;
                    }

                    startMatchEndTimer();

                    const roundTimesList = document.getElementById('pm-round-times');
                    roundTimesList.innerHTML = roundTimes.map((rt, index) =>
                        `<div>Round ${index + 1}: <span style="color:${rt.winnerColor};font-weight:bold;">${rt.winnerId}</span> - ${formatTime(rt.time)}</div>`
                    ).join('');
                } else {
                    // Round win (not match): animate the score label flying to the new column.
                    // Score stays at oldScore visually until the animation lands (at 2 s).
                    // onStateChange is guarded to skip syncing this player during the window.
                    gameState = 'ROUND_OVER_COUNTDOWN';
                    currentWinner = winnerBlazer || { id: winnerId, color: winnerColor };
                    roundCountdown = 3000;
                    startVictoryStars(winnerColor);

                    animatingScoreIds.add(winnerId);

                    // After 1 s: launch the flying-label animation
                    setTimeout(() => {
                        if (gameState === 'MATCH_OVER') {
                            // Match ended early — abort cleanly
                            animatingScoreIds.delete(winnerId);
                            return;
                        }
                        // Hide from old column the instant the fly starts
                        scoreHiddenIds.add(winnerId);
                        updateScoreboard();

                        const flyingEl = animateScoreStarToNextCol(winnerId, winnerColor, oldScore, winnerScore);

                        // After another 1 s: commit the score and clean up
                        setTimeout(() => {
                            animatingScoreIds.delete(winnerId);
                            scoreHiddenIds.delete(winnerId);
                            if (flyingEl) flyingEl.remove();
                            scores[winnerId] = winnerScore;
                            updateScoreboard();
                        }, 1000);
                    }, 1000);
                }
            });

            // Server resets the match after 30 s (room was already unlocked at 25 s).
            room.onMessage("match_reset", () => {
                clearInterval(matchEndTimerInterval);
                matchEndTimerInterval = null;

                // Reset client-side match state
                scores = {};
                animatingScoreIds.clear();
                scoreHiddenIds.clear();
                currentWinner = null;
                roundTimes = [];
                matchTime = 0;
                blazers.forEach(b => {
                    b.state = 'normal';
                    b.stateTimer = 0;
                    b.heldDirections = [];
                    b.turnIntent = null;
                    b.swipeIntent = null;
                });

                if (pmJoinIntent) {
                    // Player clicked the join button — drop straight into the new game
                    pmJoinIntent = false;
                    if (pmNextGameBtn) pmNextGameBtn.style.display = 'none';
                    postMatchLayer.classList.add('hidden');
                    postMatchLayer.classList.remove('winner-pulse');
                    stopVictoryStars();
                    stopWinnerLap();
                    initRound();
                } else {
                    // Player didn't opt in — return to menu
                    pmJoinIntent = false;
                    returnToMenu();
                }
            });

            room.onLeave(async (code) => {
                if (code === 4001) {
                    showNetworkNotification('Removed from Room', 'You were removed to make space for a friend-code player.', () => location.reload());
                } else if (leavingIntentionally) {
                    // Player clicked menu / Play Again / closed the window — no reconnect
                    leavingIntentionally = false;
                } else {
                    // Unexpected disconnect (network drop, server restart, etc.)
                    // Try to reconnect up to 4 times. Server holds the slot for 8 s;
                    // 1800 ms intervals mean the 4th attempt fires at ~7.2 s, well inside the window.
                    const MAX_ATTEMPTS = 4;
                    let rejoined = false;
                    for (let i = 1; i <= MAX_ATTEMPTS && !rejoined; i++) {
                        showReconnectingOverlay(i, MAX_ATTEMPTS);
                        await new Promise(r => setTimeout(r, 1800));
                        try {
                            const rejoinedRoom = await client.reconnect(reconnectionToken);
                            hideReconnectingOverlay();
                            setupRoom(rejoinedRoom);
                            rejoined = true;
                        } catch (_) { /* keep trying */ }
                    }
                    if (!rejoined) {
                        hideReconnectingOverlay();
                        showNetworkNotification('Connection Lost', 'Could not reconnect to the server.', () => location.reload());
                    }
                }
            });

            room.onError((code, message) => {
                console.error("Room error:", code, message);
                showNetworkNotification('Server Error', (message || 'An unexpected server error occurred.') + ' (code ' + code + ')', () => location.reload());
            });

            room.onMessage("mirror_controls", ({ duration, collectorSessionId }) => {
                const blazer = blazers.find(b => b.sessionId === collectorSessionId);
                if (blazer) blazer.mirrorUntil = Date.now() + duration;
            });

            room.onMessage("freeze", ({ collectorSessionId, duration }) => {
                const freezeUntil = Date.now() + duration;
                blazers.forEach(b => {
                    if (b.sessionId !== collectorSessionId) b.frozenUntil = freezeUntil;
                });
            });

            room.onMessage("beacon", ({ collectorSessionId, duration }) => {

        /**
         * Spawn falling stars along the left and right viewport margins.
         * Uses fixed positioning so it works whether the menu is absolute or fixed.
         */
        // --- WINNER LAP ---
        // Blazer zooms around the game-container perimeter with a trailing star comet
        let _winnerLapRAF = null;
        let _winnerLapCanvas = null;

        function startWinnerLap(color) {
            stopWinnerLap();
            const cvs = document.createElement('canvas');
            cvs.id = 'winner-lap-canvas';
            cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10001;';
            cvs.width  = window.devicePixelRatio * window.innerWidth  | 0;
            cvs.height = window.devicePixelRatio * window.innerHeight | 0;
            document.body.appendChild(cvs);
            _winnerLapCanvas = cvs;
            const c = cvs.getContext('2d');
            c.scale(window.devicePixelRatio, window.devicePixelRatio);

            const SPEED      = 0.25;  // laps per second
            const TRAIL_LEN  = 45;    // number of trail stars
            const BLAZER_R   = 14;    // px
            const MAX_STAR_R = 22;    // px — largest trail star

            let t = 0, hue = 0, trail = [], last = performance.now();

            function getRect() {
                return document.getElementById('game-container').getBoundingClientRect();
            }

            function perimPos(t) {
                const r = getRect();
                const perim = 2 * (r.width + r.height);
                let d = (((t % 1) + 1) % 1) * perim;
                if (d <= r.width)  return { x: r.left + d,              y: r.top };
                d -= r.width;
                if (d <= r.height) return { x: r.right,                 y: r.top  + d };
                d -= r.height;
                if (d <= r.width)  return { x: r.right - d,             y: r.bottom };
                d -= r.width;
                                   return { x: r.left,                  y: r.bottom - d };
            }

            function drawTrailStar(cx, cy, outerR, starHue, alpha) {
                if (outerR < 1) return;
                const innerR = outerR * 0.42;
                c.save();
                c.translate(cx, cy);
                c.rotate(starHue * 0.025); // vary orientation by hue
                c.globalAlpha = alpha;
                c.beginPath();
                for (let i = 0; i < 10; i++) {
                    const a = i * Math.PI / 5 - Math.PI / 2;
                    const r = i % 2 === 0 ? outerR : innerR;
                    i === 0 ? c.moveTo(Math.cos(a)*r, Math.sin(a)*r)
                            : c.lineTo(Math.cos(a)*r, Math.sin(a)*r);
                }
                c.closePath();
                c.fillStyle = '#040412';
                c.fill();
                c.strokeStyle = `hsl(${starHue},100%,62%)`;
                c.lineWidth = Math.max(1, outerR * 0.13);
                c.shadowBlur  = outerR * 1.4;
                c.shadowColor = `hsl(${starHue},100%,62%)`;
                c.stroke();
                c.shadowBlur = 0;
                c.globalAlpha = 1;
                c.restore();
            }

            function frame(now) {
                const dt = Math.min(now - last, 50);
                last = now;
                t   += dt / 1000 * SPEED;
                hue  = (hue + dt * 0.28) % 360;

                const pos = perimPos(t);
                trail.unshift({ x: pos.x, y: pos.y, hue });
                if (trail.length > TRAIL_LEN) trail.pop();

                c.clearRect(0, 0, window.innerWidth, window.innerHeight);

                // Trail — stars shrink and fade toward the tail
                trail.forEach((tp, i) => {
                    const frac  = 1 - i / TRAIL_LEN;
                    drawTrailStar(tp.x, tp.y, MAX_STAR_R * frac, tp.hue, frac * 0.92);
                });

                // Blazer circle
                c.save();
                c.translate(pos.x, pos.y);
                for (let pass = 0; pass < 2; pass++) {
                    c.beginPath();
                    c.arc(0, 0, BLAZER_R, 0, Math.PI * 2);
                    c.fillStyle  = color;
                    c.shadowBlur  = pass === 0 ? 40 : 18;
                    c.shadowColor = color;
                    c.fill();
                }
                c.beginPath();
                c.arc(0, 0, BLAZER_R * 0.38, 0, Math.PI * 2);
                c.fillStyle  = '#ffffff';
                c.shadowBlur  = 12;
                c.shadowColor = '#ffffff';
                c.fill();
                c.shadowBlur = 0;
                c.restore();

                _winnerLapRAF = requestAnimationFrame(frame);
            }
            _winnerLapRAF = requestAnimationFrame(frame);
        }

        function stopWinnerLap() {
            if (_winnerLapRAF) { cancelAnimationFrame(_winnerLapRAF); _winnerLapRAF = null; }
            document.getElementById('winner-lap-canvas')?.remove();

        function colyseusErrorText(e) {
            if (e == null) return 'Unknown error';
            const msg = e?.message;
            // Colyseus sometimes does new Error(obj) producing the string "[object Object]" — skip it
            if (typeof msg === 'string' && msg && msg !== '[object Object]') {
                // Message might be a JSON-stringified error from the SDK
                try { const p = JSON.parse(msg); if (typeof p?.error === 'string') return p.error; } catch (_) {}
                return msg;
            }
            // Colyseus wraps HTTP errors as { message: { code, error } }
            if (msg && typeof msg === 'object') {
                if (typeof msg.error === 'string') return msg.error;
                if (typeof msg.message === 'string') return msg.message;
            }
            if (typeof e?.error === 'string') return e.error;
            if (typeof e === 'string' && e !== '[object Object]') return e;
            try { const s = JSON.stringify(e); if (s && s.length > 2 && s !== '{}') return s; } catch (_) {}
            return 'Unknown error';
        }

        function isNotFoundError(e, msg) {
            // Text-based checks (handles various Colyseus / SDK phrasings)
            const lc = (msg || '').toLowerCase();
            if (lc.includes('not found') || lc.includes('not_found')) return true;
            // HTTP 404 or Colyseus matchmaker code 4212 mean "room does not exist"
            if (e?.status === 404 || e?.code === 4212) return true;
            if (e?.message?.code === 4212) return true;
            // Colyseus Cloud returns HTTP 522 / MatchMakeError when the room doesn't exist
            if (e?.status === 522 || e?.name === 'MatchMakeError' || lc.includes('matchmakeerror')) return true;
            return false;
        }
