<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Bug Race</title>
    <script src="https://unpkg.com/@colyseus/sdk@0.17.0/dist/colyseus.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            transition: filter 0.1s;
        }

        /* Layout wrapper to handle side-by-side or stacked orientation */
        #main-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        #hud {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 15px;
            width: 250px; /* Fixed width for side panel */
            flex-shrink: 0;
            z-index: 5;
            transition: opacity 0.3s;
        }
        
        .hud-buttons {
            display: flex;
            gap: 5px;
            width: 100%;
            margin-bottom: 5px;
        }
        
        #timer { 
            font-size: 2.5rem; 
            font-weight: bold; 
            color: #fff; 
            font-family: monospace; 
            text-shadow: 0 0 5px #000, 0 0 10px #000;
        }
        
        #scoreboard { 
            font-size: 1.2rem; 
            color: #fff; 
            text-align: left; 
            line-height: 1.6; 
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }

        #friend-code-hud {
            font-family: monospace;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            text-align: left;
            color: rgba(255, 255, 255, 0.7);
        }

        #game-container {
            position: relative;
            height: 100%;
            max-height: 85vh; /* Keep it from touching screen bounds */
            aspect-ratio: 1 / 1; /* Force perfect square */
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
            background: #000000;
            overflow: hidden;
            transition: filter 0.1s;
            flex-shrink: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.3s, background-color 0.5s;
            padding: 20px;
        }

        /* Celebratory pulse effect for match winner */
        @keyframes winnerPulse {
            0% { box-shadow: inset 0 0 30px var(--winner-color); background-color: rgba(0, 0, 0, 0.95); }
            50% { box-shadow: inset 0 0 150px var(--winner-color); background-color: rgba(0, 0, 0, 0.80); }
            100% { box-shadow: inset 0 0 30px var(--winner-color); background-color: rgba(0, 0, 0, 0.95); }
        }

        .winner-pulse {
            animation: winnerPulse 2s infinite ease-in-out;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            color: #fff;
            text-align: center;
        }

        p.subtitle {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: #aaa;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
        }

        .menu-friend-code {
            font-family: monospace;
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        /* Post-Match Statistics Customization */
        .pm-buttons-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        .pm-buttons-vertical button {
            width: 100%;
            margin: 0;
        }

        .stats-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .scrollable-rounds {
            overflow-y: auto;
            max-height: 150px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-family: monospace;
            font-size: 1rem;
            color: #ddd;
            text-align: left;
            line-height: 1.8;
        }

        /* Lobby Grid Styles */
        #slots-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            overflow-y: auto;
            max-height: 50vh;
            padding-right: 5px;
        }

        .player-slot {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .player-slot.inactive {
            opacity: 0.5;
            border-color: transparent;
        }

        .slot-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        select, input[type="number"] {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
        }

        select:focus, input[type="number"]:focus {
            border-color: #00ffff;
        }

        button.action-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #050510;
            background: #00ffff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #00ffff;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            margin: 5px;
        }

        button.action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff;
        }

        button.secondary-btn {
            background: #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
        }
        
        button.secondary-btn:hover {
            box-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff;
        }

        button.tertiary-btn {
            background: #39ff14;
            box-shadow: 0 0 20px #39ff14;
        }
        
        button.tertiary-btn:hover {
            box-shadow: 0 0 30px #39ff14, 0 0 60px #39ff14;
        }

        /* Muted state specifically for the UI audio button */
        button.action-btn.muted {
            background: #555 !important;
            box-shadow: 0 0 10px #555 !important;
            color: #aaa !important;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .join-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .join-group input[type="text"] {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            font-family: monospace;
            outline: none;
            width: 120px;
            text-align: center;
            text-transform: uppercase;
        }

        .join-group input[type="text"]::placeholder {
            color: rgba(255,255,255,0.3);
            text-transform: none;
        }

        .join-group button {
            padding: 10px 25px;
            font-size: 1rem;
            margin: 0;
        }

        #controls-hint {
            position: absolute;
            bottom: 10px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .lobby-settings-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #version-number {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #888;
            z-index: 100;
            pointer-events: none;
        }

        #audio-controls {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 200;
            display: flex;
            gap: 8px;
        }

        .audio-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: #00ffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
        }

        .audio-btn:hover {
            box-shadow: 0 0 16px rgba(0, 255, 255, 0.5);
        }

        .audio-btn svg.icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .audio-btn .slash {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .audio-btn.muted {
            color: #555;
            border-color: rgba(80, 80, 80, 0.4);
            box-shadow: none;
        }

        .audio-btn.muted .slash {
            display: block;
        }

        /* D-pad (mobile only) */
        #mobile-dpad {
            display: none;
        }

        .dpad-btn {
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.35);
            border-radius: 8px;
            color: #0ff;
            font-size: 1rem;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active {
            background: rgba(0, 255, 255, 0.25);
            border-color: rgba(0, 255, 255, 0.7);
        }

        .dpad-center {
            /* empty center cell in the cross */
        }

        /* Mobile-only elements (hidden on desktop) */
        #mobile-friend-code {
            display: none;
        }

        /* Mobile / Portrait Viewport adjustments */
        @media (max-width: 900px), (max-aspect-ratio: 1/1) {
            h1 { font-size: 2rem; }
            #slots-container { grid-template-columns: 1fr; }

            /* Switch to CSS grid so we can span canvas across both cols
               and place audio/dpad/hud independently without nesting issues */
            #main-wrapper {
                display: grid;
                grid-template-areas:
                    "canvas  canvas"
                    "audio   hud   "
                    "fcode   hud   "
                    "dpad    hud   ";
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto auto;
                align-content: start;   /* start from top — fixes vertical clip */
                justify-items: stretch;
                gap: 8px;
                padding: 10px;
                /* keep width/height from desktop */
            }

            /* Canvas row — centred square spanning both columns */
            #game-container {
                grid-area: canvas;
                justify-self: center;
                width: 100%;
                max-width: 85vmin;
                max-height: 85vmin;
                height: auto;
            }

            /* Left col — audio controls (always visible, not inside .hidden hud) */
            #audio-controls {
                grid-area: audio;
                position: static;   /* override position:fixed on desktop */
                display: flex;
                gap: 8px;
                align-self: start;
            }

            /* Left col — friend code (mobile copy, synced via querySelectorAll) */
            #mobile-friend-code {
                display: block;
                grid-area: fcode;
                font-family: monospace;
                font-size: 0.85rem;
                background: rgba(0,0,0,0.5);
                padding: 8px;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.1);
                color: rgba(255,255,255,0.7);
                align-self: start;
            }

            /* Left col — d-pad */
            #mobile-dpad {
                display: grid;
                grid-area: dpad;
                grid-template-columns: repeat(3, 46px);
                grid-template-rows: repeat(3, 46px);
                gap: 4px;
                align-self: start;
            }

            #dpad-up    { grid-column: 2; grid-row: 1; }
            #dpad-left  { grid-column: 1; grid-row: 2; }
            .dpad-center { grid-column: 2; grid-row: 2; }
            #dpad-right { grid-column: 3; grid-row: 2; }
            #dpad-down  { grid-column: 2; grid-row: 3; }

            /* Right col — HUD spans all three right rows */
            #hud {
                grid-area: hud;
                display: flex;
                flex-direction: column;
                gap: 8px;
                width: 100%;
                height: auto;
                max-width: unset;
                padding: 0;
                align-items: stretch;
                align-self: start;
            }

            /* Hide the desktop friend-code inside #hud on mobile
               (shown via #mobile-friend-code in left col instead) */
            #friend-code-hud {
                display: none;
            }

            .hud-buttons {
                width: 100% !important;
                margin-bottom: 0 !important;
                display: flex !important;
            }

            #in-game-menu-btn {
                width: 100% !important;
                padding: 8px 15px !important;
                font-size: 0.9rem !important;
                margin: 0 !important;
                flex: 1 !important;
            }

            #timer {
                font-size: 1.8rem;
            }

            #scoreboard {
                width: 100%;
                font-size: 0.85rem;
                padding: 8px;
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div id="version-number">v1.1.2</div>

    <div id="main-wrapper">
        <div id="hud" class="hidden">
            <div class="hud-buttons">
                <button class="action-btn secondary-btn" id="in-game-menu-btn" style="padding: 10px; font-size: 0.9rem; flex: 1; margin: 0;">Menu</button>
            </div>
            <div id="timer">00:00.000</div>
            <div id="scoreboard"></div>
            <div id="friend-code-hud">Code: <span class="display-friend-code" style="color: #00ffff; font-weight: bold;"></span></div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <!-- This menu now ONLY appears when the entire match is over -->
            <div id="post-match-layer" class="menu-overlay hidden">
                <h1 id="pm-title">Match Over</h1>
                
                <div class="pm-buttons-vertical">
                    <button class="action-btn" id="play-again-btn">Play Again</button>
                    <button class="action-btn secondary-btn" id="menu-btn">Main Menu</button>
                </div>

                <div class="stats-container">
                    <p class="subtitle" id="pm-subtitle" style="margin-bottom: 0;"></p>
                    <div id="pm-round-times" class="scrollable-rounds">
                        <!-- Round times dynamically added here -->
                    </div>
                </div>
            </div>

            <!-- Initial Main Menu -->
            <div id="initial-menu" class="menu-overlay">
                <h1>Neon Bug Race</h1>
                <p class="subtitle">First to 3 wins. Orbs teleport opponents, black holes teleport you.</p>
                
                <button class="action-btn" id="quick-start-btn">Quick Start</button>
                
                <div class="join-group">
                    <input type="text" id="join-code-input" placeholder="Code..." maxlength="6">
                    <button class="action-btn secondary-btn" id="join-friend-btn">Join Friend</button>
                </div>

                <button class="action-btn tertiary-btn" id="custom-settings-btn">Custom</button>
            </div>

            <!-- Custom Lobby Menu -->
            <div id="lobby-layer" class="menu-overlay hidden">
                <h1>Custom Game</h1>
                <div id="slots-container">
                    <!-- Slots dynamically generated -->
                </div>
                
                <!-- Match Settings Toggle -->
                <div class="lobby-settings-panel">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="grid-size-input" style="font-size: 1.2rem;">Grid Size:</label>
                        <input type="number" id="grid-size-input" value="20" min="5" max="100" style="font-size: 1.1rem; padding: 5px; width: 80px; text-align: center;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="pu-opp-input" style="font-size: 1.2rem;">Orbs (Teleport Others):</label>
                        <input type="number" id="pu-opp-input" value="10" min="0" max="100" style="font-size: 1.1rem; padding: 5px; width: 80px; text-align: center;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="pu-self-input" style="font-size: 1.2rem;">Holes (Teleport Self):</label>
                        <input type="number" id="pu-self-input" value="10" min="0" max="100" style="font-size: 1.1rem; padding: 5px; width: 80px; text-align: center;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="pu-rocket-input" style="font-size: 1.2rem;">Homing Rockets:</label>
                        <input type="number" id="pu-rocket-input" value="0" min="0" max="100" style="font-size: 1.1rem; padding: 5px; width: 80px; text-align: center;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="collisions-toggle" checked style="width: 20px; height: 20px; cursor: pointer;"> 
                        <label for="collisions-toggle" style="font-size: 1.2rem; cursor: pointer; user-select: none;">Enable Collisions</label>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="action-btn secondary-btn" id="lobby-back-btn">Back</button>
                    <button class="action-btn" id="start-btn">Start Match</button>
                </div>
            </div>
        </div>

        <!-- These three are siblings of #hud and #game-container so they are never
             affected by the opacity:0 .hidden class applied to #hud. -->
        <div id="audio-controls">
            <button class="audio-btn muted" id="music-btn" title="Toggle Music">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
            </button>
            <button class="audio-btn muted" id="sfx-btn" title="Toggle Sound Effects">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div id="mobile-friend-code">Code: <span class="display-friend-code" style="color: #00ffff; font-weight: bold;"></span></div>
        <div id="mobile-dpad">
            <button class="dpad-btn" id="dpad-up">▲</button>
            <button class="dpad-btn" id="dpad-left">◄</button>
            <div class="dpad-center"></div>
            <button class="dpad-btn" id="dpad-right">►</button>
            <button class="dpad-btn" id="dpad-down">▼</button>
        </div>
    </div>

    <div id="controls-hint">Desktop: Assigned Keys | Mobile: Swipe</div>

    <script>
        // --- BULLETPROOF AUDIO SYSTEM ---
        const Synth = {
            ctx: { state: 'running', resume: () => {} }, // Keep dummy for legacy UI code
            isMusicMuted: true,
            isSfxMuted: true,
            bgMusic: new Audio('./assets/audio/music.ogg'),
            init() {
                this.bgMusic.loop = true;
                this.bgMusic.volume = 0.4;
                this.bgMusic.onerror = () => { console.log('Music file missing or failed to load. Running silently.'); };
                this._syncButtons();
            },
            _syncButtons() {
                const musicBtn = document.getElementById('music-btn');
                const sfxBtn = document.getElementById('sfx-btn');
                if (musicBtn) musicBtn.classList.toggle('muted', this.isMusicMuted);
                if (sfxBtn) sfxBtn.classList.toggle('muted', this.isSfxMuted);
            },
            playSound(filename) {
                if (this.isSfxMuted) return;
                const audio = new Audio('./assets/audio/' + filename);
                audio.volume = 0.6;
                audio.onerror = () => {};
                audio.play().catch(() => {});
            },
            turn(isPlayer) { if (isPlayer) this.playSound('turn.ogg'); },
            bonk(isPlayer) { if (isPlayer) this.playSound('bonk.ogg'); },
            thud() { this.playSound('thud.ogg'); },
            zip() { this.playSound('zip.ogg'); },
            glitch() { this.playSound('glitch.ogg'); },
            win() { this.playSound('win.ogg'); },
            startMusic() {
                if (!this.isMusicMuted) {
                    this.bgMusic.play().catch(() => {});
                }
            },
            muffle(isMuffled) {
                this.bgMusic.volume = isMuffled ? 0.15 : 0.4;
            },
            toggleMusic() {
                this.isMusicMuted = !this.isMusicMuted;
                if (this.isMusicMuted) {
                    this.bgMusic.pause();
                } else {
                    this.bgMusic.play().catch(() => {});
                }
                this._syncButtons();
            },
            toggleSfx() {
                this.isSfxMuted = !this.isSfxMuted;
                this._syncButtons();
            }
        };
        // --- END AUDIO SYSTEM ---

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const gameContainer = document.getElementById('game-container');
        
        // UI Layers
        const initialMenu = document.getElementById('initial-menu');
        const lobbyLayer = document.getElementById('lobby-layer');
        const postMatchLayer = document.getElementById('post-match-layer');
        const hud = document.getElementById('hud');
        const slotsContainer = document.getElementById('slots-container');
        
        // Buttons & Text

        const musicBtn = document.getElementById('music-btn');
