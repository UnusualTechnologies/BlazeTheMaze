<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaze the Maze</title>
    <script src="https://browser.sentry-cdn.com/7.60.0/bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@colyseus/sdk@0.17.0/dist/colyseus.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            transition: filter 0.1s;
            /* Respect notch / home bar on iOS and Android */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* All viewports: canvas centred in a column, controls above and below */
        #main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: 100%;
            height: 100%;
            padding: clamp(10px, 2vh, 20px);
            box-sizing: border-box;
        }

        /* Top bar: audio controls on the left, menu button on the right */
        #hud-bar {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: min(85vmin, calc(100vh - 280px));
            max-width: 100%;
            flex-shrink: 0;
            z-index: 5;
            transition: opacity 0.3s;
        }

        /* Bottom controls: 2-col grid
           Left  col: friend-code (row 1) | scoreboard (row 2)
           Right col: timer       (row 1) | dpad       (row 2)  */
        #hud {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            width: min(85vmin, calc(100vh - 280px));
            max-width: 100%;
            gap: 8px;
            flex-shrink: 0;
            margin-top: 0;
            z-index: 5;
            transition: opacity 0.3s;
            align-items: start;
        }

        #timer      { grid-column: 1; grid-row: 1; }
        #scoreboard { grid-column: 1; grid-row: 2; }
        #dpad       { grid-column: 2; grid-row: 1 / span 2; align-self: stretch; }

        .hud-buttons {
            display: flex;
            gap: 5px;
        }
        
        #timer {
            font-size: clamp(1.4rem, 3.5vw, 2.5rem);
            font-weight: bold;
            color: #fff;
            font-family: monospace;
            text-shadow: 0 0 5px #000, 0 0 10px #000;
        }
        
        #scoreboard {
            display: flex;
            flex-direction: row;
            color: #fff;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 10px 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }

        .score-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }


        .score-col + .score-col {
            border-left: 1px solid rgba(255,255,255,0.2);
        }

        .score-header {
            font-size: 0.9rem;
            width: 100%;
            text-align: center;
            padding-bottom: 4px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            min-height: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .goal-star-svg {
            transform-box: fill-box;
            transform-origin: center;
            animation: goal-star-spin 6s linear infinite, goal-star-hue 2s linear infinite;
            overflow: visible;
        }
        @keyframes goal-star-spin {
            to { transform: rotate(360deg); }
        }
        @keyframes goal-star-hue {
            to { filter: hue-rotate(360deg); }
        }

        .score-players {
            font-size: 0.8rem;
            line-height: 1.5;
            text-align: center;
            word-break: break-word;
            padding: 0 4px;
        }

        #friend-code-hud {
            font-family: monospace;
            font-size: 0.85rem;
            color: #fff;
            text-align: center;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 8px;
        }

        .display-friend-code {
            /* Render as invisible input so browsers give it native selection behaviour */
            background: none;
            border: none;
            outline: none;
            font-family: monospace;
            font-size: inherit;
            font-weight: bold;
            color: #fff;
            text-align: center;
            width: 9ch;
            padding: 0;
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
        }

        .display-friend-code.copied-flash {
            color: #00ff88 !important;
            transition: color 0.15s;
        }

        #game-container {
            position: relative;
            flex-shrink: 0;
            width: min(85vmin, calc(100vh - 280px));
            max-width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
            background: #000000;
            overflow: hidden;
            transition: filter 0.1s;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.3s, background-color 0.5s;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* Celebratory pulse effect for match winner */
        @keyframes winnerPulse {
            0% { box-shadow: inset 0 0 30px var(--winner-color); background-color: rgba(0, 0, 0, 0.95); }
            50% { box-shadow: inset 0 0 150px var(--winner-color); background-color: rgba(0, 0, 0, 0.80); }
            100% { box-shadow: inset 0 0 30px var(--winner-color); background-color: rgba(0, 0, 0, 0.95); }
        }

        .winner-pulse {
            animation: winnerPulse 2s infinite ease-in-out;
        }

        /* ── Victory stars ──────────────────────────────────────────────────── */
        @keyframes vstar-fall {
            0%   { transform: translateY(0)             rotate(0deg);          opacity: 0;   }
            7%   {                                                               opacity: 1;   }
            88%  {                                                               opacity: 0.9; }
            100% { transform: translateY(var(--vfall))  rotate(var(--vspin));  opacity: 0;   }
        }

        #victory-stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 9999;
        }

        .vstar {
            position: absolute;
            top: -40px;
            pointer-events: none;
            user-select: none;
            will-change: transform, opacity;
            animation: vstar-fall linear infinite;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 3rem);
            margin-bottom: 1rem;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            color: #fff;
            text-align: center;
        }

        p.subtitle {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: #aaa;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
        }

        .menu-friend-code {
            font-family: monospace;
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        /* Post-Match Statistics Customization */
        .pm-buttons-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        .pm-buttons-vertical button {
            width: 100%;
            margin: 0;
        }

        .stats-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .scrollable-rounds {
            overflow-y: auto;
            max-height: 150px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-family: monospace;
            font-size: 1rem;
            color: #ddd;
            text-align: left;
            line-height: 1.8;
        }

        /* Lobby Grid Styles */
        #slots-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        /* Lobby always scrolls as one unified column — no inner scroll regions */
        #lobby-layer {
            justify-content: flex-start;
            padding-top: 24px;
            padding-bottom: 24px;
        }

        .player-slot {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .player-slot.inactive {
            opacity: 0.5;
            border-color: transparent;
        }

        .slot-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        select, input[type="number"] {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
        }

        select:focus, input[type="number"]:focus {
            border-color: #00ffff;
        }

        button.action-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #050510;
            background: #00ffff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #00ffff;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            margin: 5px;
        }

        button.action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff;
        }

        button.secondary-btn {
            background: #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
        }
        
        button.secondary-btn:hover {
            box-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff;
        }

        #in-game-menu-btn {
            border: 2px solid #fff;
        }

        button.tertiary-btn {
            background: #39ff14;
            box-shadow: 0 0 20px #39ff14;
        }
        
        button.tertiary-btn:hover {
            box-shadow: 0 0 30px #39ff14, 0 0 60px #39ff14;
        }

        button.action-btn:disabled {
            background: #444;
            box-shadow: none;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        /* Muted state specifically for the UI audio button */
        button.action-btn.muted {
            background: #555 !important;
            box-shadow: 0 0 10px #555 !important;
            color: #aaa !important;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .join-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .join-group input[type="text"] {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            font-family: monospace;
            outline: none;
            width: 120px;
            text-align: center;
            text-transform: uppercase;
        }

        .join-group input[type="text"]::placeholder {
            color: rgba(255,255,255,0.3);
            text-transform: none;
        }

        .join-group button {
            padding: 10px 25px;
            font-size: 1rem;
            margin: 0;
        }

        .lobby-settings-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #version-number { display: none; }

        .ver-text {
            font-family: monospace;
            font-size: 0.75rem;
            color: #fff;
            white-space: nowrap;
            flex-shrink: 0;
        }

        #hud-bar .ver-text {
            margin-right: 8px;
        }

        .audio-controls {
            display: flex;
            gap: 8px;
        }

        .audio-btn {
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: #00ffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
        }

        .audio-btn:hover {
            box-shadow: 0 0 16px rgba(0, 255, 255, 0.5);
        }

        .audio-btn svg.icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .audio-btn .slash {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .audio-btn.muted {
            color: #555;
            border-color: rgba(80, 80, 80, 0.4);
            box-shadow: none;
        }

        .audio-btn.muted .slash {
            display: block;
        }

        #dpad {
            display: grid;
            grid-template-areas: ". up ." "left down right";
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 60px);
            align-content: center;
            gap: 8px;
            width: 100%;
            padding: 6px 0;
        }

        #dpad.hidden { display: none; }

        .dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background 0.07s, transform 0.07s, border-bottom-width 0.07s;
        }

        .dpad-btn[data-dir="up"]    { grid-area: up; }
        .dpad-btn[data-dir="left"]  { grid-area: left; }
        .dpad-btn[data-dir="right"] { grid-area: right; }
        .dpad-btn[data-dir="down"]  { grid-area: down; }

        .dpad-btn.pressed {
            background: rgba(0, 255, 255, 0.15);
            border-color: rgba(0, 255, 255, 0.45);
            color: #00ffff;
            transform: translateY(2px);
        }

        /* Lobby slots go single-column below 600px */
        @media (max-width: 600px) {
            #slots-container { grid-template-columns: 1fr; }
        }

        /* Mobile / Portrait — layout is already column from desktop styles.
           Only override: menus go full-screen, lobby scrolls from top. */
        @media (max-width: 900px), (max-aspect-ratio: 1/1) {
            #slots-container { grid-template-columns: 1fr; }

            /* Menus cover full viewport (not just the canvas square) */
            .menu-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                height: auto;
                z-index: 1000;
            }

            /* On mobile, respect the notch safe area for lobby top padding */
            #lobby-layer { padding-top: max(24px, env(safe-area-inset-top)); }

            /* Join code input fills available space */
            .join-group { width: 90%; }
            .join-group input[type="text"] { flex: 1; width: auto; min-width: 80px; }
        }

        /* Extra-small phones (≤ 480px) */
        @media (max-width: 480px) {
            .menu-overlay { padding: 12px; }

            button.action-btn {
                padding: 12px 28px;
                font-size: 1rem;
            }

            .lobby-settings-panel > div {
                flex-wrap: wrap;
            }

            #scoreboard {
                font-size: 0.78rem;
                padding: 6px;
            }
        }

        #menu-title {
            color: #fff; font-size: 3.5em; font-style: italic; font-weight: 900;
            letter-spacing: 4px; text-transform: uppercase;
            transform: skewX(-20deg);
            transform-origin: left center;
            text-shadow:
                -5px   0px  0px rgba(255,120,120,0.60),
                -11px -1px  0px rgba(255, 70, 70,0.50),
                -18px -2px  0px rgba(240, 40, 40,0.40),
                -27px -3px  0px rgba(210, 20, 20,0.30),
                -38px -4px  0px rgba(180, 10, 10,0.22),
                -51px -5px  0px rgba(150,  5,  5,0.15),
                -67px -7px  0px rgba(120,  2,  2,0.10),
                -90px  -9px 25px rgba(200,  0,  0,0.12),
               -150px -15px 45px rgba(100,  0,  0,0.08);
            margin: 0; padding: 0 30px; flex-shrink: 0; align-self: flex-start;
        }
        #menu-mini-canvas {
            display: block;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div id="version-number">v1.5.136</div>

    <div id="main-wrapper">
        <!-- Top bar: audio controls (left) + menu button (right), above the canvas -->
        <div id="hud-bar" class="hidden">
            <div class="audio-controls">
                <button class="audio-btn music-btn" title="Toggle Music">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                    <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
                <button class="audio-btn sfx-btn" title="Toggle Sound Effects">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div id="friend-code-hud">Friend code:<br><input class="display-friend-code" readonly value="" tabindex="-1"></div>
            <span class="ver-text"></span>
            <div class="hud-buttons">
                <button class="action-btn secondary-btn" id="in-game-menu-btn" style="padding: 10px; font-size: 0.9rem; flex: 1; margin: 0;">Menu</button>
            </div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <!-- This menu now ONLY appears when the entire match is over -->
            <div id="post-match-layer" class="menu-overlay hidden">
                <h1 id="pm-title">Match Over</h1>

                <div class="pm-buttons-vertical">
                    <button class="action-btn" id="pm-next-game-btn" disabled
                            style="display:none; opacity:0.4; cursor:not-allowed;">
                        30 until next game starts
                    </button>
                    <button class="action-btn secondary-btn" id="menu-btn">Main Menu</button>
                </div>

                <div class="stats-container">
                    <p class="subtitle" id="pm-subtitle" style="margin-bottom: 0;"></p>
                    <div id="pm-round-times" class="scrollable-rounds">
                        <!-- Round times dynamically added here -->
                    </div>
                </div>
            </div>

            <!-- Initial Main Menu -->
            <div id="initial-menu" class="menu-overlay">
                <span class="ver-text"></span>
                <div class="audio-controls">
                    <button class="audio-btn music-btn" title="Toggle Music">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                        <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </button>
                    <button class="audio-btn sfx-btn" title="Toggle Sound Effects">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                        <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <h1 id="menu-title">BLAZE THE MAZE</h1>
                <canvas id="menu-mini-canvas" width="550" height="150"></canvas>
                <button class="action-btn" id="quick-start-btn">Race!</button>

                <button class="action-btn tertiary-btn" id="custom-settings-btn">Custom</button>

                <div class="join-group">
                    <input type="text" id="join-code-input" placeholder="Code..." maxlength="9" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" style="text-transform: uppercase;">
                    <button class="action-btn secondary-btn" id="join-friend-btn">Join Friend</button>
                </div>
            </div>

            <!-- Custom Lobby Menu -->
            <div id="lobby-layer" class="menu-overlay hidden">
                <h1>Custom Game</h1>
                <div id="slots-container">
                    <!-- Slots dynamically generated -->
                </div>
                
                <!-- Match Settings Toggle -->
                <div class="lobby-settings-panel">
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <label for="grid-size-input" style="font-size: 1.2rem;">Grid Size:</label>
                        <input type="number" id="grid-size-input" value="20" min="5" max="100" inputmode="numeric" style="font-size: 1.1rem; padding: 5px; width: 80px; text-align: center;">
                        <span id="grid-size-hint" style="font-size: 0.85rem; color: #ff6666; display: none;"></span>
                    </div>

        // ── Power-up localStorage helpers ────────────────────────────────────

        function savePuToLocalStorage() {
            const vals = {};
            PU_KEYS.forEach(k => {
                const el = document.getElementById(`pu-${k}-input`);
                if (el) vals[k] = el.value;

        function loadPuFromLocalStorage() {
            try {
                const raw = localStorage.getItem(PU_LS_KEY);
                if (!raw) return;
                const vals = JSON.parse(raw);

        // ── Auto-scale power-up counts and grid size to player count ─────────
        // Formulas (n = number of active players):
        //   Teleport Other / Self : 10 − (n−1)         [−1 per extra player]
        //   Rockets               : 4  − ⌊(n−1)/2⌋    [−1 per 2 extra players]
        //   Mirror Controls       : 9  − (n−1)         [−1 per extra player]
        //   Grid Size             : 20 → 28 over 2–8p  [20 + round((n−2)×4/3)]
        // Inputs that were manually edited (puManualFlags / gridSizeManualFlag) are left unchanged.
        function updatePowerUpDefaults() {
            const n = lobbySlots.filter(s => {
                const v = s.typeSelect.value;
                return v !== 'inactive' && v !== 'friend_only';
            }).length;

            const auto = {
                opp:     Math.max(0, 10 - (n - 1)),
                self:    Math.max(0, 10 - (n - 1)),
                rocket:  Math.max(0, 4  - Math.floor((n - 1) / 2)),
                mirror:  Math.max(0, 9  - (n - 1)),
                mystery: 3, // flat — wildcard power-up count doesn't scale with player count
                freeze:  3, // flat — more players = more satisfying freeze, keep count constant
                beacon:  3, // flat — path guide; useful regardless of player count
            };

            PU_KEYS.forEach(k => {
                if (!puManualFlags.has(k)) {
                    const el = document.getElementById(`pu-${k}-input`);
                    if (el) el.value = String(auto[k]);
                }
            });

            if (!gridSizeManualFlag) {
                const autoSize = Math.min(28, Math.max(20, 20 + Math.round((n - 2) * 4 / 3)));
                gridSizeInput.value = String(autoSize);
            }
        }

        /** Snapshot the current lobby config into memory so it can be restored next time the player creates a game. */
        function saveLobbyState() {
            savedLobbyState = {
                gridSize:      gridSizeInput.value,

                puSelf:        puSelfInput.value,
                puRocket:      puRocketInput.value,

                tapOnly:       tapOnlyToggle.checked,

                    mode:        s.typeSelect.value,
                    control:     s.controlSelect.value,
                    aiBehavior:  s.aiBehaviorSelect.value,
                    aiSpeed:     s.aiSpeedSelect.value,
                    customSpeed: s.customSpeedSlider.value,
                })),
                puManualFlags:  [...puManualFlags],
                gridSizeManual: gridSizeManualFlag,
            };
        }

        /**
         * Restore a previously saved lobby state.  If nothing has been saved yet, falls through to
         * updatePowerUpDefaults() so the first visit always gets sensible auto-scaled values.
         */
        function restoreLobbyState() {
            if (!savedLobbyState) { updatePowerUpDefaults(); return; }
            const s = savedLobbyState;
            // 1. Lock ALL auto-scaling keys so slot change events can't overwrite saved values
            PU_KEYS.forEach(k => puManualFlags.add(k));
            gridSizeManualFlag = true;
            // 2. Restore each slot (dispatching 'change' keeps the show/hide UI logic in sync)
            s.slots.forEach((sd, i) => {
                const slot = lobbySlots[i];
                if (!slot) return;
                slot.typeSelect.value = sd.mode;
                slot.typeSelect.dispatchEvent(new Event('change'));
                slot.controlSelect.value    = sd.control;
                slot.aiBehaviorSelect.value = sd.aiBehavior;
                slot.aiSpeedSelect.value    = sd.aiSpeed;
                slot.aiSpeedSelect.dispatchEvent(new Event('change')); // shows/hides custom-speed wrapper
                slot.customSpeedSlider.value = sd.customSpeed;
                const display = slot.customSpeedSlider.parentElement.querySelector('.custom-speed-display');
                if (display) display.innerText = sd.customSpeed;
            });
            // 3. Restore all settings inputs
            gridSizeInput.value  = s.gridSize;
            puOppInput.value     = s.puOpp;
            puSelfInput.value    = s.puSelf;
            puRocketInput.value  = s.puRocket;
            puMirrorInput.value  = s.puMirror;
            puMysteryInput.value = s.puMystery;
            puFreezeInput.value  = s.puFreeze;
            puBeaconInput.value  = s.puBeacon;
            document.getElementById('collisions-toggle').checked = s.collisions;
            orbLeaderToggle.checked = s.orbLeader;
            tapOnlyToggle.checked   = s.tapOnly ?? false;
            // 4. Restore the actual manual-flag state (not the all-locked state from step 1)
            puManualFlags      = new Set(s.puManualFlags);
            gridSizeManualFlag = s.gridSizeManual;
        }

        function parseLobby() {
            activePlayersData = [];
            lobbySlots.forEach(slot => {
                const type = slot.typeSelect.value;
                if (type !== 'inactive') {
                    // For prototype purposes, we'll treat "friend_code" as a local player who isn't fully active but shown
                    const isLocal = (type === 'local' || type === 'friend_only');
                    activePlayersData.push({
                        id: slot.id,
                        color: slot.color,
                        isPlayer: isLocal,
                        controlScheme: isLocal ? slot.controlSelect.value : null,
                        aiSpeed: slot.aiSpeedSelect.value,
                        aiCustomSpeed: parseInt(slot.customSpeedSlider.value, 10),
                        aiBehavior: slot.aiBehaviorSelect.value,
                        startIndex: slot.index
                    });
                }
            });
        }

        class Cell {
            constructor(x, y) {
                this.x = x;

                this.walls = [true, true, true, true]; 
                this.visited = false;
            }
        }

        class Shockwave {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.life = 1.0;
                this.maxRadius = cellSize * 4;
            }
            update(dt) {
                this.life -= dt * 0.002; 
                return this.life > 0;
            }
            draw() {
                const currentRadius = (1 - this.life) * this.maxRadius;
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.life * 8;
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                // Faster and more dramatic burst speed for stronger visual impact
                const speed = (Math.random() * 15 + 4) * (cellSize * 0.02); 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01; 
                this.size = Math.random() * (cellSize * 0.25) + 2;
            }
            update(dt) {
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.x += this.vx * (dt * 0.05);
                this.y += this.vy * (dt * 0.05);
                this.life -= this.decay * (dt * 0.05);
                return this.life > 0;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }
        
        class Rocket {
            constructor(x, y, color, id, ownerSessionId = null) {
                this.gridX = x;
                this.gridY = y;
                ({ x: this.pixelX, y: this.pixelY } = gridToPixel(x, y));
                this.color = color;
                this.id = id;
                this.ownerSessionId = ownerSessionId; // activator — immune to their own rocket
                this.moveTimer = 0;
                this.moveInterval = 100; // Zooms at 100ms per square
                this.life = true;
                this.angle = 0;
                this.stepsTaken = 0;
                this.hitTargets = new Set(); // prevents double-reporting the same target
            }

            update(dt) {
                this.moveTimer += dt;

                // Smooth visual following
                const target = gridToPixel(this.gridX, this.gridY);
                this.pixelX += (target.x - this.pixelX) * 0.52;
                this.pixelY += (target.y - this.pixelY) * 0.52;

                if (this.moveTimer >= this.moveInterval) {
                    this.moveTimer = 0;
                    try { this.step(); } catch(e) { console.warn('Rocket step error:', e); }
                }
                return this.life;
            }

            step() {
                if (this.gridX === goal.x && this.gridY === goal.y) {
                    this.life = false;
                    for(let i=0; i<20; i++) particles.push(new Particle(this.pixelX, this.pixelY, this.color));
                    return;
                }

                const currDist = distanceMap[this.gridX][this.gridY];
                let bestMove = null;
                let minDist = currDist;
                
                const cell = grid[this.gridX][this.gridY];

                if (!cell.walls[0] && distanceMap[this.gridX][this.gridY-1] < minDist) { bestMove = {dx: 0, dy: -1}; minDist = distanceMap[this.gridX][this.gridY-1]; }
                if (!cell.walls[1] && distanceMap[this.gridX+1][this.gridY] < minDist) { bestMove = {dx: 1, dy: 0}; minDist = distanceMap[this.gridX+1][this.gridY]; }
                if (!cell.walls[2] && distanceMap[this.gridX][this.gridY+1] < minDist) { bestMove = {dx: 0, dy: 1}; minDist = distanceMap[this.gridX][this.gridY+1]; }
                if (!cell.walls[3] && distanceMap[this.gridX-1][this.gridY] < minDist) { bestMove = {dx: -1, dy: 0}; minDist = distanceMap[this.gridX-1][this.gridY]; }

                if (bestMove) {
                    this.gridX += bestMove.dx;
                    this.gridY += bestMove.dy;
                    this.angle = Math.atan2(bestMove.dy, bestMove.dx);
                    this.stepsTaken++;
                } else {
                    // No valid move (shouldn't happen in a connected maze — skip this step)
                    this.stepsTaken++;
                }

                // Check collision with blazers on the way
                if (this.stepsTaken > 0) {
                    blazers.forEach(b => {
                        if (b.gridX === this.gridX && b.gridY === this.gridY && b.state === 'normal') {
                            if (this.hitTargets.has(b.sessionId)) return;
                            if (b.sessionId === this.ownerSessionId) return; // activator is immune
                            this.hitTargets.add(b.sessionId);
                            screenShake = 10;
                            for(let i=0; i<15; i++) particles.push(new Particle(this.pixelX, this.pixelY, this.color));
                            // Report to server — server teleports authoritatively; onStateChange drives the visual
                            if (room) room.send("rocket_hit", { rocketId: this.id, targetSessionId: b.sessionId });
                        }
                    });
                }

                if (this.gridX === goal.x && this.gridY === goal.y) {
                    this.life = false;
                    for(let i=0; i<20; i++) particles.push(new Particle(this.pixelX, this.pixelY, this.color));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.pixelX, this.pixelY);
                ctx.rotate(this.angle + Math.PI / 2); // Point triangle in direction of travel
                ctx.beginPath();
                ctx.moveTo(0, -cellSize * 0.4);
                ctx.lineTo(cellSize * 0.25, cellSize * 0.25);
                ctx.lineTo(0, cellSize * 0.1);
                ctx.lineTo(-cellSize * 0.25, cellSize * 0.25);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function mirrorDir(dir) {
            if (dir === 'up') return 'down';
            if (dir === 'down') return 'up';
            if (dir === 'left') return 'right';
            if (dir === 'right') return 'left';
            return dir;
        }

        class Blazer {
            constructor(data) {
                const pos = getStartPos(data.startIndex || 0);
                this.gridX = data.x !== undefined ? data.x : pos.x;
                this.gridY = data.y !== undefined ? data.y : pos.y;
                this.pixelX = 0;
                this.pixelY = 0;
                this.lastPixelX = 0;
                this.lastPixelY = 0;
                
                this.id = data.id;
                this.sessionId = data.sessionId || null;
                this.color = data.color;
                this.isPlayer = data.isPlayer;
                this.isLocal = !!data.isLocal;
                this.isSecondaryLocal = !!data.isSecondaryLocal;
                this.slotIndex = data.slotIndex ?? -1;
                this.controlScheme = data.controlScheme || 'WASD';
                
                this.trail = [];
                this.maxTrail = 25;
                this.moveTimer = 0;
                this.moveCooldown = 70;

                this.lastMoveTime = 0;
                this.lastDx = 0;
                this.lastDy = 0;
                this.dirStreak = 0;  // consecutive cells in the same direction
                this.speedBlur = 0;  // 0–1 smoothed, drives motion-blur ghost opacity

                this.heldDirections = [];
                this.turnIntent = null;
                this.swipeIntent = null;

                this.state = 'normal'; 
                this.stateTimer = 0;
                this.targetGridX = 0;
                this.targetGridY = 0;
                this.flashTimer = 0;
                this.mirrorUntil = 0; // Date.now() timestamp until mirror controls expire for this blazer
                this.frozenUntil = 0; // Date.now() timestamp until freeze expires for this blazer
                this.beaconUntil = 0; // Date.now() timestamp until path-guide beacon expires
                
                this.bonkDx = 0;
                this.bonkDy = 0;
                this.bonkTimer = 0;

                this.radius = 0;
                this.updatePixelPos(true);
            }

            updatePixelPos(instant = false) {
                const { x: targetX, y: targetY } = gridToPixel(this.gridX, this.gridY);

                this.lastPixelX = this.pixelX;
                this.lastPixelY = this.pixelY;

                if (instant) {
                    this.pixelX = targetX;
                    this.pixelY = targetY;
                    this.lastPixelX = targetX;
                    this.lastPixelY = targetY;
                } else {
                    this.pixelX += (targetX - this.pixelX) * 0.52;
                    this.pixelY += (targetY - this.pixelY) * 0.52;
                }
            }

            canMove(dx, dy) {
                if (this.gridX + dx < 0 || this.gridX + dx >= cols || this.gridY + dy < 0 || this.gridY + dy >= rows) return false;
                const cell = grid[this.gridX][this.gridY];
                if (!cell || !cell.walls) return false;
                if (dy === -1 && !cell.walls[0]) return true; 
                if (dx === 1 && !cell.walls[1]) return true;  
                if (dy === 1 && !cell.walls[2]) return true;  
                if (dx === -1 && !cell.walls[3]) return true; 
                return false;
            }

            triggerBonk(dx, dy) {
                if (this.bonkTimer <= 0) Synth.bonk(this.isPlayer);
                this.bonkDx = dx;
                this.bonkDy = dy;
                this.bonkTimer = 1.0;
            }

            /**
             * True if this blazer should process local input / prediction on this client.
             * Covers both the primary local player and secondary co-op slots.
             */
            isActuallyLocal() {
                return (room && room.sessionId)
                    ? (this.sessionId === room.sessionId || this.isSecondaryLocal)
                    : this.isLocal;
            }

            executeMove(dx, dy) {
                if (gameState !== 'PLAYING') return;

                if (dx !== this.lastDx || dy !== this.lastDy) {
                    Synth.turn(this.isPlayer);
                    this.lastDx = dx;
                    this.lastDy = dy;
                    this.dirStreak = 0; // reset on direction change
                }
                this.dirStreak++; // 1 on first step in a direction, 3+ = max blur

                this.gridX += dx;
                this.gridY += dy;
                this.lastMoveTime = performance.now();
                
                // Authoritative local check for sending moves to server
                const isActuallyLocal = (room && room.sessionId) ? (this.sessionId === room.sessionId) : this.isLocal;
                if (room) {
                    if (isActuallyLocal) {
                        room.send("move", { x: this.gridX, y: this.gridY });
                    } else if (this.isSecondaryLocal) {
                        room.send("move_secondary", { slotIndex: this.slotIndex, x: this.gridX, y: this.gridY });
                    }
                }
            }

            update(dt) {
                const now = performance.now();

                if (this.isPlayer && this.state === 'normal' && this.isActuallyLocal() && now >= roundMoveLockEnd && Date.now() >= this.frozenUntil) {
                    if (now - this.lastMoveTime >= this.moveCooldown) {
                        let moved = false;
                        const mirrored = this.mirrorUntil > 0 && Date.now() < this.mirrorUntil;

                        // Helper: convert a stored direction string to dx/dy, flipping if mirror is active
                        const dirToDxDy = (dir) => {
                            const d = mirrored ? mirrorDir(dir) : dir;
                            if (d === 'up') return { dx: 0, dy: -1 };
                            if (d === 'right') return { dx: 1, dy: 0 };
                            if (d === 'down') return { dx: 0, dy: 1 };
                            if (d === 'left') return { dx: -1, dy: 0 };
                            return { dx: 0, dy: 0 };
                        };

                        // 1. Check Input Intent Buffer (if player pressed turn slightly before intersection)
                        if (this.turnIntent && now - this.turnIntent.time < 300) {
                            const { dx, dy } = dirToDxDy(this.turnIntent.dir);

                            if (this.canMove(dx, dy)) {
                                this.executeMove(dx, dy);
                                moved = true;

                                // Sync buffer with held directions to preserve alternating behavior
                                const idx = this.heldDirections.indexOf(this.turnIntent.dir);
                                if (idx > -1) {
                                    this.heldDirections.splice(idx, 1);
                                    if (!tapOnlyToggle.checked) {
                                        this.heldDirections.unshift(this.turnIntent.dir);
                                    }
                                }

                                this.turnIntent = null; // consume intent
                            }
                        }

                        // 2. Check currently held directions (incorporates original fast-turn / zigzag logic)
                        if (!moved) {
                            for (let i = this.heldDirections.length - 1; i >= 0; i--) {
                                const rawDir = this.heldDirections[i];
                                const { dx, dy } = dirToDxDy(rawDir);

                                if (this.canMove(dx, dy)) {
                                    this.executeMove(dx, dy);
                                    moved = true;

                                    // In tap-only mode, consume the direction so the key must be re-pressed
                                    this.heldDirections.splice(i, 1);
                                    if (!tapOnlyToggle.checked) {
                                        this.heldDirections.unshift(rawDir);
                                    }
                                    break;
                                }
                            }
                        }

                        // 3. Mobile Swipe Intent
                        if (!moved && this.swipeIntent && now - this.swipeIntent.time < 400) {
                            const sdx = mirrored ? -this.swipeIntent.dx : this.swipeIntent.dx;
                            const sdy = mirrored ? -this.swipeIntent.dy : this.swipeIntent.dy;
                            if (this.canMove(sdx, sdy)) {
                                this.executeMove(sdx, sdy);
                                this.swipeIntent = null;
                                moved = true;
                            }
                        }

                        if (!moved) {
                            let bonkDx = 0, bonkDy = 0;
                            if (this.turnIntent && now - this.turnIntent.time < 300) {
                                const { dx, dy } = dirToDxDy(this.turnIntent.dir);
                                bonkDx = dx; bonkDy = dy;
                            } else if (this.heldDirections.length > 0) {
                                const { dx, dy } = dirToDxDy(this.heldDirections[this.heldDirections.length - 1]);
                                bonkDx = dx; bonkDy = dy;
                            } else if (this.swipeIntent && now - this.swipeIntent.time < 400) {
                                bonkDx = mirrored ? -this.swipeIntent.dx : this.swipeIntent.dx;
                                bonkDy = mirrored ? -this.swipeIntent.dy : this.swipeIntent.dy;
                            }
                            
                            if (bonkDx !== 0 || bonkDy !== 0) {
                                this.triggerBonk(bonkDx, bonkDy);
                            }
                        }
                    }
                }

                if (this.state === 'teleport_out') {
                    this.stateTimer -= dt * 0.003; 
                    if (this.stateTimer <= 0) {
                        this.state = 'teleport_in';
                        this.stateTimer = 1.0;
                        this.gridX = this.targetGridX;
                        this.gridY = this.targetGridY;
                        this.updatePixelPos(true);
                        this.trail = [];
                    }
                    return; 
                } else if (this.state === 'teleport_in') {
                    this.stateTimer -= dt * 0.003;
                    if (this.stateTimer <= 0) {
                        this.state = 'normal';
                        // Wipe explorer memory so it doesn't get confused by the teleport
                        if (!this.isPlayer && this.aiBehavior === 'explorer') {
                            this.explorerLastX = null;
                            this.explorerLastY = null;
                        }
                    }
                    return; 
                }

                this.updatePixelPos();

                // Speed-blur: ramps 0→1 as dirStreak goes 1→3
                const blurTarget = Math.min(1, Math.max(0, (this.dirStreak - 1) / 2));
                this.speedBlur += (blurTarget - this.speedBlur) * 0.22;

                if (this.flashTimer > 0) this.flashTimer -= dt * 0.005;
                if (this.bonkTimer > 0) this.bonkTimer -= dt * 0.01;

                this.trail.push({ x: this.pixelX, y: this.pixelY });
                if (this.trail.length > this.maxTrail) this.trail.shift();

            }

            draw() {
                const size = cellSize * 0.216;

                // Trail
                ctx.lineWidth = size * 0.8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const isMirrored = this.mirrorUntil > 0 && Date.now() < this.mirrorUntil;
                const isFrozen   = this.frozenUntil > 0 && Date.now() < this.frozenUntil;
                if (this.trail.length > 1) {
                    ctx.save();
                    for (let i = 1; i < this.trail.length; i++) {
                        const alpha = i / this.trail.length;
                        ctx.strokeStyle = isMirrored ? '#ffffff' : this.color;
                        ctx.globalAlpha = alpha * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(this.pixelX, this.pixelY);

                // Teleport effect
                if (this.state === 'teleport_out' || this.state === 'teleport_in') {
                    const scale = this.state === 'teleport_out' ? this.stateTimer : (1 - this.stateTimer);
                    ctx.scale(scale, scale);
                    ctx.rotate(this.stateTimer * 10);
                }

                // Bonk effect
                if (this.bonkTimer > 0) {
                    const offset = Math.sin(this.bonkTimer * 20) * 5 * this.bonkTimer;
                    ctx.translate(this.bonkDx * offset, this.bonkDy * offset);
                }

                // Body — drawn three times with decreasing shadowBlur for maximum bloom
                const bodyColor = isFrozen ? '#88ddff'
                    : (this.flashTimer > 0 || isMirrored) ? '#ffffff'
                    : this.color;

                // Motion-blur ghost copies — appear after 2+ cells in the same direction
                if (this.speedBlur > 0.04 && (this.lastDx !== 0 || this.lastDy !== 0)) {
                    for (let g = 3; g >= 1; g--) {
                        const frac  = g / 3;
                        const alpha = this.speedBlur * (1 - frac * 0.6) * 0.4;
                        const offX  = -this.lastDx * cellSize * 0.30 * g;
                        const offY  = -this.lastDy * cellSize * 0.30 * g;
                        const gSize = size * (1 - g * 0.10);
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle   = bodyColor;
                        ctx.shadowBlur  = 20;
                        ctx.shadowColor = bodyColor;
                        ctx.beginPath();
                        ctx.arc(offX, offY, Math.max(gSize, 1), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur  = 0;
                    ctx.globalAlpha = 1;
                }

                ctx.fillStyle = bodyColor;
                ctx.globalAlpha = 0.75;
                for (const blur of [80, 40, 15]) {
                    ctx.shadowBlur = blur;
                    ctx.shadowColor = bodyColor;
                    ctx.beginPath();
                    ctx.arc(0, 0, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;

                // Ice crystal spikes while frozen
                if (isFrozen) {
                    const spikeCount = 6;
                    const spikeLen   = size * 1.7;
                    const now2 = Date.now();
                    ctx.lineWidth = Math.max(1, size * 0.22);
                    ctx.lineCap = 'round';
                    for (let i = 0; i < spikeCount; i++) {
                        const angle = i * Math.PI / 3 + now2 / 2200;
                        const tipX  = Math.cos(angle) * spikeLen;
                        const tipY  = Math.sin(angle) * spikeLen;
                        // Spike colour alternates white / ice-blue
                        const spikeColor = i % 2 === 0 ? '#ffffff' : '#44bbff';
                        ctx.strokeStyle  = spikeColor;
                        ctx.shadowBlur   = 8;
                        ctx.shadowColor  = '#00aaff';
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(tipX, tipY);
                        ctx.stroke();
                        // Small crossbar at 60% of the way out
                        const bx = tipX * 0.6, by = tipY * 0.6;
                        const perpA = angle + Math.PI / 2;
                        const bl = spikeLen * 0.28;
                        ctx.beginPath();
                        ctx.moveTo(bx - Math.cos(perpA) * bl, by - Math.sin(perpA) * bl);
                        ctx.lineTo(bx + Math.cos(perpA) * bl, by + Math.sin(perpA) * bl);
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                    ctx.lineCap = 'butt';
                }

                // Red outline while mirror controls are active
                if (isMirrored) {
                    ctx.beginPath();
                    ctx.arc(0, 0, size, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = Math.max(1, size * 0.28);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        const MIN_CELL_SIZE = 8;  // px — below this cells are too small to navigate
        const MAX_CELL_SIZE = 80; // px — above this cells are too large / wasteful

        function getMazeLimits() {
            const size = Math.min(gameContainer.clientWidth, gameContainer.clientHeight);
            if (size <= 0) return { min: 3, max: 999 }; // container not laid out yet — allow anything
            return {
                min: Math.max(3, Math.ceil(size / MAX_CELL_SIZE)),
                max: Math.floor(size / MIN_CELL_SIZE)
            };
        }

        function updateGridSizeInputLimits() {
            const { min, max } = getMazeLimits();
            gridSizeInput.min = min;
            gridSizeInput.max = max;
            const current = parseInt(gridSizeInput.value, 10);
            if (current < min) gridSizeInput.value = min;
            else if (current > max) gridSizeInput.value = max;
            gridSizeHint.style.display = 'none';
        }

        function clampGridSizeInput() {
            const { min, max } = getMazeLimits();
            const val = parseInt(gridSizeInput.value, 10);
            if (isNaN(val) || val < min) {
                gridSizeInput.value = min;
                gridSizeHint.textContent = `Min for your screen: ${min}`;
                gridSizeHint.style.display = 'inline';
            } else if (val > max) {
                gridSizeInput.value = max;
                gridSizeHint.textContent = `Max for your screen: ${max}`;
                gridSizeHint.style.display = 'inline';
            } else {
                gridSizeHint.style.display = 'none';
            }
        }

        function resizeCanvas() {
            let size = Math.min(gameContainer.clientWidth, gameContainer.clientHeight);
            width = size;
            height = size;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            cellSize = width / cols;
            blazers.forEach(blazer => blazer.updatePixelPos(true));
            draw(true);
        }

        function generateMaze() {
            grid = [];
            for (let x = 0; x < cols; x++) {
                grid[x] = [];
                for (let y = 0; y < rows; y++) grid[x][y] = new Cell(x, y);
            }

            // Force the goal to be a dead-end with exactly one entrance
            let goalCell = grid[goal.x][goal.y];
            goalCell.visited = true; 

            let entranceNeighbors = [];
            if (goal.y > 0) entranceNeighbors.push(grid[goal.x][goal.y - 1]);
            if (goal.x < cols - 1) entranceNeighbors.push(grid[goal.x + 1][goal.y]);
            if (goal.y < rows - 1) entranceNeighbors.push(grid[goal.x][goal.y + 1]);
            if (goal.x > 0) entranceNeighbors.push(grid[goal.x - 1][goal.y]);

            let entrance = entranceNeighbors[Math.floor(Math.random() * entranceNeighbors.length)];
            removeWalls(goalCell, entrance);

            entrance.visited = true;
            let frontier = getUnvisitedNeighbors(entrance);

            while (frontier.length > 0) {
                let randomIndex = Math.floor(Math.random() * frontier.length);
                let current = frontier[randomIndex];
                frontier.splice(randomIndex, 1);

                if (current.visited) continue;

                let visitedNeighbors = getVisitedNeighbors(current);
                if (visitedNeighbors.length > 0) {
                    let vNeighbor = visitedNeighbors[Math.floor(Math.random() * visitedNeighbors.length)];
                    removeWalls(current, vNeighbor);
                    current.visited = true;

                    let newNeighbors = getUnvisitedNeighbors(current);
                    for (let n of newNeighbors) {
                        if (!frontier.includes(n)) {
                            frontier.push(n);
                        }
                    }
                }
            }
            generateDistanceMap();
        }

        function getUnvisitedNeighbors(cell) {
            let n = [];
            let x = cell.x, y = cell.y;
            if (y > 0 && !grid[x][y - 1].visited) n.push(grid[x][y - 1]);
            if (x < cols - 1 && !grid[x + 1][y].visited) n.push(grid[x + 1][y]);
            if (y < rows - 1 && !grid[x][y + 1].visited) n.push(grid[x][y + 1]);
            if (x > 0 && !grid[x - 1][y].visited) n.push(grid[x - 1][y]);
            return n;
        }

        function getVisitedNeighbors(cell) {
            let n = [];
            let x = cell.x, y = cell.y;
            if (y > 0 && grid[x][y - 1].visited && !(x === goal.x && y - 1 === goal.y)) n.push(grid[x][y - 1]);
            if (x < cols - 1 && grid[x + 1][y].visited && !(x + 1 === goal.x && y === goal.y)) n.push(grid[x + 1][y]);
            if (y < rows - 1 && grid[x][y + 1].visited && !(x === goal.x && y + 1 === goal.y)) n.push(grid[x][y + 1]);
            if (x > 0 && grid[x - 1][y].visited && !(x - 1 === goal.x && y === goal.y)) n.push(grid[x - 1][y]);
            return n;
        }

        function removeWalls(a, b) {
            let x = a.x - b.x;
            if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
            else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }

            let y = a.y - b.y;
            if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
            else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        function generateDistanceMap() {
            distanceMap = Array(cols).fill().map(() => Array(rows).fill(Infinity));
            distanceMap[goal.x][goal.y] = 0;
            let queue = [{x: goal.x, y: goal.y}];

            while(queue.length > 0) {
                let curr = queue.shift();
                let cell = grid[curr.x][curr.y];

                if (!cell.walls[0] && distanceMap[curr.x][curr.y-1] === Infinity) { distanceMap[curr.x][curr.y-1] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y-1}); }
                if (!cell.walls[1] && distanceMap[curr.x+1][curr.y] === Infinity) { distanceMap[curr.x+1][curr.y] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x+1, y: curr.y}); }
                if (!cell.walls[2] && distanceMap[curr.x][curr.y+1] === Infinity) { distanceMap[curr.x][curr.y+1] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y+1}); }
                if (!cell.walls[3] && distanceMap[curr.x-1][curr.y] === Infinity) { distanceMap[curr.x-1][curr.y] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x-1, y: curr.y}); }
            }
        }

        function startTeleport(b) {
            if (b.state !== 'normal') return;
            b.state = 'teleport_out';
            b.stateTimer = 1.0;
            let rx = goal.x, ry = goal.y;
            
            let isValidDestination = false;
            let attempts = 0;
            while (!isValidDestination) { 
                rx = Math.floor(Math.random() * cols); 
                ry = Math.floor(Math.random() * rows); 
                isValidDestination = true;

                // Cannot teleport onto the goal
                if (rx === goal.x && ry === goal.y) isValidDestination = false;
                
                // Cannot teleport onto a power-up
                if (powerUps.some(p => p.x === rx && p.y === ry)) isValidDestination = false;

                // Ensure teleporting player is not placed within 10 cells of the goal
                if (distanceMap.length > 0 && distanceMap[rx] && distanceMap[rx][ry] !== undefined) {
                    if (attempts < 200 && distanceMap[rx][ry] <= 10) isValidDestination = false;
                }
                
                attempts++;
            }
            
            b.targetGridX = rx; b.targetGridY = ry;
        }

        function triggerTeleport(triggeringBlazer) {
            blazers.forEach(b => { if (b !== triggeringBlazer) startTeleport(b); });
        }

        // --- MATCH & ROUND LOGIC ---
        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            let millis = Math.floor(ms % 1000);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
        }

        function updateScoreboard() {
            const sorted = [...blazers].sort((a, b) => {
                const na = parseInt(a.id.replace(/\D/g, '')) || 0;
                const nb = parseInt(b.id.replace(/\D/g, '')) || 0;
                return na - nb;
            });
            // Group players by win count (capped at 2 since 3 = instant win)
            const groups = [[], [], []];
            sorted.forEach(b => {
                if (scoreHiddenIds.has(b.id)) return; // flying — hide from all columns
                const w = Math.min(scores[b.id] ?? 0, 2);
                const num = b.id.replace(/\D/g, '');
                groups[w].push(`<span style="color:${b.color}">P${num}</span>`);
            });
            // Negative delay syncs new stars to the global animation cycle,
            // preventing a visible restart every time updateScoreboard() rebuilds the DOM.
            const _s = Date.now() / 1000;
            const _spinDelay = -(_s % 6).toFixed(3);
            const _hueDelay  = -(_s % 2).toFixed(3);
            const GOAL = `<svg class="goal-star-svg" width="13" height="13" viewBox="0 0 100 100" style="vertical-align:-1px;animation-delay:${_spinDelay}s,${_hueDelay}s"><polygon points="50,4 61,36 94,36 67,56 77,87 50,68 23,87 33,56 6,36 39,36" fill="none" stroke="#00ffff" stroke-width="9"/><circle cx="50" cy="50" r="10" fill="#ffffff"/></svg>`;
            const headers = ['–', GOAL, GOAL + GOAL];
            scoreboardElement.innerHTML = headers.map((h, i) =>
                `<div class="score-col">` +
                    `<div class="score-header">${h}</div>` +
                    `<div class="score-players">${groups[i].join(', ')}</div>` +
                `</div>`
            ).join('');
        }

        // Animates a player's coloured label from one scoreboard column to the next.
        // Returns the flying DOM element (caller removes it when done).
        function animateScoreStarToNextCol(winnerId, winnerColor, oldScore, newScore) {
            const cols = scoreboardElement.querySelectorAll('.score-col');
            const oldColIdx = Math.min(oldScore, 2);
            const newColIdx = Math.min(newScore, 2);
            if (oldColIdx === newColIdx || !cols[oldColIdx] || !cols[newColIdx]) return null;

            const oldRect = cols[oldColIdx].getBoundingClientRect();
            const newRect = cols[newColIdx].getBoundingClientRect();

            const el = document.createElement('div');
            const num = winnerId.replace(/\D/g, '');
            el.innerHTML = `<span style="color:${winnerColor};font-weight:bold;font-size:14px;font-family:inherit;text-shadow:0 0 8px ${winnerColor},0 0 18px ${winnerColor}">P${num}</span>`;
            el.style.cssText = [
                'position:fixed',
                `left:${oldRect.left + oldRect.width / 2}px`,
                `top:${oldRect.top + oldRect.height / 2}px`,
                'transform:translate(-50%,-50%) scale(1.6)',
                'pointer-events:none',
                'z-index:9999',
                'transition:left 0.9s cubic-bezier(0.25,0.46,0.45,0.94),' +
                           'top 0.9s cubic-bezier(0.25,0.46,0.45,0.94),' +
                           'transform 0.9s ease'
            ].join(';');
            document.body.appendChild(el);

            // Double-rAF so the browser registers the start position before we change it
            requestAnimationFrame(() => requestAnimationFrame(() => {
                el.style.left      = `${newRect.left + newRect.width / 2}px`;
                el.style.top       = `${newRect.top  + newRect.height / 2}px`;
                el.style.transform = 'translate(-50%,-50%) scale(1)';
            }));

            return el;
        }

        function initMatch() {
            // Remove focus from any clicked UI buttons so pressing Spacebar doesn't trigger them
            if (document.activeElement) {
                document.activeElement.blur();
            }

            postMatchLayer.classList.remove('winner-pulse');

            parseLobby();
            if (activePlayersData.length === 0) return; // Need at least 1 player

            scores = {};
            activePlayersData.forEach(p => scores[p.id] = 0);
            
            matchTime = 0;
            roundTimes = []; // Clear previous match's round times
            
            initialMenu.classList.add('hidden');
            lobbyLayer.classList.add('hidden');
            postMatchLayer.classList.add('hidden');
            hud.classList.remove('hidden');
            hudBar.classList.remove('hidden');

            // Clear any leftover blazers; players are created fresh via onStateChange.
            blazers = [];
            updateScoreboard();

            initRound();
        }

        function initRound() {
            gameState = 'INITIALIZING'; // Temporarily change state to block draw() recursion
            bgTintR = bgTintG = bgTintB = 0; // reset so leader tint fades in fresh each round
            document.body.style.backgroundColor = '#000000';
            stopVictoryStars();
            stopWinnerLap();

            // Always build a local grid so drawMaze has a valid 2D array.
            // For networked play this placeholder is overwritten by the first onStateChange.
            generateMaze();

            shockwaves = [];
            particles = [];
            rockets = [];
            smokePuffs = [];
            powerUpBursts = [];
            powerUps = []; // Will be repopulated by server state
            screenShake = 0;
            
            resizeCanvas(); // Safe to resize and draw now that the new maze grid is generated!
            
            gameState = 'PLAYING';
            window.electronAPI?.setRichPresence('Racing');
            postMatchLayer.classList.add('hidden');
            lastTime = performance.now();
            roundStartTime = performance.now();
            roundRingTime = performance.now();
            roundMoveLockEnd = performance.now() + ROUND_START_MS * (2 / 3); // unlock at start of pulse 3
            roundUnlockFlashFired = false;
            Synth.muffle(false);
        }

        // Starts the 30-second SVG ring countdown shown on the post-match overlay.
        // Called when a match ends; drives the countdown button until match_reset arrives.
        function startMatchEndTimer() {
            const MATCH_END_WAIT = 30000;
            const JOIN_UNLOCK_MS  = 25000; // unlock room at 25 s → 5 s remaining
            pmJoinIntent = false;
            const btn = pmNextGameBtn;
            if (btn) {
                btn.style.display = '';
                btn.disabled = true;
                btn.style.opacity = '0.4';
                btn.style.cursor = 'not-allowed';
                btn.textContent = '30 until next game starts';
                btn.onclick = () => {
                    if (btn.disabled) return;
                    pmJoinIntent = true;
                    btn.disabled = true;
                    btn.style.cursor = 'default';
                    btn.textContent = 'Joining next game…';
                };
            }
            clearInterval(matchEndTimerInterval);
            const startTime = Date.now();
            matchEndTimerInterval = setInterval(() => {
                const elapsed  = Date.now() - startTime;
                const secsLeft = Math.max(0, Math.ceil((MATCH_END_WAIT - elapsed) / 1000));
                if (btn && !pmJoinIntent) {
                    if (elapsed >= JOIN_UNLOCK_MS) {
                        if (btn.disabled) {
                            btn.disabled = false;
                            btn.style.opacity = '1';
                            btn.style.cursor = 'pointer';
                        }
                        btn.textContent = `${secsLeft} until next game — Click now to join it`;
                    } else {
                        btn.textContent = `${secsLeft} until next game starts`;
                    }
                }
                if (elapsed >= MATCH_END_WAIT) {
                    clearInterval(matchEndTimerInterval);
                    matchEndTimerInterval = null;
                }
            }, 100);
        }

        function returnToMenu() {
            stopVictoryStars();
            stopWinnerLap();
            document.body.style.backgroundColor = '#000000';
            window.electronAPI?.closeSteamLobby();
            window.electronAPI?.setRichPresence('In Menu');
            if (typeof room !== 'undefined' && room) {
                leavingIntentionally = true;
                room.leave();
                room = null;
            }
            clearInterval(matchEndTimerInterval);
            matchEndTimerInterval = null;
            setButtonLoading(quickStartBtn, false);
            setButtonLoading(startBtn, false);
            setButtonLoading(joinFriendBtn, false);
            gameState = 'MENU';
            postMatchLayer.classList.add('hidden');
            postMatchLayer.classList.remove('winner-pulse');
            pmJoinIntent = false;
            if (pmNextGameBtn) pmNextGameBtn.style.display = 'none';
            hud.classList.add('hidden');
            hudBar.classList.add('hidden');
            lobbyLayer.classList.add('hidden');
            initialMenu.classList.remove('hidden');
            Synth.muffle(true);
            
            generateMaze();
            blazers = [];
            powerUps = [];
            particles = [];
            shockwaves = [];
            rockets = [];
            updateDpad();
            draw(true);
        }

        // --- DRAW LOOP ---
        function drawMaze() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            // Find the leader (closest blazer to goal by BFS distance) — always, from round start
            let closestBlazer = null;
            let minDist = Infinity;
            if (distanceMap.length > 0 && blazers.length > 0) {
                blazers.forEach(blazer => {
                    const d = distanceMap[blazer.gridX]?.[blazer.gridY] ?? Infinity;
                    if (d < minDist) { minDist = d; closestBlazer = blazer; }
                });
            }

            // Always-on background tint: page bg + canvas edges glow in the leader's colour
            if (closestBlazer) {
                const [tr, tg, tb] = hexToRgb(closestBlazer.color);
                bgTintR += (tr - bgTintR) * 0.08;
                bgTintG += (tg - bgTintG) * 0.08;
                bgTintB += (tb - bgTintB) * 0.08;
                // Drive the page background-color to a vivid version of the leader's colour
                const pr = Math.round(bgTintR * 0.25);
                const pg = Math.round(bgTintG * 0.25);
                const pb = Math.round(bgTintB * 0.25);
                document.body.style.backgroundColor = `rgb(${pr},${pg},${pb})`;
                // Vignette on the canvas edges
                const grad = ctx.createRadialGradient(
                    width / 2, height / 2, Math.min(width, height) * 0.22,
                    width / 2, height / 2, Math.max(width, height) * 0.88
                );
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(1, `rgba(${Math.round(bgTintR)},${Math.round(bgTintG)},${Math.round(bgTintB)},0.28)`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
            }

            // Tension pulse: scales with maze size — starts cols cells away, dramatic by 10% of cols
            if (closestBlazer && minDist <= cols && gameState === 'PLAYING') {
                // Cubic curve: barely visible far out, rockets up in the final 10% of distance
                const tension = Math.pow(1 - minDist / cols, 3);
                const aboutToWin = (scores[closestBlazer.id] ?? 0) >= 2;
                const maxAlpha = aboutToWin ? 0.80 : 0.58;
                // Pulse rate accelerates as blazer closes in (120ms → 55ms)
                const pulseSpeed = aboutToWin ? 55 : Math.max(55, 120 - tension * 65);
                const pulse = (Math.sin(performance.now() / pulseSpeed) + 1) / 2;
                ctx.fillStyle = closestBlazer.color;
                ctx.globalAlpha = tension * pulse * maxAlpha;
                ctx.fillRect(0, 0, width, height);
                ctx.globalAlpha = 1.0;
            }

            ctx.strokeStyle = colors.wall;
            ctx.lineWidth = 4;
            ctx.lineCap = 'square';
            
            ctx.beginPath();
            if (grid && grid.length > 0) {
                for (let x = 0; x < cols; x++) {
                    for (let y = 0; y < rows; y++) {
                        const cell = grid[x][y];
                        if (!cell || !cell.walls) continue;
                        
                        let cx = x * cellSize, cy = y * cellSize;
                        // Walls: [top, right, bottom, left]
                        if (cell.walls[0]) { ctx.moveTo(cx, cy); ctx.lineTo(cx + cellSize, cy); }
                        if (cell.walls[1]) { ctx.moveTo(cx + cellSize, cy); ctx.lineTo(cx + cellSize, cy + cellSize); }
                        if (cell.walls[2]) { ctx.moveTo(cx, cy + cellSize); ctx.lineTo(cx + cellSize, cy + cellSize); }
                        if (cell.walls[3]) { ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + cellSize); }
                    }
                }
            }
            ctx.stroke();
            
            const { x: gx, y: gy } = gridToPixel(goal.x, goal.y);
            const time = performance.now() / 500;
            
            ctx.save();
            ctx.translate(gx, gy);

            // Tiny mini-stars floating around the main star
            const miniCount = 5;
            for (let i = 0; i < miniCount; i++) {
                const phase    = (i / miniCount) * Math.PI * 2;
                const orbitR   = cellSize * (0.47 + (i % 2) * 0.06); // alternate inner/outer ring, close to star
                const wobble   = Math.sin(time * 1.5 + phase * 2) * cellSize * 0.035; // gentle float
                const orbitAng = phase + time * (0.65 + i * 0.07);   // each orbits at its own speed
                const mx = Math.cos(orbitAng) * (orbitR + wobble);
                const my = Math.sin(orbitAng) * (orbitR + wobble);
                const mOuter = cellSize * (0.053 + Math.sin(time * 2.2 + phase) * 0.007);
                const mInner = mOuter * 0.4;
                const mHue   = ((time * 120) + i * 72) % 360;
                ctx.save();
                ctx.translate(mx, my);
                ctx.rotate(time * 3 * (i % 2 === 0 ? 1 : -1));
                ctx.beginPath();
                for (let j = 0; j < 10; j++) {
                    const a = j * Math.PI / 5 - Math.PI / 2;
                    const r = j % 2 === 0 ? mOuter : mInner;
