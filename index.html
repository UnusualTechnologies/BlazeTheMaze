<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaze the Maze</title>
    <script src="https://unpkg.com/@colyseus/sdk@0.17.0/dist/colyseus.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            transition: filter 0.1s;
            /* Respect notch / home bar on iOS and Android */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* All viewports: canvas centred in a column, controls above and below */
        #main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: 100%;
            height: 100%;
            padding: clamp(10px, 2vh, 20px);
            box-sizing: border-box;
        }

        /* Top bar: audio controls on the left, menu button on the right */
        #hud-bar {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: min(85vmin, calc(100vh - 280px));
            max-width: 100%;
            flex-shrink: 0;
            z-index: 5;
            transition: opacity 0.3s;
        }

        /* Bottom controls: 2-col grid
           Left  col: friend-code (row 1) | scoreboard (row 2)
           Right col: timer       (row 1) | dpad       (row 2)  */
        #hud {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            width: min(85vmin, calc(100vh - 280px));
            max-width: 100%;
            gap: 8px;
            flex-shrink: 0;
            margin-top: 0;
            z-index: 5;
            transition: opacity 0.3s;
            align-items: start;
        }

        #timer      { grid-column: 1; grid-row: 1; }
        #scoreboard { grid-column: 1; grid-row: 2; }
        #dpad       { grid-column: 2; grid-row: 1 / span 2; align-self: stretch; }

        .hud-buttons {
            display: flex;
            gap: 5px;
        }
        
        #timer {
            font-size: clamp(1.4rem, 3.5vw, 2.5rem);
            font-weight: bold;
            color: #fff;
            font-family: monospace;
            text-shadow: 0 0 5px #000, 0 0 10px #000;
        }
        
        #scoreboard {
            display: flex;
            flex-direction: row;
            color: #fff;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 10px 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }

        .score-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }


        .score-col + .score-col {
            border-left: 1px solid rgba(255,255,255,0.2);
        }

        .score-header {
            font-size: 0.9rem;
            width: 100%;
            text-align: center;
            padding-bottom: 4px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            min-height: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-players {
            font-size: 0.8rem;
            line-height: 1.5;
            text-align: center;
            word-break: break-word;
            padding: 0 4px;
        }

        #friend-code-hud {
            font-family: monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 8px;
        }

        #game-container {
            position: relative;
            flex-shrink: 0;
            width: min(85vmin, calc(100vh - 280px));
            max-width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
            background: #000000;
            overflow: hidden;
            transition: filter 0.1s;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.3s, background-color 0.5s;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* Celebratory pulse effect for match winner */
        @keyframes winnerPulse {
            0% { box-shadow: inset 0 0 30px var(--winner-color); background-color: rgba(0, 0, 0, 0.95); }
            50% { box-shadow: inset 0 0 150px var(--winner-color); background-color: rgba(0, 0, 0, 0.80); }
            100% { box-shadow: inset 0 0 30px var(--winner-color); background-color: rgba(0, 0, 0, 0.95); }
        }

        .winner-pulse {
            animation: winnerPulse 2s infinite ease-in-out;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 3rem);
            margin-bottom: 1rem;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            color: #fff;
            text-align: center;
        }

        p.subtitle {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: #aaa;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
        }

        .menu-friend-code {
            font-family: monospace;
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        /* Post-Match Statistics Customization */
        .pm-buttons-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        .pm-buttons-vertical button {
            width: 100%;
            margin: 0;
        }

        .stats-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .scrollable-rounds {
            overflow-y: auto;
            max-height: 150px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-family: monospace;
            font-size: 1rem;
            color: #ddd;
            text-align: left;
            line-height: 1.8;
        }

        /* Lobby Grid Styles */
        #slots-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            overflow-y: auto;
            max-height: 50vh;
            padding-right: 5px;
        }

        .player-slot {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .player-slot.inactive {
            opacity: 0.5;
            border-color: transparent;
        }

        .slot-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .color-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        select, input[type="number"] {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
        }

        select:focus, input[type="number"]:focus {
            border-color: #00ffff;
        }

        button.action-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #050510;
            background: #00ffff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #00ffff;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            margin: 5px;
        }

        button.action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff;
        }

        button.secondary-btn {
            background: #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
        }
        
        button.secondary-btn:hover {
            box-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff;
        }

        button.tertiary-btn {
            background: #39ff14;
            box-shadow: 0 0 20px #39ff14;
        }
        
        button.tertiary-btn:hover {
            box-shadow: 0 0 30px #39ff14, 0 0 60px #39ff14;
        }

        /* Muted state specifically for the UI audio button */
        button.action-btn.muted {
            background: #555 !important;
            box-shadow: 0 0 10px #555 !important;
            color: #aaa !important;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .join-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .join-group input[type="text"] {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            font-family: monospace;
            outline: none;
            width: 120px;
            text-align: center;
            text-transform: uppercase;
        }

        .join-group input[type="text"]::placeholder {
            color: rgba(255,255,255,0.3);
            text-transform: none;
        }

        .join-group button {
            padding: 10px 25px;
            font-size: 1rem;
            margin: 0;
        }

        .lobby-settings-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #version-number { display: none; }

        .ver-text {
            font-family: monospace;
            font-size: 0.75rem;
            color: rgba(0, 255, 255, 0.6);
            white-space: nowrap;
            flex-shrink: 0;
        }

        #hud-bar .ver-text {
            margin-right: 8px;
        }

        .audio-controls {
            display: flex;
            gap: 8px;
        }

        .audio-btn {
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: #00ffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
        }

        .audio-btn:hover {
            box-shadow: 0 0 16px rgba(0, 255, 255, 0.5);
        }

        .audio-btn svg.icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .audio-btn .slash {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .audio-btn.muted {
            color: #555;
            border-color: rgba(80, 80, 80, 0.4);
            box-shadow: none;
        }

        .audio-btn.muted .slash {
            display: block;
        }

        #dpad {
            display: grid;
            grid-template-areas: ". up ." "left down right";
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 60px);
            align-content: center;
            gap: 8px;
            width: 100%;
            padding: 6px 0;
        }

        #dpad.hidden { display: none; }

        .dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background 0.07s, transform 0.07s, border-bottom-width 0.07s;
        }

        .dpad-btn[data-dir="up"]    { grid-area: up; }
        .dpad-btn[data-dir="left"]  { grid-area: left; }
        .dpad-btn[data-dir="right"] { grid-area: right; }
        .dpad-btn[data-dir="down"]  { grid-area: down; }

        .dpad-btn.pressed {
            background: rgba(0, 255, 255, 0.15);
            border-color: rgba(0, 255, 255, 0.45);
            color: #00ffff;
            transform: translateY(2px);
        }

        /* Lobby slots go single-column below 600px */
        @media (max-width: 600px) {
            #slots-container { grid-template-columns: 1fr; }
        }

        /* Mobile / Portrait — layout is already column from desktop styles.
           Only override: menus go full-screen, lobby scrolls from top. */
        @media (max-width: 900px), (max-aspect-ratio: 1/1) {
            #slots-container { grid-template-columns: 1fr; }

            /* Menus cover full viewport (not just the canvas square) */
            .menu-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                height: auto;
                z-index: 1000;
            }

            /* Lobby has lots of content — start from top and scroll */
            #lobby-layer {
                justify-content: flex-start;
                padding-top: max(24px, env(safe-area-inset-top));
            }

            /* Join code input fills available space */
            .join-group { width: 90%; }
            .join-group input[type="text"] { flex: 1; width: auto; min-width: 80px; }
        }

        /* Extra-small phones (≤ 480px) */
        @media (max-width: 480px) {
            .menu-overlay { padding: 12px; }

            button.action-btn {
                padding: 12px 28px;
                font-size: 1rem;
            }

            .lobby-settings-panel > div {
                flex-wrap: wrap;
            }

            #scoreboard {
                font-size: 0.78rem;
                padding: 6px;
            }
        }

        #menu-title {
            color: #fff; font-size: 3.5em; font-style: italic; font-weight: 900;
            letter-spacing: 4px; text-transform: uppercase;
            transform: skewX(-20deg);
            transform-origin: left center;
            text-shadow:
                -5px   0px  0px rgba(255,120,120,0.60),
                -11px -1px  0px rgba(255, 70, 70,0.50),
                -18px -2px  0px rgba(240, 40, 40,0.40),
                -27px -3px  0px rgba(210, 20, 20,0.30),
                -38px -4px  0px rgba(180, 10, 10,0.22),
                -51px -5px  0px rgba(150,  5,  5,0.15),
                -67px -7px  0px rgba(120,  2,  2,0.10),
                -90px  -9px 25px rgba(200,  0,  0,0.12),
               -150px -15px 45px rgba(100,  0,  0,0.08);
            margin: 0; padding: 0 30px; flex-shrink: 0; align-self: flex-start;
        }
        #menu-mini-canvas {
            display: block;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div id="version-number">v1.5.33</div>

    <div id="main-wrapper">
        <!-- Top bar: audio controls (left) + menu button (right), above the canvas -->
        <div id="hud-bar" class="hidden">
            <div class="audio-controls">
                <button class="audio-btn music-btn" title="Toggle Music">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                    <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
                <button class="audio-btn sfx-btn" title="Toggle Sound Effects">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div id="friend-code-hud">Friend code:<br><span class="display-friend-code" style="color: #00ffff; font-weight: bold;"></span></div>
            <span class="ver-text"></span>
            <div class="hud-buttons">
                <button class="action-btn secondary-btn" id="in-game-menu-btn" style="padding: 10px; font-size: 0.9rem; flex: 1; margin: 0;">Menu</button>
            </div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <!-- This menu now ONLY appears when the entire match is over -->
            <div id="post-match-layer" class="menu-overlay hidden">
                <h1 id="pm-title">Match Over</h1>
                
                <div class="pm-buttons-vertical">
                    <button class="action-btn" id="play-again-btn">Play Again</button>
                    <button class="action-btn secondary-btn" id="menu-btn">Main Menu</button>
                </div>

                <div class="stats-container">
                    <p class="subtitle" id="pm-subtitle" style="margin-bottom: 0;"></p>
                    <div id="pm-round-times" class="scrollable-rounds">
                        <!-- Round times dynamically added here -->
                    </div>
                </div>
            </div>

            <!-- Initial Main Menu -->
            <div id="initial-menu" class="menu-overlay">
                <span class="ver-text"></span>
                <div class="audio-controls">
                    <button class="audio-btn music-btn" title="Toggle Music">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                        <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </button>
                    <button class="audio-btn sfx-btn" title="Toggle Sound Effects">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                        <svg class="slash" viewBox="0 0 40 40"><line x1="31" y1="7" x2="9" y2="33" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <h1 id="menu-title">BLAZE THE MAZE</h1>
                <canvas id="menu-mini-canvas" width="550" height="150"></canvas>
                <button class="action-btn" id="quick-start-btn">Race!</button>

                <button class="action-btn tertiary-btn" id="custom-settings-btn">Custom</button>

                <div class="join-group">
                    <input type="text" id="join-code-input" placeholder="Code..." maxlength="12" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" style="text-transform: uppercase;">
                    <button class="action-btn secondary-btn" id="join-friend-btn">Join Friend</button>
                </div>
            </div>

            <!-- Custom Lobby Menu -->
            <div id="lobby-layer" class="menu-overlay hidden">
                <h1>Custom Game</h1>
                <div id="slots-container">
                    <!-- Slots dynamically generated -->
                </div>
                
                <!-- Match Settings Toggle -->
                <div class="lobby-settings-panel">
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <label for="grid-size-input" style="font-size: 1.2rem;">Grid Size:</label>
                        <input type="number" id="grid-size-input" value="20" min="5" max="100" inputmode="numeric" style="font-size: 1.1rem; padding: 5px; width: 80px; text-align: center;">
                        <span id="grid-size-hint" style="font-size: 0.85rem; color: #ff6666; display: none;"></span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="pu-opp-input" style="font-size: 1.2rem;">Orbs (Teleport Others):</label>
                        <input type="number" id="pu-opp-input" value="10" min="0" max="100" inputmode="numeric" style="font-size: 1.1rem; padding: 5px; width: 80px; text-align: center;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="pu-self-input" style="font-size: 1.2rem;">Holes (Teleport Self):</label>
                        <input type="number" id="pu-self-input" value="10" min="0" max="100" inputmode="numeric" style="font-size: 1.1rem; padding: 5px; width: 80px; text-align: center;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="collisions-toggle" checked style="width: 20px; height: 20px; cursor: pointer;"> 
                        <label for="collisions-toggle" style="font-size: 1.2rem; cursor: pointer; user-select: none;">Enable Collisions</label>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="action-btn secondary-btn" id="lobby-back-btn">Back</button>
                    <button class="action-btn" id="start-btn">Race!</button>
                </div>
            </div>
        </div>

        <!-- Bottom controls: timer + scoreboard (left) | dpad (right, spans both rows) -->
        <div id="hud" class="hidden">
            <div id="timer">00:00.000</div>
            <div id="scoreboard"></div>
            <div id="dpad" class="hidden">
                <button class="dpad-btn" data-dir="up">▲</button>
                <button class="dpad-btn" data-dir="left">◀</button>
                <button class="dpad-btn" data-dir="down">▼</button>
                <button class="dpad-btn" data-dir="right">▶</button>
            </div>
        </div>
    </div>

    <script>
        // --- BULLETPROOF AUDIO SYSTEM ---
        const Synth = {
            ctx: { state: 'running', resume: () => {} }, // Keep dummy for legacy UI code
            isMusicMuted: true,
            isSfxMuted: true,
            bgMusic: new Audio('./assets/audio/music.ogg'),
            init() {
                this.bgMusic.loop = true;
                this.bgMusic.volume = 0.4;

        // --- ENTITY CLASSES ---
        class Cell {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.walls = [true, true, true, true]; 
                this.visited = false;
            }
        }

        class Shockwave {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.life = 1.0;
                this.maxRadius = cellSize * 4;
            }
            update(dt) {
                this.life -= dt * 0.002; 
                return this.life > 0;
            }
            draw() {
                const currentRadius = (1 - this.life) * this.maxRadius;
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.life * 8;
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                // Faster and more dramatic burst speed for stronger visual impact
                const speed = (Math.random() * 15 + 4) * (cellSize * 0.02); 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01; 
                this.size = Math.random() * (cellSize * 0.25) + 2;
            }
            update(dt) {
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.x += this.vx * (dt * 0.05);
                this.y += this.vy * (dt * 0.05);
                this.life -= this.decay * (dt * 0.05);
                return this.life > 0;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }
        
        class Rocket {
            constructor(x, y, color, ownerBlazer) {
                this.gridX = x;
                this.gridY = y;
                this.pixelX = x * cellSize + cellSize / 2;
                this.pixelY = y * cellSize + cellSize / 2;
                this.color = color;
                this.owner = ownerBlazer;
                this.moveTimer = 0;
                this.moveInterval = 100; // Zooms at 100ms per square
                this.life = true;
                this.angle = 0;
                this.stepsTaken = 0;
            }

            update(dt) {
                this.moveTimer += dt;
                
                // Smooth visual following
                const targetX = this.gridX * cellSize + cellSize / 2;
                const targetY = this.gridY * cellSize + cellSize / 2;
                this.pixelX += (targetX - this.pixelX) * 0.4;
                this.pixelY += (targetY - this.pixelY) * 0.4;

                if (this.moveTimer >= this.moveInterval) {
                    this.moveTimer = 0;
                    this.step();
                }
                return this.life;
            }

            step() {
                if (this.gridX === goal.x && this.gridY === goal.y) {
                    this.life = false;
                    for(let i=0; i<20; i++) particles.push(new Particle(this.pixelX, this.pixelY, this.color));
                    return;
                }

                const currDist = distanceMap[this.gridX][this.gridY];
                let bestMove = null;
                let minDist = currDist;
                
                const cell = grid[this.gridX][this.gridY];

                if (!cell.walls[0] && distanceMap[this.gridX][this.gridY-1] < minDist) { bestMove = {dx: 0, dy: -1}; minDist = distanceMap[this.gridX][this.gridY-1]; }
                if (!cell.walls[1] && distanceMap[this.gridX+1][this.gridY] < minDist) { bestMove = {dx: 1, dy: 0}; minDist = distanceMap[this.gridX+1][this.gridY]; }
                if (!cell.walls[2] && distanceMap[this.gridX][this.gridY+1] < minDist) { bestMove = {dx: 0, dy: 1}; minDist = distanceMap[this.gridX][this.gridY+1]; }
                if (!cell.walls[3] && distanceMap[this.gridX-1][this.gridY] < minDist) { bestMove = {dx: -1, dy: 0}; minDist = distanceMap[this.gridX-1][this.gridY]; }

                if (bestMove) {
                    this.gridX += bestMove.dx;
                    this.gridY += bestMove.dy;
                    this.angle = Math.atan2(bestMove.dy, bestMove.dx);
                    this.stepsTaken++;
                } else {
                    this.life = false;
                }

                // Check collision with blazers on the way
                blazers.forEach(b => {
                    if (b.gridX === this.gridX && b.gridY === this.gridY && b.state === 'normal') {
                        // Don't hit yourself on the exact frame it launches
                        if (b === this.owner && this.stepsTaken === 0) return;
                        
                        startTeleport(b);
                        screenShake = 10;
                        for(let i=0; i<15; i++) particles.push(new Particle(this.pixelX, this.pixelY, this.color));
                    }
                });

                if (this.gridX === goal.x && this.gridY === goal.y) {
                    this.life = false;
                    for(let i=0; i<20; i++) particles.push(new Particle(this.pixelX, this.pixelY, this.color));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.pixelX, this.pixelY);
                ctx.rotate(this.angle + Math.PI / 2); // Point triangle in direction of travel
                ctx.beginPath();
                ctx.moveTo(0, -cellSize * 0.4);
                ctx.lineTo(cellSize * 0.25, cellSize * 0.25);
                ctx.lineTo(0, cellSize * 0.1);
                ctx.lineTo(-cellSize * 0.25, cellSize * 0.25);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Blazer {
            constructor(data) {
                const pos = getStartPos(data.startIndex || 0);
                this.gridX = data.x !== undefined ? data.x : pos.x;
                this.gridY = data.y !== undefined ? data.y : pos.y;
                this.pixelX = 0;
                this.pixelY = 0;
                this.lastPixelX = 0;
                this.lastPixelY = 0;
                
                this.id = data.id;
                this.sessionId = data.sessionId || null;
                this.color = data.color;
                this.isPlayer = data.isPlayer;
                this.isLocal = !!data.isLocal;
                this.isSecondaryLocal = !!data.isSecondaryLocal;
                this.slotIndex = data.slotIndex ?? -1;
                this.controlScheme = data.controlScheme || 'WASD';
                
                this.trail = [];
                this.maxTrail = 25;
                this.moveTimer = 0;
                this.moveCooldown = 70;

                this.lastMoveTime = 0;
                this.lastDx = 0;
                this.lastDy = 0;

                this.heldDirections = [];
                this.turnIntent = null;
                this.swipeIntent = null;

                this.state = 'normal'; 
                this.stateTimer = 0;
                this.targetGridX = 0;
                this.targetGridY = 0;
                this.flashTimer = 0;
                
                this.bonkDx = 0;
                this.bonkDy = 0;
                this.bonkTimer = 0;

                this.radius = 0;
                this.updatePixelPos(true);
            }

            updatePixelPos(instant = false) {
                const targetX = this.gridX * cellSize + cellSize / 2;
                const targetY = this.gridY * cellSize + cellSize / 2;
                
                this.lastPixelX = this.pixelX;
                this.lastPixelY = this.pixelY;

                if (instant) {
                    this.pixelX = targetX;
                    this.pixelY = targetY;
                    this.lastPixelX = targetX;
                    this.lastPixelY = targetY;
                } else {
                    this.pixelX += (targetX - this.pixelX) * 0.4;
                    this.pixelY += (targetY - this.pixelY) * 0.4;
                }
            }

            canMove(dx, dy) {
                if (this.gridX + dx < 0 || this.gridX + dx >= cols || this.gridY + dy < 0 || this.gridY + dy >= rows) return false;
                const cell = grid[this.gridX][this.gridY];
                if (!cell || !cell.walls) return false;
                if (dy === -1 && !cell.walls[0]) return true; 
                if (dx === 1 && !cell.walls[1]) return true;  
                if (dy === 1 && !cell.walls[2]) return true;  
                if (dx === -1 && !cell.walls[3]) return true; 
                return false;
            }

            triggerBonk(dx, dy) {
                if (this.bonkTimer <= 0) Synth.bonk(this.isPlayer);
                this.bonkDx = dx;
                this.bonkDy = dy;
                this.bonkTimer = 1.0;
            }

            executeMove(dx, dy) {
                if (gameState !== 'PLAYING') return;

                if (dx !== this.lastDx || dy !== this.lastDy) {
                    Synth.turn(this.isPlayer);
                    this.lastDx = dx;
                    this.lastDy = dy;
                }

                this.gridX += dx;
                this.gridY += dy;
                this.lastMoveTime = performance.now();
                
                // Authoritative local check for sending moves to server
                const isActuallyLocal = (room && room.sessionId) ? (this.sessionId === room.sessionId) : this.isLocal;
                if (room) {
                    if (isActuallyLocal) {
                        room.send("move", { x: this.gridX, y: this.gridY });
                    } else if (this.isSecondaryLocal) {
                        room.send("move_secondary", { slotIndex: this.slotIndex, x: this.gridX, y: this.gridY });
                    }
                }
            }

            update(dt) {
                const now = performance.now();

                // Authoritative local check for movement prediction
                const isActuallyLocal = (room && room.sessionId)
                    ? (this.sessionId === room.sessionId || this.isSecondaryLocal)
                    : this.isLocal;

                if (this.isPlayer && this.state === 'normal' && isActuallyLocal) {
                    if (now - this.lastMoveTime >= this.moveCooldown) {
                        let moved = false;
                        
                        // 1. Check Input Intent Buffer (if player pressed turn slightly before intersection)
                        if (this.turnIntent && now - this.turnIntent.time < 300) {
                            let dx = 0, dy = 0;
                            if (this.turnIntent.dir === 'up') dy = -1;
                            else if (this.turnIntent.dir === 'right') dx = 1;
                            else if (this.turnIntent.dir === 'down') dy = 1;
                            else if (this.turnIntent.dir === 'left') dx = -1;

                            if (this.canMove(dx, dy)) {
                                this.executeMove(dx, dy);
                                moved = true;
                                
                                // Sync buffer with held directions to preserve alternating behavior
                                const idx = this.heldDirections.indexOf(this.turnIntent.dir);
                                if (idx > -1) {
                                    this.heldDirections.splice(idx, 1);
                                    this.heldDirections.unshift(this.turnIntent.dir);
                                }
                                
                                this.turnIntent = null; // consume intent
                            }
                        }

                        // 2. Check currently held directions (incorporates original fast-turn / zigzag logic)
                        if (!moved) {
                            for (let i = this.heldDirections.length - 1; i >= 0; i--) {
                                const dir = this.heldDirections[i];
                                let dx = 0, dy = 0;
                                if (dir === 'up') dy = -1;
                                else if (dir === 'right') dx = 1;
                                else if (dir === 'down') dy = 1;
                                else if (dir === 'left') dx = -1;

                                if (this.canMove(dx, dy)) {
                                    this.executeMove(dx, dy);
                                    moved = true;
                                    
                                    // Deprioritize the successfully executed direction by moving it to the start of the array
                                    this.heldDirections.splice(i, 1);
                                    this.heldDirections.unshift(dir);
                                    break; 
                                }
                            }
                        }

                        // 3. Mobile Swipe Intent
                        if (!moved && this.swipeIntent && now - this.swipeIntent.time < 400) {
                            if (this.canMove(this.swipeIntent.dx, this.swipeIntent.dy)) {
                                this.executeMove(this.swipeIntent.dx, this.swipeIntent.dy);
                                this.swipeIntent = null; 
                                moved = true;
                            }
                        }

                        if (!moved) {
                            let bonkDx = 0, bonkDy = 0;
                            if (this.turnIntent && now - this.turnIntent.time < 300) {
                                if (this.turnIntent.dir === 'up') bonkDy = -1;
                                else if (this.turnIntent.dir === 'right') bonkDx = 1;
                                else if (this.turnIntent.dir === 'down') bonkDy = 1;
                                else if (this.turnIntent.dir === 'left') bonkDx = -1;
                            } else if (this.heldDirections.length > 0) {
                                const dir = this.heldDirections[this.heldDirections.length - 1]; 
                                if (dir === 'up') bonkDy = -1;
                                else if (dir === 'right') bonkDx = 1;
                                else if (dir === 'down') bonkDy = 1;
                                else if (dir === 'left') bonkDx = -1;
                            } else if (this.swipeIntent && now - this.swipeIntent.time < 400) {
                                bonkDx = this.swipeIntent.dx;
                                bonkDy = this.swipeIntent.dy;
                            }
                            
                            if (bonkDx !== 0 || bonkDy !== 0) {
                                this.triggerBonk(bonkDx, bonkDy);
                            }
                        }
                    }
                }

                if (this.state === 'teleport_out') {
                    this.stateTimer -= dt * 0.003; 
                    if (this.stateTimer <= 0) {
                        this.state = 'teleport_in';
                        this.stateTimer = 1.0;
                        this.gridX = this.targetGridX;
                        this.gridY = this.targetGridY;
                        this.updatePixelPos(true);
                        this.trail = [];
                    }
                    return; 
                } else if (this.state === 'teleport_in') {
                    this.stateTimer -= dt * 0.003;
                    if (this.stateTimer <= 0) {
                        this.state = 'normal';
                        // Wipe explorer memory so it doesn't get confused by the teleport
                        if (!this.isPlayer && this.aiBehavior === 'explorer') {
                            this.explorerLastX = null;
                            this.explorerLastY = null;
                        }
                    }
                    return; 
                }

                this.updatePixelPos();

                if (this.flashTimer > 0) this.flashTimer -= dt * 0.005;
                if (this.bonkTimer > 0) this.bonkTimer -= dt * 0.01;

                this.trail.push({ x: this.pixelX, y: this.pixelY });
                if (this.trail.length > this.maxTrail) this.trail.shift();

            }

            draw() {
                const size = cellSize * 0.216;

                // Trail
                ctx.lineWidth = size * 0.8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (this.trail.length > 1) {
                    ctx.save();
                    for (let i = 1; i < this.trail.length; i++) {
                        const alpha = i / this.trail.length;
                        ctx.strokeStyle = this.color;
                        ctx.globalAlpha = alpha * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(this.pixelX, this.pixelY);

                // Teleport effect
                if (this.state === 'teleport_out' || this.state === 'teleport_in') {
                    const scale = this.state === 'teleport_out' ? this.stateTimer : (1 - this.stateTimer);
                    ctx.scale(scale, scale);
                    ctx.rotate(this.stateTimer * 10);
                }

                // Bonk effect
                if (this.bonkTimer > 0) {
                    const offset = Math.sin(this.bonkTimer * 20) * 5 * this.bonkTimer;
                    ctx.translate(this.bonkDx * offset, this.bonkDy * offset);
                }

                // Body — drawn three times with decreasing shadowBlur for maximum bloom
                const bodyColor = this.flashTimer > 0 ? '#ffffff' : this.color;
                ctx.fillStyle = bodyColor;
                ctx.globalAlpha = 0.75;
                for (const blur of [80, 40, 15]) {
                    ctx.shadowBlur = blur;
                    ctx.shadowColor = bodyColor;
                    ctx.beginPath();
                    ctx.arc(0, 0, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;

                ctx.restore();
            }
        }

        const MIN_CELL_SIZE = 8;  // px — below this cells are too small to navigate
        const MAX_CELL_SIZE = 80; // px — above this cells are too large / wasteful

        function getMazeLimits() {
            const size = Math.min(gameContainer.clientWidth, gameContainer.clientHeight);
            if (size <= 0) return { min: 3, max: 999 }; // container not laid out yet — allow anything
            return {
                min: Math.max(3, Math.ceil(size / MAX_CELL_SIZE)),
                max: Math.floor(size / MIN_CELL_SIZE)
            };
        }

        function updateGridSizeInputLimits() {
            const { min, max } = getMazeLimits();
            gridSizeInput.min = min;
            gridSizeInput.max = max;
            const current = parseInt(gridSizeInput.value, 10);
            if (current < min) gridSizeInput.value = min;
            else if (current > max) gridSizeInput.value = max;
            gridSizeHint.style.display = 'none';
        }

        function clampGridSizeInput() {
            const { min, max } = getMazeLimits();
            const val = parseInt(gridSizeInput.value, 10);
            if (isNaN(val) || val < min) {
                gridSizeInput.value = min;
                gridSizeHint.textContent = `Min for your screen: ${min}`;
                gridSizeHint.style.display = 'inline';
            } else if (val > max) {
                gridSizeInput.value = max;
                gridSizeHint.textContent = `Max for your screen: ${max}`;
                gridSizeHint.style.display = 'inline';
            } else {
                gridSizeHint.style.display = 'none';
            }
        }

        function resizeCanvas() {
            let size = Math.min(gameContainer.clientWidth, gameContainer.clientHeight);
            width = size;
            height = size;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            cellSize = width / cols;
            blazers.forEach(blazer => blazer.updatePixelPos(true));
            draw(true);
        }

        function generateMaze() {
            grid = [];
            for (let x = 0; x < cols; x++) {
                grid[x] = [];
                for (let y = 0; y < rows; y++) grid[x][y] = new Cell(x, y);
            }

            // Force the goal to be a dead-end with exactly one entrance
            let goalCell = grid[goal.x][goal.y];
            goalCell.visited = true; 

            let entranceNeighbors = [];
            if (goal.y > 0) entranceNeighbors.push(grid[goal.x][goal.y - 1]);
            if (goal.x < cols - 1) entranceNeighbors.push(grid[goal.x + 1][goal.y]);
            if (goal.y < rows - 1) entranceNeighbors.push(grid[goal.x][goal.y + 1]);
            if (goal.x > 0) entranceNeighbors.push(grid[goal.x - 1][goal.y]);

            let entrance = entranceNeighbors[Math.floor(Math.random() * entranceNeighbors.length)];
            removeWalls(goalCell, entrance);

            entrance.visited = true;
            let frontier = getUnvisitedNeighbors(entrance);

            while (frontier.length > 0) {
                let randomIndex = Math.floor(Math.random() * frontier.length);
                let current = frontier[randomIndex];
                frontier.splice(randomIndex, 1);

                if (current.visited) continue;

                let visitedNeighbors = getVisitedNeighbors(current);
                if (visitedNeighbors.length > 0) {
                    let vNeighbor = visitedNeighbors[Math.floor(Math.random() * visitedNeighbors.length)];
                    removeWalls(current, vNeighbor);
                    current.visited = true;

                    let newNeighbors = getUnvisitedNeighbors(current);
                    for (let n of newNeighbors) {
                        if (!frontier.includes(n)) {
                            frontier.push(n);
                        }
                    }
                }
            }
            generateDistanceMap();
        }

        function getUnvisitedNeighbors(cell) {
            let n = [];
            let x = cell.x, y = cell.y;
            if (y > 0 && !grid[x][y - 1].visited) n.push(grid[x][y - 1]);
            if (x < cols - 1 && !grid[x + 1][y].visited) n.push(grid[x + 1][y]);
            if (y < rows - 1 && !grid[x][y + 1].visited) n.push(grid[x][y + 1]);
            if (x > 0 && !grid[x - 1][y].visited) n.push(grid[x - 1][y]);
            return n;
        }

        function getVisitedNeighbors(cell) {
            let n = [];
            let x = cell.x, y = cell.y;
            if (y > 0 && grid[x][y - 1].visited && !(x === goal.x && y - 1 === goal.y)) n.push(grid[x][y - 1]);
            if (x < cols - 1 && grid[x + 1][y].visited && !(x + 1 === goal.x && y === goal.y)) n.push(grid[x + 1][y]);
            if (y < rows - 1 && grid[x][y + 1].visited && !(x === goal.x && y + 1 === goal.y)) n.push(grid[x][y + 1]);
            if (x > 0 && grid[x - 1][y].visited && !(x - 1 === goal.x && y === goal.y)) n.push(grid[x - 1][y]);
            return n;
        }

        function removeWalls(a, b) {
            let x = a.x - b.x;
            if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
            else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }

            let y = a.y - b.y;
            if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
            else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        function generateDistanceMap() {
            distanceMap = Array(cols).fill().map(() => Array(rows).fill(Infinity));
            distanceMap[goal.x][goal.y] = 0;
            let queue = [{x: goal.x, y: goal.y}];

            while(queue.length > 0) {
                let curr = queue.shift();
                let cell = grid[curr.x][curr.y];

                if (!cell.walls[0] && distanceMap[curr.x][curr.y-1] === Infinity) { distanceMap[curr.x][curr.y-1] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y-1}); }
                if (!cell.walls[1] && distanceMap[curr.x+1][curr.y] === Infinity) { distanceMap[curr.x+1][curr.y] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x+1, y: curr.y}); }
                if (!cell.walls[2] && distanceMap[curr.x][curr.y+1] === Infinity) { distanceMap[curr.x][curr.y+1] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x, y: curr.y+1}); }
                if (!cell.walls[3] && distanceMap[curr.x-1][curr.y] === Infinity) { distanceMap[curr.x-1][curr.y] = distanceMap[curr.x][curr.y] + 1; queue.push({x: curr.x-1, y: curr.y}); }
            }
        }

        function startTeleport(b) {
            if (b.state !== 'normal') return;
            b.state = 'teleport_out';
            b.stateTimer = 1.0;
            let rx = goal.x, ry = goal.y;
            
            let isValidDestination = false;
            let attempts = 0;
            while (!isValidDestination) { 
                rx = Math.floor(Math.random() * cols); 
                ry = Math.floor(Math.random() * rows); 
                isValidDestination = true;

                // Cannot teleport onto the goal
                if (rx === goal.x && ry === goal.y) isValidDestination = false;
                
                // Cannot teleport onto a power-up
                if (powerUps.some(p => p.x === rx && p.y === ry)) isValidDestination = false;

                // Ensure teleporting player is not placed within 10 cells of the goal
                if (distanceMap.length > 0 && distanceMap[rx] && distanceMap[rx][ry] !== undefined) {
                    if (attempts < 200 && distanceMap[rx][ry] <= 10) isValidDestination = false;
                }
                
                attempts++;
            }
            
            b.targetGridX = rx; b.targetGridY = ry;
        }

        function triggerTeleport(triggeringBlazer) {
            blazers.forEach(b => { if (b !== triggeringBlazer) startTeleport(b); });
        }

        // --- MATCH & ROUND LOGIC ---
        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            let millis = Math.floor(ms % 1000);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
        }

        function updateScoreboard() {
            const sorted = [...blazers].sort((a, b) => {
                const na = parseInt(a.id.replace(/\D/g, '')) || 0;
                const nb = parseInt(b.id.replace(/\D/g, '')) || 0;
                return na - nb;
            });
            // Group players by win count (capped at 2 since 3 = instant win)
            const groups = [[], [], []];
            sorted.forEach(b => {
                const w = Math.min(scores[b.id] ?? 0, 2);
                const num = b.id.replace(/\D/g, '');
                groups[w].push(`<span style="color:${b.color}">P${num}</span>`);
            });
            const GOAL = `<svg width="13" height="13" viewBox="0 0 100 100" style="vertical-align:-1px"><polygon class="goal-star-poly" points="50,4 61,36 94,36 67,56 77,87 50,68 23,87 33,56 6,36 39,36" fill="none" stroke="#00ffff" stroke-width="9"/><circle cx="50" cy="50" r="10" fill="#ffffff"/></svg>`;
            const headers = ['', GOAL, GOAL + GOAL];
            scoreboardElement.innerHTML = headers.map((h, i) =>
                `<div class="score-col">` +
                    `<div class="score-header">${h}</div>` +
                    `<div class="score-players">${groups[i].join(', ')}</div>` +
                `</div>`
            ).join('');
        }

        function initMatch() {
            // Remove focus from any clicked UI buttons so pressing Spacebar doesn't trigger them
            if (document.activeElement) {
                document.activeElement.blur();
            }

            postMatchLayer.classList.remove('winner-pulse');

            parseLobby();
            if (activePlayersData.length === 0) return; // Need at least 1 player

            scores = {};
            activePlayersData.forEach(p => scores[p.id] = 0);
            
            matchTime = 0;
            roundTimes = []; // Clear previous match's round times
            
            initialMenu.classList.add('hidden');
            lobbyLayer.classList.add('hidden');
            postMatchLayer.classList.add('hidden');
            hud.classList.remove('hidden');
            hudBar.classList.remove('hidden');

            // Clear any leftover blazers; players are created fresh via onStateChange.
            blazers = [];
            updateScoreboard();

            initRound();
        }

        function initRound() {
            gameState = 'INITIALIZING'; // Temporarily change state to block draw() recursion

            // Always build a local grid so drawMaze has a valid 2D array.
            // For networked play this placeholder is overwritten by the first onStateChange.
            generateMaze();

            shockwaves = [];
            particles = [];
            rockets = [];
            smokePuffs = [];
            powerUpBursts = [];
            powerUps = []; // Will be repopulated by server state
            screenShake = 0;
            
            resizeCanvas(); // Safe to resize and draw now that the new maze grid is generated!
            
            gameState = 'PLAYING';
            window.electronAPI?.setRichPresence('Racing');
            postMatchLayer.classList.add('hidden');
            lastTime = performance.now();
            roundStartTime = performance.now();
            if (roundTimes.length === 0) gameStartLabelTime = performance.now();
            Synth.muffle(false);
        }

        function returnToMenu() {
            window.electronAPI?.closeSteamLobby();
            window.electronAPI?.setRichPresence('In Menu');
            if (typeof room !== 'undefined' && room) {
                room.leave();
                room = null;
            }
            setButtonLoading(quickStartBtn, false);
            setButtonLoading(startBtn, false);
            setButtonLoading(joinFriendBtn, false);
            gameState = 'MENU';
            postMatchLayer.classList.add('hidden');
            postMatchLayer.classList.remove('winner-pulse');
            hud.classList.add('hidden');
            hudBar.classList.add('hidden');
            lobbyLayer.classList.add('hidden');
            initialMenu.classList.remove('hidden');
            Synth.muffle(true);
            
            generateMaze();
            blazers = [];
            powerUps = [];
            particles = [];
            shockwaves = [];
            rockets = [];
            updateDpad();
            draw(true);
        }

        // --- DRAW LOOP ---
        function drawMaze() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            // --- TENSION BUILDER: Pulse background if someone is close to winning ---
            let closestBlazer = null;
            let minDist = Infinity;
            if (gameState === 'PLAYING' && distanceMap.length > 0) {
                blazers.forEach(blazer => {
                    if (blazer.state === 'normal') {
                        let d = distanceMap[blazer.gridX][blazer.gridY];
                        if (d < minDist) {
                            minDist = d;
                            closestBlazer = blazer;
                        }
                    }
                });
            }

            if (closestBlazer && minDist <= 10) {
                const tension = 1 - (minDist / 10);
                const pulse = (Math.sin(performance.now() / 150) + 1) / 2;
                ctx.fillStyle = closestBlazer.color;
                ctx.globalAlpha = tension * pulse * 0.15;
                ctx.fillRect(0, 0, width, height);
                ctx.globalAlpha = 1.0;
            }

            ctx.strokeStyle = colors.wall;
            ctx.lineWidth = 4;
            ctx.lineCap = 'square';
            
            ctx.beginPath();
            if (grid && grid.length > 0) {
                for (let x = 0; x < cols; x++) {
                    for (let y = 0; y < rows; y++) {
                        const cell = grid[x][y];
                        if (!cell || !cell.walls) continue;
                        
                        let cx = x * cellSize, cy = y * cellSize;
                        // Walls: [top, right, bottom, left]
                        if (cell.walls[0]) { ctx.moveTo(cx, cy); ctx.lineTo(cx + cellSize, cy); }
                        if (cell.walls[1]) { ctx.moveTo(cx + cellSize, cy); ctx.lineTo(cx + cellSize, cy + cellSize); }
                        if (cell.walls[2]) { ctx.moveTo(cx, cy + cellSize); ctx.lineTo(cx + cellSize, cy + cellSize); }
                        if (cell.walls[3]) { ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + cellSize); }
                    }
                }
            }
            ctx.stroke();
            
            const gx = goal.x * cellSize + cellSize / 2, gy = goal.y * cellSize + cellSize / 2;
            const time = performance.now() / 500;
            
            ctx.save();
            ctx.translate(gx, gy);

            // 5 rainbow rays
            ctx.rotate(time * 2.0);
            for (let i = 0; i < 5; i++) {
                ctx.rotate(Math.PI * 2 / 5);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(cellSize * 0.16, cellSize * 0.72);
                ctx.lineTo(-cellSize * 0.16, cellSize * 0.72);
                const rayHue = (i * 72 + time * 100) % 360;
                const alpha = 0.15 + Math.sin(time * 2) * 0.1;
                ctx.fillStyle = `hsla(${rayHue}, 100%, 50%, ${alpha})`;
                ctx.fill();
            }

            // Counter-rotating star body
            ctx.rotate(-time * 1.5);
            const pulse = (Math.sin(time * 3) + 1) / 2;
            const outerR = cellSize * 0.54 + pulse * cellSize * 0.04;
            const innerR = cellSize * 0.22;
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const angle = i * Math.PI / 5 - Math.PI / 2;
                const r = i % 2 === 0 ? outerR : innerR;
                const px = Math.cos(angle) * r;
                const py = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = '#050510';
            ctx.fill();
            const starHue = (time * 150) % 360;
            ctx.lineWidth = 2;
            ctx.strokeStyle = `hsl(${starHue}, 100%, 60%)`;
            ctx.shadowBlur = 18 + pulse * 10;
            ctx.shadowColor = `hsl(${starHue}, 100%, 60%)`;
            ctx.stroke();

            // Central bright spark
            ctx.beginPath();
            ctx.arc(0, 0, cellSize * 0.08, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 20;
            const sparkHue = (time * 300) % 360;
            ctx.shadowColor = `hsl(${sparkHue}, 100%, 50%)`;
            ctx.fill();

            ctx.restore();
        }

        function drawSmokePuffs() {
            const SMOKE_MS = 1000;
            const now = performance.now();
            smokePuffs = smokePuffs.filter(puff => {
                const progress = Math.min((now - puff.startTime) / SMOKE_MS, 1);
                if (progress >= 1) return false;

                const fromPx = puff.fromX * cellSize + cellSize / 2;
                const fromPy = puff.fromY * cellSize + cellSize / 2;
                const toPx   = puff.toX   * cellSize + cellSize / 2;
                const toPy   = puff.toY   * cellSize + cellSize / 2;

                // Drift slowly toward destination — fades well before arriving
                const cx = fromPx + (toPx - fromPx) * progress * 0.28;
                const cy = fromPy + (toPy - fromPy) * progress * 0.28;

                // Cloud expands as it disperses
                const puffR  = cellSize * (0.22 + progress * 0.38);
                const alpha  = (1 - progress) * 0.38;

                cloudOffsets.forEach(o => {
                    ctx.beginPath();
                    ctx.arc(cx + o.dx * puffR * 1.3, cy + o.dy * puffR * 1.3, puffR * o.rs, 0, Math.PI * 2);
                    ctx.fillStyle = puff.color;
                    ctx.globalAlpha = alpha;
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = puff.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                ctx.globalAlpha = 1;
                return true;
            });
        }

        function drawPowerUps() {
            const time = performance.now() / 600;
            powerUps.forEach(p => {
                const px = p.x * cellSize + cellSize / 2, py = p.y * cellSize + cellSize / 2;
                ctx.save();
                ctx.translate(px, py);
                if (p.type === 'opponents') {
                    const n = playerColors.length;
                    const r = cellSize * 0.3;
                    const gapAngle = 5 / r;
                    const sliceAngle = (Math.PI * 2) / n;
                    const arcAngle = Math.max(0, sliceAngle - gapAngle);
                    ctx.rotate(time);
                    playerColors.forEach((col, i) => {
                        const startA = i * sliceAngle + gapAngle / 2;
                        for (let pass = 0; pass < 3; pass++) {
                            ctx.beginPath();
                            ctx.arc(0, 0, r, startA, startA + arcAngle);
                            ctx.lineWidth = 2;
                            ctx.strokeStyle = col;
                            ctx.shadowBlur = [60, 30, 12][pass];
                            ctx.shadowColor = col;
                            ctx.stroke();
                        }
                        ctx.shadowBlur = 0;
                    });
                } else if (p.type === 'self') {
                    ctx.rotate(-time);
                    ctx.beginPath();
                    ctx.arc(0, 0, cellSize * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = colors.bg;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = colors.powerupSelf;
                    ctx.setLineDash([5, 5]);
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = colors.powerupSelf;
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else if (p.type === 'rocket') {
                    const pulse = 1 + Math.sin(time * 3) * 0.1;
                    ctx.scale(pulse, pulse);
                    ctx.beginPath();
                    ctx.moveTo(0, -cellSize * 0.25);
                    ctx.lineTo(cellSize * 0.15, cellSize * 0.15);
                    ctx.lineTo(0, cellSize * 0.05);
                    ctx.lineTo(-cellSize * 0.15, cellSize * 0.15);
                    ctx.closePath();
                    ctx.fillStyle = '#ff3300';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff3300';
                    ctx.fill();
                }
                ctx.restore();
            });

            // Burst animations for collected opponents power-ups
            const BURST_MS = 600;
            const burstNow = performance.now();
            powerUpBursts = powerUpBursts.filter(burst => {
                const progress = Math.min((burstNow - burst.startTime) / BURST_MS, 1);
                if (progress >= 1) return false;

                const px = burst.gridX * cellSize + cellSize / 2;
                const py = burst.gridY * cellSize + cellSize / 2;
                const radius = cellSize * 0.32;

                ctx.save();
                ctx.translate(px, py);

                // Collector colour: fills instantly, fades out
                const fillAlpha = progress < 0.1 ? 1 : Math.max(0, 1 - (progress - 0.1) / 0.9);
                ctx.globalAlpha = fillAlpha;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fillStyle = burst.hitColor;
                ctx.shadowBlur = 15;
                ctx.shadowColor = burst.hitColor;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Other wedges fly toward the player they represent, fading as they reach ~8 cells out
                const maxDist = cellSize * 2.8;
                burst.otherPlayers.forEach(p => {
                    const dist = progress * maxDist;
                    const pieceAlpha = Math.max(0, 1 - progress);
                    ctx.globalAlpha = pieceAlpha;
                    ctx.save();
                    ctx.translate(Math.cos(p.angle) * dist, Math.sin(p.angle) * dist);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    const spread = Math.PI / 6;
                    ctx.arc(0, 0, radius, p.angle - spread, p.angle + spread);
                    ctx.closePath();
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.restore();
                });

                ctx.globalAlpha = 1;
                ctx.restore();
                return true;
            });
        }

        function draw(force = false) {
            if (gameState === 'MENU' && !force) return;
            pollGamepads();

            const now = performance.now();
            const dt = now - lastTime;
            lastTime = now;

            ctx.save();
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake, sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
                screenShake -= dt * 0.05; 
                if (screenShake < 0) screenShake = 0;
            }

            drawMaze();
            drawPowerUps();

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                if (sw.update(dt)) sw.draw(); else shockwaves.splice(i, 1);
            }

            blazers.sort((a, b) => (a.isPlayer === b.isPlayer) ? 0 : a.isPlayer ? 1 : -1);
            blazers.forEach(blazer => { blazer.update(dt); blazer.draw(); });

            // Expand/contract ring — first game only, synced to label timing
            if (gameStartLabelTime !== null) {
                const ringElapsed = now - gameStartLabelTime;
                const ringDuration = 2000;
                const halfDuration = ringDuration / 2;
                if (ringElapsed < ringDuration) {
                    const goalPx = goal.x * cellSize + cellSize / 2;
                    const goalPy = goal.y * cellSize + cellSize / 2;
                    ctx.save();
                    blazers.forEach(b => {
                        if (!b.isLocal) return;
                        const dx = goalPx - b.pixelX;
                        const dy = goalPy - b.pixelY;
                        const maxRadius = Math.sqrt(dx * dx + dy * dy);
                        let radius, alpha;
                        if (ringElapsed < halfDuration) {
                            const t = ringElapsed / halfDuration;
                            radius = maxRadius * (1 - Math.pow(1 - t, 2));
                            alpha = 1;
                        } else {
                            const t = (ringElapsed - halfDuration) / halfDuration;
                            radius = maxRadius * Math.pow(1 - t, 2);
                            alpha = 1 - t * 0.5;
                        }
                        if (radius < 2) return;
                        ctx.beginPath();
                        ctx.arc(b.pixelX, b.pixelY, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = b.color;
                        ctx.globalAlpha = alpha * 0.75;
                        ctx.lineWidth = Math.max(1.5, cellSize * 0.07);
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = b.color;
                        ctx.stroke();
                    });
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            }

            // Player identification labels — first game only, fade over 2 s
            if (gameStartLabelTime !== null) {
                const labelElapsed = now - gameStartLabelTime;
                if (labelElapsed < 2000) {
                    const alpha = 1 - labelElapsed / 2000;
                    const fontSize = Math.round(cellSize * 0.55);
                    ctx.save();
                    ctx.font = `bold ${fontSize}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    blazers.forEach(b => {
                        if (!b.isLocal) return;
                        const rawLabel = schemeNames[b.controlScheme] ||
                            (b.controlScheme || '?').replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
                        // Split by spaces; "/" merges onto the preceding word's line
                        const tokens = rawLabel.split(' ');
                        const lines = [];
                        for (const tok of tokens) {
                            if (tok === '/' && lines.length > 0) lines[lines.length - 1] += ' /';
                            else lines.push(tok);
                        }
                        const lineH = fontSize * 1.3;
                        const lx = b.pixelX;
                        const goBelow = (b.pixelY - cellSize * 0.72) < fontSize;
                        const blockCenter = goBelow ? b.pixelY + cellSize * 0.72 : b.pixelY - cellSize * 0.72;
                        const ly0 = blockCenter - (lines.length - 1) * lineH / 2;
                        lines.forEach((line, i) => {
                            const ly = ly0 + i * lineH;
                            const tw = ctx.measureText(line).width;
                            const clampedLx = Math.max(tw / 2, Math.min(width - tw / 2, lx));
                            ctx.globalAlpha = alpha * 0.85;
                            ctx.lineWidth = fontSize * 0.25;
                            ctx.strokeStyle = '#000';
                            ctx.shadowBlur = 0;
                            ctx.strokeText(line, clampedLx, ly);
                            ctx.globalAlpha = alpha;
                            ctx.fillStyle = b.color;
                            ctx.shadowBlur = 14;
                            ctx.shadowColor = b.color;
                            ctx.fillText(line, clampedLx, ly);
                        });
                    });
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.restore();
                } else {
                    gameStartLabelTime = null;
                }
            }

            drawSmokePuffs();

            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                if (r.update(dt)) r.draw(); else rockets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.update(dt)) p.draw(); else particles.splice(i, 1);
            }

            // In-game round over celebration overlay
            if (gameState === 'ROUND_OVER_COUNTDOWN') {
                roundCountdown -= dt;
                const secondsLeft = Math.ceil(roundCountdown / 1000);

                ctx.save();

                const titleSize = Math.max(20, width * 0.06);
                const subSize = Math.max(14, width * 0.04);

                // Slight dark bar for readability
                ctx.fillStyle = "rgba(5, 5, 16, 0.7)";
                ctx.fillRect(0, height / 2 - titleSize * 1.5, width, titleSize * 3.8);

                ctx.font = `bold ${titleSize}px monospace`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 20;
                ctx.shadowColor = currentWinner.color;
                ctx.fillStyle = currentWinner.color;
                ctx.fillText(`${currentWinner.id} Wins Round!`, width / 2, height / 2 - titleSize * 0.2);

                ctx.fillStyle = "#fff";
                ctx.font = `bold ${subSize}px monospace`;
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 5;
                if (secondsLeft > 0) {
                    ctx.fillText(`${secondsLeft} second${secondsLeft !== 1 ? 's' : ''} to next round...`, width / 2, height / 2 + subSize * 1.5);
                } else {
                    ctx.fillText(`Next round starting...`, width / 2, height / 2 + subSize * 1.5);
                }

                if (!room && secondsLeft > 0) {
                    ctx.fillStyle = "#aaa";
                    ctx.font = `normal ${subSize * 0.8}px monospace`;
                    ctx.shadowBlur = 2;
                    ctx.fillText(`(Press Space to skip)`, width / 2, height / 2 + subSize * 2.8);
                }

                ctx.restore();

                if (roundCountdown <= 0) {
                    if (roundFlashStart === null) roundFlashStart = performance.now();
                    if (!room) initRound(); // networked play uses round_reset message instead
                }
            }

            ctx.restore();

            // Round-transition white flash — full white for 1s then instant cut
            if (roundFlashStart !== null) {
                const elapsed = performance.now() - roundFlashStart;
                if (elapsed >= 1000) {
                    roundFlashStart = null;
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                }
            }

            if (gameState !== 'MENU') {
                if (animationId) cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(() => draw(false));
            }
        }

        // --- INPUT HANDLING ---
        const schemeNames = { WASD: 'WASD', TFGH: 'TFGH', IJKL: 'IJKL', Arrows: 'Arrow Keys', Numpad: 'Numpad (8456)', TouchMouse: 'Touch / Mouse' };

        const controlsMap = {
            'WASD': { up: ['w', 'W'], right: ['d', 'D'], down: ['s', 'S'], left: ['a', 'A'] },
            'TFGH': { up: ['t', 'T'], right: ['h', 'H'], down: ['g', 'G'], left: ['f', 'F'] },
            'IJKL': { up: ['i', 'I'], right: ['l', 'L'], down: ['k', 'K'], left: ['j', 'J'] },
            'Arrows': { up: ['ArrowUp'], right: ['ArrowRight'], down: ['ArrowDown'], left: ['ArrowLeft'] },
            'Numpad': { up: ['8', 'Numpad8'], right: ['6', 'Numpad6'], down: ['5', 'Numpad5'], left: ['4', 'Numpad4'] },
            'TouchMouse': { up: [], right: [], down: [], left: [] }
        };

        // When there is only one local player, merge all keyboard schemes so any keys work.
        function effectiveControlMap(blazer) {
            const localCount = blazers.filter(b => {
                if (!b.isPlayer) return false;
                return (room && room.sessionId)
                    ? (b.sessionId === room.sessionId || b.isSecondaryLocal)
                    : b.isLocal;
            }).length;
            if (localCount === 1) {
                return {
                    up:    Object.values(controlsMap).flatMap(m => m.up),
                    right: Object.values(controlsMap).flatMap(m => m.right),
                    down:  Object.values(controlsMap).flatMap(m => m.down),
                    left:  Object.values(controlsMap).flatMap(m => m.left),
                };
            }
            return controlsMap[blazer.controlScheme];
        }

        // --- GAMEPAD SUPPORT ---
        const gamepadPrevState = {};
        const gamepadABtnPrev = {};

        function getGamepadDirs(gp) {
            const DEADZONE = 0.3;
            return {
                up:    !!(gp.buttons[12]?.pressed) || gp.axes[1] < -DEADZONE,
                right: !!(gp.buttons[15]?.pressed) || gp.axes[0] >  DEADZONE,
                down:  !!(gp.buttons[13]?.pressed) || gp.axes[1] >  DEADZONE,
                left:  !!(gp.buttons[14]?.pressed) || gp.axes[0] < -DEADZONE,
            };
        }

        function pollGamepads() {
            const gamepads = navigator.getGamepads();
            for (let gpIdx = 0; gpIdx <= 7; gpIdx++) {
                const gp = gamepads[gpIdx];
                const scheme = `controller_${gpIdx + 1}`;
